# TODO Reviewed ??-??-2026.
# Build configuration: see CONFIGURATION.md at the repository root.
# Run the repository build-setup recipe to link target/build to the central checkout slot.

[build]
rustc-wrapper = "sccache"
incremental = false
# Direct Cargo and workspace justfiles use sccache with incremental compilation disabled.

# The justfile/Makefile.toml reads CODE_*_ROOT overrides (with Windows and XDG defaults) and exports per-checkout Cargo output paths; use its cargo command for these roots.
target-dir = "target"
build-dir = "build"

[env]
# The workspace justfiles replace the per-checkout base with the registered worktree list.
# Direct Cargo defaults to this checkout; the just runner supplies the registered worktree list.
SCCACHE_BASEDIRS = { value = ".", relative = true }

[env.SCCACHE_CACHE_SIZE]
value = "45G"
force = true

[profile.dev]
lto = "off"
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.debug]
debug = 2

[profile.debug.package."*"]
opt-level = 1
debug = 0

[profile.ci]
inherits = "dev"

[profile.tools]
inherits = "dev"
opt-level = 2


# Cargo defaults reference (Cargo 1.100.0). Comments only.
#
# [build]
# target = <host>
# target-dir = "target"
# build-dir = <unset; defaults to target-dir>
# rustc-wrapper = <unset>
# incremental = <profile default>
#
# [env]
# <variable> = <unset>
#
# [net]
# retry = 3
# git-fetch-with-cli = false
# offline = false
#
# [term]
# quiet = false
# verbose = false
# color = "auto"
# hyperlinks = true
# unicode = true
# progress.when = "auto"
# progress.width = 80
# progress.term-integration = true
#
# [alias]
# b = "build"
# c = "check"
# d = "doc"
# t = "test"
# r = "run"
# rm = "remove"
#
# [profile.dev]
# opt-level = 0
# debug = true
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = true
# overflow-checks = true
# lto = false
# panic = "unwind"
# incremental = true
# codegen-units = 256 when incremental is enabled; otherwise 16
# rpath = false
#
# [profile.dev.package."*"]
# opt-level = 0
#
# [profile.dev.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.debug]
# inherits = "dev"
#
# [profile.test]
# inherits = "dev"
#
# [profile.release]
