# Run configure-cargo-host through this repo's runner once per host for direct Cargo defaults.
# Use the runner's cargo command for isolated per-checkout outputs and cache base directories.
# TODO Reviewed ??-??-2026.

# Paths are relative to the repository root. `just build-setup` creates junctions
# on Windows or symlinks on Linux to persistent directories outside the checkout.
[build]
rustc-wrapper = "sccache"
incremental = false
# Direct Cargo and workspace justfiles use sccache with incremental compilation disabled.

# The justfile/Makefile.toml reads CODE_*_ROOT overrides (with Windows and XDG defaults) and exports per-checkout Cargo output paths; use its cargo command for these roots.
[env]
# The workspace justfiles replace the per-checkout base with the registered worktree list.
SCCACHE_DIR = { value = ".sccache", relative = true }
# Direct Cargo defaults to this checkout; the just runner supplies the registered worktree list.
SCCACHE_BASEDIRS = { value = ".", relative = true }
SCCACHE_CACHE_SIZE = { value = "35G", force = true }
