# Paths are relative to the repository root. `just build-setup` creates junctions
# on Windows or symlinks on Linux to persistent directories outside the checkout.
[build]
rustc-wrapper = "sccache"
incremental = false
target-dir = "target"
build-dir = "build"
# Direct Cargo uses sccache with incrementals disabled; workspace justfiles override to no sccache and incrementals enabled.

# Use just cargo or cargo-make for external per-checkout output roots.
[env]
# The workspace justfiles can override these cache settings when they disable sccache.
SCCACHE_DIR = { value = ".sccache", relative = true }
# Keep a caller's shared worktree list; fall back to this checkout when unset.
SCCACHE_BASEDIRS = { value = ".", relative = true }
SCCACHE_CACHE_SIZE = { value = "20G", force = true }
