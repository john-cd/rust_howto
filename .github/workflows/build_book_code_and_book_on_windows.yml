name: Build book code (and book) on Windows

on:
  push:
    branches: [main]
    paths:
      - 'bk/**'
      - 'tools/**'
      - '.devcontainer/**'
      - '.github/workflows/**'
      - 'justfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'bk/**'
      - 'tools/**'
      - '.devcontainer/**'
      - '.github/workflows/**'
      - 'justfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

## ---------------------------------------------------------------------

## See `ci.sh` for equivalent steps when using Docker
jobs:
  build-book-code-on-windows:
    name: Build book code on Windows
    runs-on: windows-2025 # required for winget
    steps:

      # - name: Display directory tree (debug)
      #   run: |
      #     tree $env:userprofile\.cargo

      # Checks out your repository under $GITHUB_WORKSPACE
      - name: Code checkout (clones the Git repository)
        uses: actions/checkout@v6

      - name: Load pinned book tool versions
        shell: pwsh
        run: |
          Get-Content '.devcontainer/.env' | ForEach-Object {
            if ($_ -match '^(?<name>MDBOOK_[A-Z_]+|CARGO_NEXTEST_VERSION|RUST_VERSION|JUST_VERSION)="(?<value>[^"]+)"$') {
              "$($Matches.name)=$($Matches.value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if (-not $env:MDBOOK_VERSION) { throw 'MDBOOK_VERSION was not found in .devcontainer/.env' }

      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
      # Install paths for Rust / Cargo in https://github.com/actions/runner-images/blob/main/images/windows/scripts/build/Install-Rust.ps1
      - name: Cache Cargo registry and dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/binstall/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            bk/target/
            tools/target/
          key: rust_howto-book-${{ runner.os }}-cargo-${{ hashFiles('.devcontainer/.env', '**/Cargo.lock') }}
          restore-keys: |
            rust_howto-book-${{ runner.os }}-cargo-

      # - name: Install `protoc` and `jq` (winget)
      #   run: |
      #     winget install protobuf --force --accept-package-agreements --accept-source-agreements --silent
      #     winget install jqlang.jq --force --accept-package-agreements --accept-source-agreements --silent
      #     $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Install `protoc` and `jq` (choco)
        run: |
          choco install jq protoc --confirm --no-progress
        # --limit-output

      - name: Protoc version (debug)
        run: protoc --version

      - name: Install `cargo binstall`
        shell: pwsh
        run: Set-ExecutionPolicy Unrestricted -Scope Process; iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content

      - name: Install mdBook
        run: |
          cargo binstall --version $env:MDBOOK_VERSION --no-confirm mdbook
          cargo binstall --version $env:MDBOOK_LINKCHECK_VERSION --no-confirm mdbook-linkcheck
          cargo binstall --version $env:MDBOOK_PRIVATE_VERSION --no-confirm mdbook-private

      - name: Install mdBook indexing from its locked source
        run: cargo install --locked --force --version $env:MDBOOK_INDEXING_VERSION mdbook-indexing

      - name: Install Nextest
        run: cargo binstall --version $env:CARGO_NEXTEST_VERSION --no-confirm --secure cargo-nextest

      - name: Install Just
        run: cargo binstall --version $env:JUST_VERSION --no-confirm --secure just

      - name: Install `mdbook-utils`
        run: cargo install --git https://github.com/john-cd/mdbook-utils --rev $env:MDBOOK_UTILS_REV --locked --force mdbook-utils

      - name: Update Rust; Install nightly Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup toolchain install nightly
          rustup component add rustfmt --toolchain nightly
          rustup show

      - name: Output Rust version (debug)
        run: rustup --version

      - name: Format
        run: cargo +nightly fmt --all --check
        working-directory: '.\bk\crates'

      - name: Fetch
        run: cargo fetch
        working-directory: '.\bk\crates'

      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci
        working-directory: '.\bk\crates'

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings
        working-directory: '.\bk\crates'

      - name: Run tests
        run: |
          cargo nextest run --workspace --all-targets --locked --cargo-profile ci --profile ci --hide-progress-bar
          cargo test --workspace --doc --locked --profile ci -- --show-output
        working-directory: '.\bk\crates'

      - name: Build / release the tools, incl. mdbook-scrub
        run: cargo +nightly build --bins --locked --release -Z unstable-options --artifact-dir "..\bin"
        working-directory: '.\tools'

      - name: Format, lint, build, and test helper workspace
        run: |
          cargo +nightly fmt --all --check
          cargo build --workspace --all-targets --locked --all-features
          cargo clippy --workspace --all-targets --locked --all-features -- --deny warnings
          cargo nextest run --workspace --all-targets --locked --all-features
          cargo test --workspace --doc --locked --all-features
        working-directory: '.\tools'

      - name: Build the book
        run: just bb
        working-directory: '.\bk'
