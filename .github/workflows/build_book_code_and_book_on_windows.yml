# TODO Reviewed ??-??-2026.

## Builds and tests the book code and the `tools/` workspace, and renders the book, natively on Windows.
## The Linux equivalent runs in Docker (`build_deploy_book.yml`, `build_tools.yml`).
name: Build book code (and book) on Windows

on:
  push:
    branches: [develop]
    paths:
      - "bk/**"
      - "tools/**"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "justfile"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
  pull_request:
    branches: [develop]
    paths:
      - "bk/**"
      - "tools/**"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "justfile"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target/build
  ## `.cargo/config.toml` enables `sccache`, which CI does not install; `rust-cache` is used instead.
  RUSTC_WRAPPER: ""

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

## Same commands as on Linux: use bash (Git Bash) rather than PowerShell.
defaults:
  run:
    shell: bash

## See `ci.sh` for equivalent steps when using Docker
jobs:
  build-book-code-on-windows:
    name: Build book code on Windows
    runs-on: windows-2025
    steps:
      - name: Code checkout (clones the Git repository)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load pinned tool versions
        uses: ./.github/actions/load-pinned-versions

      - name: Set up Rust (pinned stable + nightly rustfmt, cached)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-workspaces: |
            bk/crates -> ../../target
            tools -> ../target

      - name: Install `protoc`, `jq`, NASM and Ninja (choco)
        shell: pwsh
        run: |
          choco install jq protoc nasm ninja --confirm --no-progress
          # NASM (required by aws-lc-sys) is not added to PATH by its installer.
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'

      - name: Protoc version (debug)
        run: protoc --version

      - name: Install mdBook, mdBook linkcheck, Nextest, Just and cargo-deny (prebuilt binaries)
        # taiki-e/install-action v2.87.30
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-linkcheck@${{ env.MDBOOK_LINKCHECK_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},just@${{ env.JUST_VERSION }},cargo-deny

      ## `cargo install` skips tools already restored from the cache.
      - name: Install mdBook indexing from its locked source
        run: cargo install --locked --version "$MDBOOK_INDEXING_VERSION" mdbook-indexing

      - name: Install `mdbook-utils`
        run: cargo install --git https://github.com/john-cd/mdbook-utils --rev "$MDBOOK_UTILS_REV" --locked mdbook-utils

      - name: Audit dependencies with cargo-deny (#51)
        run: cargo deny --manifest-path Cargo.toml --workspace --config deny.toml check all --hide-inclusion-graph
        working-directory: bk/crates

      - name: Format
        run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
        working-directory: bk/crates

      - name: Fetch
        run: cargo fetch
        working-directory: bk/crates

      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci
        working-directory: bk/crates

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings
        working-directory: bk/crates

      - name: Run tests and fail on process leaks
        run: |
          cargo nextest run --config-file nextest.toml --workspace --all-targets --locked --cargo-profile ci --profile ci --hide-progress-bar
          cargo test --workspace --doc --locked --profile ci -- --show-output
        working-directory: bk/crates

      - name: Build / release the tools, incl. mdbook-scrub
        run: cargo +"$RUSTFMT_TOOLCHAIN" build --bins --locked --release -Z unstable-options --artifact-dir "../bin"
        working-directory: tools

      - name: Format, lint, build, and test helper workspace
        run: |
          cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
          cargo build --workspace --all-targets --locked --all-features
          cargo clippy --workspace --all-targets --locked --all-features -- --deny warnings
          cargo nextest run --workspace --all-targets --locked --all-features
          cargo test --workspace --doc --locked --all-features
        working-directory: tools

      - name: Build the book
        run: |
          python scripts/book/test_refdefs.py
          just bb
          python scripts/book/check_search_index.py
        working-directory: bk
