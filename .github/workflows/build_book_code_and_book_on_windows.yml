# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Build book code (and book) on Windows.
# Purpose: Compile, lint or test the Rust source for the scope selected by the commands below.
# Execution: push, pull_request, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Cost boundary: path filters avoid provisioning this workflow for unrelated changes; include shared
# scripts, pins and manifests when its inputs change.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Builds and tests the book code and the `tools/` workspace, and renders the book, natively on Windows.
## The Linux equivalent runs in Docker (`build_deploy_book.yml`, `build_tools.yml`).
name: Build book code (and book) on Windows

on:
  push:
    branches: [develop]
    paths:
      - "bk/crates/**"
      - "bk/platform/**"
      - "bk/scripts/**"
      - "bk/justfile"
      - "bk/book.toml"
      - "tools/**"
      - "book_tooling"
      - ".gitmodules"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "justfile"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
  pull_request:
    branches: [develop]
    paths:
      - "bk/crates/**"
      - "bk/platform/**"
      - "bk/scripts/**"
      - "bk/justfile"
      - "bk/book.toml"
      - "tools/**"
      - "book_tooling"
      - ".gitmodules"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "justfile"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_INCREMENTAL: "0"
  # Let Cargo pass oversized argument lists directly to rustc via response files.
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

## Same commands as on Linux: use bash (Git Bash) rather than PowerShell.
defaults:
  run:
    shell: bash

## See `ci.sh` for equivalent steps when using Docker
jobs:
  # Job build-book-code-on-windows: Compile, lint or test the Rust source for the scope selected by
  # the commands below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  build-book-code-on-windows:
    timeout-minutes: 120
    name: Build book code on Windows
    runs-on: windows-2025
    steps:
      - name: Code checkout (clones the Git repository)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the mdbook-utils pin against the submodule
        run: python bk/scripts/book/refdefs.py verify-pin
      - name: Check out Book Tooling
        uses: ./.github/actions/checkout-book-tooling
        with:
          token: ${{ secrets.BOOK_TOOLING_TOKEN }}

      - name: Load pinned tool versions
        uses: ./.github/actions/load-pinned-versions

      # Export trusted step outputs for later steps in this job. GITHUB_ENV requires assignments or
      # its explicit multiline syntax; comments in pin files are not assignments.
      - name: Install OpenSSL for Vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The Windows runner does not define VCPKG_INSTALLATION_ROOT.'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKGRS_TRIPLET = 'x64-windows-static-md'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_ROOT" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET" -Encoding utf8
          vcpkg install "openssl:$($env:VCPKGRS_TRIPLET)"

      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust (pinned stable + nightly rustfmt, cached)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-workspaces: |-
            bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main
            later/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main
            tools -> ${{ github.workspace }}/.ci/target/rust_howto/main
            publish -> ${{ github.workspace }}/.ci/target/rust_howto/main
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main

      - name: Install `protoc`, `jq`, NASM and Ninja (choco)
        shell: pwsh
        run: |
          choco install jq protoc nasm ninja --confirm --no-progress
          # NASM (required by aws-lc-sys) is not added to PATH by its installer.
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'

      - name: Protoc version (debug)
        run: protoc --version

      - name: Check minimum supported Rust
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/msrv/book
          CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/msrv/book
          CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/msrv/book
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 check --workspace --all-targets --locked
        working-directory: bk/crates

      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install mdBook, mdBook linkcheck, Nextest, Just and cargo-deny (prebuilt binaries)
        # taiki-e/install-action v2.88.0
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-linkcheck@${{ env.MDBOOK_LINKCHECK_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},just@${{ env.JUST_VERSION }},cargo-deny

      ## `cargo install` skips tools already restored from the cache.
      - name: Install mdBook indexing from its locked source
        run: cargo install --locked --version "$MDBOOK_INDEXING_VERSION" mdbook-indexing

      - name: Install `mdbook-utils`
        run: cargo install --git https://github.com/john-cd/mdbook-utils --rev "$MDBOOK_UTILS_REV" --locked mdbook-utils

      - name: Audit dependencies with cargo-deny (#51)
        run: cargo deny --manifest-path Cargo.toml --workspace --config deny.toml check all --hide-inclusion-graph
        working-directory: bk/crates

      - name: Format
        run: |
          # cargo fmt --all can exceed the Windows command-line length limit.
          package_names=$(cargo +"$RUSTFMT_TOOLCHAIN" metadata --no-deps --locked --format-version 1 | jq -br '.packages[].name')
          test -n "$package_names"
          mapfile -t packages <<< "$package_names"
          for ((offset = 0; offset < ${#packages[@]}; offset += 8)); do
            package_args=()
            for package in "${packages[@]:offset:8}"; do
              package_args+=(-p "$package")
            done
            cargo +"$RUSTFMT_TOOLCHAIN" fmt --check "${package_args[@]}"
          done
        working-directory: bk/crates

      - name: Fetch
        run: cargo fetch
        working-directory: bk/crates

      # Retain real code generation/linking for the requested build scope; a typecheck alone cannot
      # prove linked binaries/examples can be produced.
      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci
        working-directory: bk/crates

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings
        working-directory: bk/crates

      # Run compiled test binaries with the configured Nextest profile. Nextest does not run Rust
      # doctests; retain the separate cargo test --doc step where present.
      - name: Run tests and fail on process leaks
        run: |
          cargo nextest run --config-file .config/nextest.toml --workspace --all-targets --locked --cargo-profile ci --profile ci --hide-progress-bar
          cargo test --workspace --doc --locked --profile ci -- --show-output
        working-directory: bk/crates

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Test examples requiring Rust 1.100
        working-directory: bk/crates/rust_1_100
        run: |
          cargo +"$RUSTFMT_TOOLCHAIN" fmt --check
          cargo clippy --locked --all-targets -- --deny warnings
          cargo test --locked

      - name: Build / release the tools, incl. mdbook-scrub
        run: cargo +"$RUSTFMT_TOOLCHAIN" build --bins --locked --release -Z unstable-options --artifact-dir "../bin"
        working-directory: tools

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Format, lint, build, and test helper workspace
        run: |
          cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
          cargo build --workspace --all-targets --locked --all-features
          cargo clippy --workspace --all-targets --locked --all-features -- --deny warnings
          cargo nextest run --workspace --all-targets --locked --all-features
          cargo test --workspace --doc --locked --all-features
        working-directory: tools

      - name: Build the book
        env:
          MDBOOK_TOOLS_PREINSTALLED: "true"
        run: |
          python scripts/book/test_refdefs.py
          just bb
        working-directory: bk
