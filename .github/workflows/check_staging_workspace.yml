# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Check staging workspace (advisory).
# Purpose: Validate the maintained source with the tools and commands listed in this job.
# Execution: schedule, workflow_dispatch. Trigger branches/paths below are the authoritative input
# boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Advisory compile check of the staging workspace `later/crates`.
##
## Policy: `later/crates` is work-in-progress content that is not built or published by this
## repository, so it must never block a release or a pull request. This workflow is isolated from
## the required ones: it runs weekly and on demand, and the job is `continue-on-error`.
## Promote a crate to `bk/crates` once it should be a required check.
name: Check staging workspace (advisory)

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Job staging-check: Validate the maintained source with the tools and commands listed in this
  # job.
  # Keep compatible checks in the same job to reuse installed dependencies and build outputs;
  # distinct OS/feature entries retain their behavior coverage.
  staging-check:
    name: later/crates (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load pinned tool versions
        uses: ./.github/actions/load-pinned-versions

      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust toolchains and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          nightly: skip
          cache-workspaces: |-
            bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main
            later/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main
            tools -> ${{ github.workspace }}/.ci/target/rust_howto/main
            publish -> ${{ github.workspace }}/.ci/target/rust_howto/main
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main
          cache-key: staging

      - name: Check
        run: cargo check --workspace --all-targets --locked
        working-directory: later/crates
