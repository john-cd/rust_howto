# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Cleanup GitHub Action caches.
# Purpose: Validate the maintained source with the tools and commands listed in this job.
# Execution: workflow_dispatch. Trigger branches/paths below are the authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"actions": "write"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

name: Cleanup GitHub Action caches
on:
  workflow_dispatch:

permissions:
  actions: write

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job cleanup: Validate the maintained source with the tools and commands listed in this job.
  # Keep compatible checks in the same job to reuse installed dependencies and build outputs;
  # distinct OS/feature entries retain their behavior coverage.
  cleanup:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup
        run: |
          echo "Fetching list of cache key"
          cacheKeys=$(gh cache list --limit 100 --json id --jq '.[].id')
          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          while IFS= read -r cacheKey; do
              if [[ -n "$cacheKey" ]]; then
                  gh cache delete "$cacheKey"
              fi
          done <<< "$cacheKeys"
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
