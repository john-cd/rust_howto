# TODO Reviewed ??-??-2026.

name: Test PostgreSQL book example

on:
  pull_request:
    branches: [develop]
    paths:
      - "bk/crates/cats/database/**"
      - ".github/workflows/test-postgres-example.yml"
      - ".github/actions/**"
  push:
    branches: [develop, "codex/**"]
    paths:
      - "bk/crates/cats/database/**"
      - ".github/workflows/test-postgres-example.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-example:
    name: PostgreSQL example integration test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d library"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target/build
      RUSTC_WRAPPER: "" # `.cargo/config.toml` enables sccache, which CI does not install.
      DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=password dbname=library
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load pinned tool versions
        uses: ./.github/actions/load-pinned-versions

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          nightly: "skip"
          components: ""
          cache-workspaces: "bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main\nlater/crates -> ${{ github.workspace
            }}/.ci/target/rust_howto/main\ntools -> ${{ github.workspace }}/.ci/target/rust_howto/main\nplayground -> ${{
            github.workspace }}/.ci/target/rust_howto/main\npublish -> ${{ github.workspace }}/.ci/target/rust_howto/main\n\
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main"

      - name: Run the PostgreSQL CRUD and connection teardown test
        run: cargo test --locked -p database --features postgres --test postgres -- --ignored --test-threads=1
        working-directory: bk/crates
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: '0'
