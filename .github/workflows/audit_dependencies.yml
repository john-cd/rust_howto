# TODO Reviewed ??-??-2026.

## Audits maintained Cargo dependency roots with `cargo deny` (advisories, licenses, bans and sources).
## Configuration: `bk/crates/deny.toml`. Also runs weekly because new advisories appear without code changes.
## Immutable Cargo fixtures under `bk/scripts` are excluded from automated dependency updates/audits.
## Run the repository checks with `just --justfile tools/justfile check-lints` and `check-audit-workflow`.
name: Audit dependencies

on:
  push:
    branches: [develop]
    paths:
      - "bk/crates/Cargo.lock"
      - "bk/platform/Cargo.lock"
      - "bk/platform/Cargo.toml"
      - "bk/platform/**/Cargo.toml"
      - "bk/platform/deny.toml"
      - "bk/crates/Cargo.toml"
      - "bk/crates/**/Cargo.toml"
      - "bk/crates/cats/database/examples/query_builders_orms/toasty_validation/Cargo.lock"
      - "bk/crates/cats/database/examples/query_builders_orms/toasty_validation/Cargo.toml"
      - "bk/crates/cats/database/examples/query_builders_orms/toasty_validation/**/Cargo.toml"
      - "bk/crates/cats/memory_management/allocator_selection/Cargo.lock"
      - "bk/crates/cats/memory_management/allocator_selection/Cargo.toml"
      - "bk/crates/cats/memory_management/allocator_selection/**/Cargo.toml"
      - "later/crates/Cargo.lock"
      - "later/crates/Cargo.toml"
      - "later/crates/**/Cargo.toml"
      - "bk/platform/cats/development_tools_ffi/python_extension/Cargo.lock"
      - "bk/platform/cats/development_tools_ffi/python_extension/Cargo.toml"
      - "bk/platform/cats/development_tools_ffi/python_extension/**/Cargo.toml"
      - "bk/platform/cats/embedded/Cargo.lock"
      - "bk/platform/cats/embedded/Cargo.toml"
      - "bk/platform/cats/embedded/**/Cargo.toml"
      - "bk/platform/cats/gui/vizia/Cargo.lock"
      - "bk/platform/cats/gui/vizia/Cargo.toml"
      - "bk/platform/cats/gui/vizia/**/Cargo.toml"
      - "bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest/Cargo.lock"
      - "bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest/Cargo.toml"
      - "bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest/**/Cargo.toml"
      - "publish/Cargo.lock"
      - "publish/Cargo.toml"
      - "publish/**/Cargo.toml"
      - "tools/Cargo.lock"
      - "book_tooling"
      - ".gitmodules"
      - "tools/Cargo.toml"
      - "tools/**/Cargo.toml"
      - "xmpl/Cargo.lock"
      - "xmpl/Cargo.toml"
      - "xmpl/**/Cargo.toml"
      - "bk/crates/deny.toml"
      - "later/crates/deny.toml"
      - ".github/workflows/audit_dependencies.yml"
  pull_request:
    branches: [develop]
    paths:
      - "bk/crates/Cargo.lock"
      - "bk/platform/Cargo.lock"
      - "bk/platform/Cargo.toml"
      - "bk/platform/**/Cargo.toml"
      - "bk/platform/deny.toml"
      - "bk/crates/Cargo.toml"
      - "bk/crates/**/Cargo.toml"
      - "bk/crates/cats/database/examples/query_builders_orms/toasty_validation/Cargo.lock"
      - "bk/crates/cats/database/examples/query_builders_orms/toasty_validation/Cargo.toml"
      - "bk/crates/cats/database/examples/query_builders_orms/toasty_validation/**/Cargo.toml"
      - "bk/crates/cats/memory_management/allocator_selection/Cargo.lock"
      - "bk/crates/cats/memory_management/allocator_selection/Cargo.toml"
      - "bk/crates/cats/memory_management/allocator_selection/**/Cargo.toml"
      - "later/crates/Cargo.lock"
      - "later/crates/Cargo.toml"
      - "later/crates/**/Cargo.toml"
      - "bk/platform/cats/development_tools_ffi/python_extension/Cargo.lock"
      - "bk/platform/cats/development_tools_ffi/python_extension/Cargo.toml"
      - "bk/platform/cats/development_tools_ffi/python_extension/**/Cargo.toml"
      - "bk/platform/cats/embedded/Cargo.lock"
      - "bk/platform/cats/embedded/Cargo.toml"
      - "bk/platform/cats/embedded/**/Cargo.toml"
      - "bk/platform/cats/gui/vizia/Cargo.lock"
      - "bk/platform/cats/gui/vizia/Cargo.toml"
      - "bk/platform/cats/gui/vizia/**/Cargo.toml"
      - "bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest/Cargo.lock"
      - "bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest/Cargo.toml"
      - "bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest/**/Cargo.toml"
      - "publish/Cargo.lock"
      - "publish/Cargo.toml"
      - "publish/**/Cargo.toml"
      - "tools/Cargo.lock"
      - "book_tooling"
      - ".gitmodules"
      - "tools/Cargo.toml"
      - "tools/**/Cargo.toml"
      - "xmpl/Cargo.lock"
      - "xmpl/Cargo.toml"
      - "xmpl/**/Cargo.toml"
      - "bk/crates/deny.toml"
      - "later/crates/deny.toml"
      - ".github/workflows/audit_dependencies.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## Regression check: the trigger paths must cover every audited workspace.
  check-trigger-paths:
    name: audit workflow trigger paths
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out Book Tooling
        uses: ./.github/actions/checkout-book-tooling
        with:
          token: ${{ secrets.BOOK_TOOLING_TOKEN }}
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
          nightly: skip
          components: ""
      - run: cargo run --manifest-path tools/Cargo.toml --locked -p repo-audit -- sync-lints --check
      - run: cargo run --manifest-path tools/Cargo.toml --locked -p repo-audit -- audit-workflow-paths
      - run: cargo test --manifest-path tools/Cargo.toml --locked -p repo-audit

  cargo-deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ## Advisories change independently of the code, so they do not block merges.
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: bk/crates/Cargo.toml
          command: check ${{ matrix.checks }}
          arguments: >-
            --workspace --config bk/crates/deny.toml
            ${{ matrix.checks == 'advisories' && '--all-features' || '' }}
          command-arguments: --hide-inclusion-graph

  ## Independent Cargo roots use the `later/crates` policy or reuse the book's policy.
  ## This broad matrix remains advisory; the primary book policy checks stay required.
  cargo-deny-other:
    name: cargo deny (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: bk/platform
            config: bk/platform/deny.toml
          - workspace: later/crates
            config: later/crates/deny.toml
          - workspace: tools
            config: bk/crates/deny.toml
          - workspace: xmpl
            config: bk/crates/deny.toml
          - workspace: bk/crates/cats/database/examples/query_builders_orms/toasty_validation
            config: bk/crates/deny.toml
          - workspace: bk/crates/cats/memory_management/allocator_selection
            config: bk/crates/deny.toml
          - workspace: bk/platform/cats/development_tools_ffi/python_extension
            config: bk/platform/deny.toml
          - workspace: bk/platform/cats/embedded
            config: bk/platform/deny.toml
          - workspace: bk/platform/cats/gui/vizia
            config: bk/platform/deny.toml
          - workspace: bk/platform/cats/wasm/examples/wasm_standalone_runtimes/components/guest
            config: bk/platform/deny.toml
          - workspace: publish
            config: bk/crates/deny.toml
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out Book Tooling
        if: matrix.workspace == 'tools'
        uses: ./.github/actions/checkout-book-tooling
        with:
          token: ${{ secrets.BOOK_TOOLING_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.workspace }}/Cargo.toml
          command: check
          arguments: --workspace --config ${{ matrix.config }}
          command-arguments: --hide-inclusion-graph
env:
  ## The cargo-deny action runs in a container without sccache, which .cargo/config.toml sets as the rustc wrapper.
  RUSTC_WRAPPER: ""
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
