# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Test allocator examples.
# Purpose: Compile, lint or test the Rust source for the scope selected by the commands below.
# Execution: pull_request, push, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Cost boundary: path filters avoid provisioning this workflow for unrelated changes; include shared
# scripts, pins and manifests when its inputs change.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

name: Test allocator examples

on:
  pull_request:
    branches: [develop]
    paths:
      - "bk/crates/cats/memory_management/**"
      - ".github/workflows/test-allocator-examples.yml"
      - ".github/actions/**"
  push:
    branches: [develop, "codex/**"]
    paths:
      - "bk/crates/cats/memory_management/**"
      - ".github/workflows/test-allocator-examples.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job allocator-examples: Compile, lint or test the Rust source for the scope selected by the
  # commands below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  allocator-examples:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Load pinned tool versions
        uses: ./.github/actions/load-pinned-versions
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          nightly: "skip"
          components: ""
          cache-workspaces: "bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main\nlater/crates -> ${{ github.workspace
            }}/.ci/target/rust_howto/main\ntools -> ${{ github.workspace }}/.ci/target/rust_howto/main\npublish -> ${{ github.workspace }}/.ci/target/rust_howto/main\n\
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main"
      - name: Test jemalloc on Linux
        run: cargo test --locked -p memory_management --example jemalloc
        working-directory: bk/crates
      - name: Test allocator feature choices
        working-directory: bk/crates/cats/memory_management/allocator_selection
        run: |
          cargo test --locked
          cargo test --locked --features use-mimalloc
          cargo test --locked --features use-jemalloc
          if cargo check --locked --all-features > conflict.log 2>&1; then
            echo "Both allocator features unexpectedly compiled"
            exit 1
          fi
          cat conflict.log
          grep -F "select only one global allocator feature" conflict.log
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
