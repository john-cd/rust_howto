# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Build independent workspaces on Linux.
# Purpose: Compile, lint or test the Rust source for the scope selected by the commands below.
# Execution: push, pull_request, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Cost boundary: path filters avoid provisioning this workflow for unrelated changes; include shared
# scripts, pins and manifests when its inputs change.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Formats, lints and tests the independent example workspaces (`xmpl` and `publish`) on Linux.
## Each is its own Cargo workspace, so the book and tools workflows do not compile them.
## The staging workspace `later/crates` is deliberately excluded here: see `check_staging_workspace.yml`.
name: Build independent workspaces on Linux

on:
  push:
    branches: [develop]
    paths:
      - "xmpl/**"
      - "publish/**"
      - ".github/workflows/build_independent_workspaces.yml"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
      - ".devcontainer/.env"
  pull_request:
    branches: [develop]
    paths:
      - "xmpl/**"
      - "publish/**"
      - ".github/workflows/build_independent_workspaces.yml"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
      - ".devcontainer/.env"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read

concurrency:
  group: independent-workspaces-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Job independent-workspace: Compile, lint or test the Rust source for the scope selected by the
  # commands below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  # Matrix entries are independent runners. Keep OS/toolchain/feature-specific tests; consolidate
  # only checks whose inputs are identical.
  independent-workspace:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workspace: [xmpl, publish]
        ## Doctests need a library target: only `xmpl` has any.
        include:
          - workspace: xmpl
            doctests: true
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load pinned tool versions
        uses: ./.github/actions/load-pinned-versions

      ## The toolchain input is the pinned stable version, which satisfies the declared MSRV (`rust-version`).
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust toolchains and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-workspaces: |-
            bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main
            later/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main
            tools -> ${{ github.workspace }}/.ci/target/rust_howto/main
            publish -> ${{ github.workspace }}/.ci/target/rust_howto/main
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main
          cache-key: ${{ matrix.workspace }}

      - name: Check minimum supported Rust
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
          CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/msrv/${{ matrix.workspace }}
          CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/msrv/${{ matrix.workspace }}
          CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/msrv/${{ matrix.workspace }}
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 check --workspace --all-targets --locked
        working-directory: ${{ matrix.workspace }}

      - name: Format
        run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
        working-directory: ${{ matrix.workspace }}

      - name: Fetch
        run: cargo fetch --locked
        working-directory: ${{ matrix.workspace }}

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
        working-directory: ${{ matrix.workspace }}

      - name: Tests
        run: cargo test --workspace --all-targets --locked
        working-directory: ${{ matrix.workspace }}

      # Execute documentation examples separately: passing unit/integration tests or Nextest does
      # not establish doctest correctness.
      - name: Doctests
        if: ${{ matrix.doctests }}
        run: cargo test --workspace --doc --locked
        working-directory: ${{ matrix.workspace }}
