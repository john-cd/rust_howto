# TODO Reviewed ??-??-2026
name: Build tools on Linux

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'tools/**'
      - '.devcontainer/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'tools/**'
      - '.devcontainer/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: "tools"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Code checkout (clones the Git repository)
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build local-tool-builder image
      run: |
        source .devcontainer/.env
        cache_scope="rust_howto_tools-${RUST_VERSION}-$(sha256sum tools/Cargo.lock | cut -c1-12)"
        docker buildx build \
          --file .devcontainer/Dockerfile \
          --target local-tool-builder \
          --tag rust_howto_tools_app_builder:latest \
          --build-arg RUST_IMAGE_LABEL="$RUST_IMAGE_LABEL" \
          --cache-from type=gha,scope="$cache_scope" \
          --cache-to type=gha,mode=max,scope="$cache_scope" \
          --load .

    - name: Run tools tests inside container
      run: |
        docker run --rm rust_howto_tools_app_builder:latest bash -lc "cd /code/tools && cargo +nightly fmt --all --check && cargo build --workspace --all-targets --locked --all-features && cargo clippy --workspace --all-targets --locked --all-features -- --deny warnings && cargo test --workspace --all-targets --locked --all-features && cargo test --workspace --doc --locked --all-features"
