# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Build tools on Linux.
# Purpose: Compile, lint or test the Rust source for the scope selected by the commands below.
# Execution: push, pull_request, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Cost boundary: path filters avoid provisioning this workflow for unrelated changes; include shared
# scripts, pins and manifests when its inputs change.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Builds the `tools/` workspace inside the `local-tool-builder` Docker stage (Linux).
## The Windows build of the tools lives in `build_book_code_and_book_on_windows.yml`.
name: Build tools on Linux

on:
  push:
    branches: ["develop"]
    paths:
      - "tools/**"
      - "book_tooling"
      - ".gitmodules"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
  pull_request:
    branches: ["develop"]
    paths:
      - "tools/**"
      - "book_tooling"
      - ".gitmodules"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tools-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
jobs:
  # Job build: Compile, lint or test the Rust source for the scope selected by the commands below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout (clones the Git repository)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out Book Tooling
        uses: ./.github/actions/checkout-book-tooling
        with:
          token: ${{ secrets.BOOK_TOOLING_TOKEN }}

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build local-tool-builder image
        run: |
          source .devcontainer/.env
          cache_scope="rust_howto_tools-${RUST_VERSION}-$(sha256sum tools/Cargo.lock | cut -c1-12)"
          docker buildx build \
            --file .devcontainer/Dockerfile \
            --target local-tool-builder \
            --tag rust_howto_tools_app_builder:latest \
            --build-arg RUST_IMAGE_LABEL="$RUST_IMAGE_LABEL" \
            --build-arg RUSTFMT_TOOLCHAIN="$RUSTFMT_TOOLCHAIN" \
            --cache-from type=gha,scope="$cache_scope" \
            --cache-to type=gha,mode=max,scope="$cache_scope" \
            --load .

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Run tools tests inside container
        run: |
          # Keep the Rust image's PATH instead of replacing it with login profile values.
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.github/workflows/audit_dependencies.yml,target=/code/.github/workflows/audit_dependencies.yml,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/bk,target=/code/bk,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/later,target=/code/later,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts,target=/code/scripts,readonly" \
            rust_howto_tools_app_builder:latest bash -c '
            set -euo pipefail
            : "${RUSTFMT_TOOLCHAIN:?RUSTFMT_TOOLCHAIN must be set in the image}"
            cd /code/tools
            cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
            rustup toolchain install 1.98.1 --profile minimal
            cargo +1.98.1 check --workspace --all-targets --locked
            cargo build --workspace --all-targets --locked --all-features
            cargo clippy --workspace --all-targets --locked --all-features -- --deny warnings
            cargo test --workspace --all-targets --locked --all-features
            cargo test --workspace --doc --locked --all-features
            cargo run --locked -p example-integrity -- --fail
            cargo run --locked -p example-integrity -- tests --summary
            cargo run --locked -p example-integrity -- unused-examples --summary
          '
