name: Build tools on Linux

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tools/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tools/**'
  workflow_dispatch:

concurrency:
  group: "tools"
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: ./tools

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Checks out your repository under $GITHUB_WORKSPACE
    - name: Code checkout (clones the Git repository)
      uses: actions/checkout@v6

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: tools -> target
        shared-key: "rust-howto-shared"
        cache-targets: "false"

    - name: Install binstall
      run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

    - name: Install nextest
      run: cargo binstall --no-confirm --secure --force cargo-nextest

    - name: Install just
      run: cargo binstall --no-confirm --force just

    - name: Update Rust; Install nightly Rust
      run: |
        rustup component add clippy
        rustup update stable
        rustup toolchain install nightly
        rustup component add rustfmt --toolchain nightly
        rustup default stable
        rustup show

    - name: Check the format
      run: just fa

    - name: Build
      run: just ba

    - name: Clippy
      run: just ca

    - name: Run tests
      run: just nta

    - name: Build in release mode
      run: just release
