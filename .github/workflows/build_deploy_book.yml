## Workflow for building and deploying a mdBook site to GitHub Pages
##
## To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
##
## Docker's official GitHub Actions: https://docs.docker.com/build/ci/github-actions/

name: Build the book code and deploy the book to GitHub Pages (Linux)

on:
  workflow_call:
    inputs:
      deploy_to_gh_pages:
        description: "If true, deploy the book to GitHub Pages"
        type: boolean
        default: false
      build_pdf:
        description: "Build the optional Pandoc PDF output"
        type: boolean
        default: false
  ## Runs on pushes targeting the default branch
  push:
    branches: ["develop"]
    paths:
      - "bk/**"
      - "tools/**"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"

  pull_request:
    branches: ["develop"]
    paths:
      - "bk/**"
      - "tools/**"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"

  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      deploy_to_gh_pages:
        description: "If true, deploy the book to GitHub Pages"
        type: boolean
        required: true
        default: false
      build_pdf:
        description: "Build the optional Pandoc PDF output"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

## Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
## However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
## Pull request validations are not deployments: they are grouped per branch and superseded by newer pushes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: johncd/rust_howto_ci

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate book and examples on Linux (PR)
    runs-on: ubuntu-latest
    env:
      IMAGE_PULL_POLICY: never
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject repository links to the empty main branch
        shell: bash
        run: |
          if grep -nRE 'https://github\.com/john-cd/rust_howto/(blob|tree|edit)/main' README.md LICENSE bk; then
            echo 'Repository links must target develop, not the empty main branch.' >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
      - name: Reject visible TODO placeholders
        run: python bk/scripts/check_visible_todos.py
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build, test, lint, and render through Compose
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose-ci.yaml run \
            --rm --build --pull never \
            book

  ## Introduction to GitHub Actions with Docker: https://docs.docker.com/guides/gha/
  build-image:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ env.IMAGE_NAME }}
    steps:
      ## https://github.com/marketplace/actions/free-disk-space-ubuntu
      - name: Free Disk Space (Ubuntu)
        # jlumbroso/free-disk-space v2.0.0
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Code checkout (clones the Git repository)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      # - name: Validate YAML files
      #   run: yamllint ./.devcontainer/ ./.github/ ./.github/workflows/
      - name: Login to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      ## The default legacy `docker` driver built in the docker daemon has limited support for advanced features like caching:
      ## https://docs.docker.com/build/builders/drivers/
      ## `setup-buildx-action` uses by default the `docker-container` driver, which supports caching:
      ## https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: builder
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # - name: List Docker builders (debug)
      #   run: docker buildx ls
      - name: Build, cache (type=gha), and push to DockerHub
        env:
          # compose.yaml passes GH_TOKEN as the `github_token` build secret so cargo can
          # fetch the private john-cd/book_tooling repository (see build_tools.yml).
          GH_TOKEN: ${{ secrets.BOOK_TOOLING_TOKEN }}
        run: |
          docker buildx bake -f compose.yaml -f compose-ci.yaml \
            --push --allow=fs.read=.. \
            --builder=${{ steps.builder.outputs.name }}
        working-directory: ./.devcontainer/

  test:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-image
    runs-on: ubuntu-latest
    env:
      IMAGE_PULL_POLICY: missing
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      - name: Install compiler cache
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: sccache@0.19.0
      - name: Rust Cache
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: "rust-howto-shared"
          cache-targets: "false"
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/rust_howto/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: "bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main\nlater/crates -> ${{ github.workspace
            }}/.ci/target/rust_howto/main\ntools -> ${{ github.workspace }}/.ci/target/rust_howto/main\nplayground -> ${{
            github.workspace }}/.ci/target/rust_howto/main\npublish -> ${{ github.workspace }}/.ci/target/rust_howto/main\n\
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main"
      - name: Login to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run partitioned tests
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose-ci.yaml run --rm \
            -e NEXTEST_ARGS="--partition hash:${{ matrix.partition }}/2" \
            -e SKIP_BOOK_BUILD="true" \
            book

  build-book:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_PULL_POLICY: missing
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      - name: Install compiler cache
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: sccache@0.19.0
      - name: Rust Cache
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: "rust-howto-shared"
          cache-targets: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }} # Only restore in the final build stage
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/rust_howto/main
          workspaces: "bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main\nlater/crates -> ${{ github.workspace
            }}/.ci/target/rust_howto/main\ntools -> ${{ github.workspace }}/.ci/target/rust_howto/main\nplayground -> ${{
            github.workspace }}/.ci/target/rust_howto/main\npublish -> ${{ github.workspace }}/.ci/target/rust_howto/main\n\
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main"
      - name: Login to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the book
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose-ci.yaml run --rm \
            -e SKIP_TESTS="true" \
            -e BUILD_PDF="${{ inputs.build_pdf || false }}" \
            book
      - name: Upload artifacts
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./book/html/

  ## Deployment job
  ## https://github.com/actions/deploy-pages
  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name != 'pull_request' && inputs.deploy_to_gh_pages }}
    needs: build-book
    ## Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
