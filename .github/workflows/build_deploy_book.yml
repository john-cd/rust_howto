# Workflow contract documentation (maintained with the implementation).
# Workflow contract: rust_howto / Build the book code and deploy the book to GitHub Pages (Linux).
# Purpose: Classify changed inputs and export decisions to downstream jobs; Build or exercise the
# container environment used by this repository; Build or exercise the container environment used by
# this repository; Compile, lint or test the Rust source for the scope selected by the commands
# below; Build or exercise the container environment used by this repository; Deploy the checked
# site or application through the configured destination.
# Execution: workflow_call, push, pull_request, workflow_dispatch. Trigger branches/paths below are
# the authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Manual controls: deploy_to_gh_pages: If true, deploy the book to GitHub Pages; build_pdf: Build
# the optional Pandoc PDF output.
# Reuse: callers pass declared inputs/secrets; a called workflow cannot elevate the caller token
# permissions.
# Cost boundary: path filters avoid provisioning this workflow for unrelated changes; include shared
# scripts, pins and manifests when its inputs change.
# Run policy: the concurrency block below controls cancellation/serialization; preserve production
# and manual side-effect guards.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Workflow for building and deploying a mdBook site to GitHub Pages
##
## To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
##
## Docker's official GitHub Actions: https://docs.docker.com/build/ci/github-actions/

name: Build the book code and deploy the book to GitHub Pages (Linux)

on:
  workflow_call:
    inputs:
      deploy_to_gh_pages:
        description: "If true, deploy the book to GitHub Pages"
        type: boolean
        default: false
      build_pdf:
        description: "Build the optional Pandoc PDF output"
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      BOOK_TOOLING_TOKEN:
        description: Optional read access token for the public Book Tooling submodule.
        required: false
  ## Runs on pushes targeting the default branch
  push:
    branches: ["develop"]
    paths:
      - "bk/**"
      - "tools/**"
      - "mdbook-utils"
      - "book_tooling"
      - ".gitmodules"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"

  pull_request:
    branches: ["develop"]
    paths:
      - "bk/**"
      - "tools/**"
      - "mdbook-utils"
      - "book_tooling"
      - ".gitmodules"
      - ".devcontainer/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - ".cargo/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt-toolchain.toml"

  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      deploy_to_gh_pages:
        description: "If true, deploy the book to GitHub Pages"
        type: boolean
        required: true
        default: false
      build_pdf:
        description: "Build the optional Pandoc PDF output"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Build-only runs can supersede each other; requested publications finish in order.
concurrency:
  group: ${{ inputs.deploy_to_gh_pages && 'pages' || format('book-validation-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.deploy_to_gh_pages }}

# Default to bash
defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: johncd/rust_howto_ci
  # Parallel validation runs must never pull another commit's source-containing image.
  IMAGE_VERSION: ${{ github.sha }}

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust_howto/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/rust_howto/main
  CARGO_INCREMENTAL: "0"
jobs:
  # Job changes: Classify changed inputs and export decisions to downstream jobs.
  # Skip only the scopes named by these filters; fixtures, manifests and workflow changes must still
  # select their owning validation.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!TODO.md'
              - '!AGENTS.md'
              - '!CONTRIBUTING.md'
              - '!CHANGELOG.md'
              - '!RELEASES.md'
              - '!.github/workflows/README.md'
              - '!bk/src/**/*.md'
              - '!later/src/**/*.md'
            container:
              - '{.devcontainer/**,.dockerignore,.github/workflows/**}'
      - name: Check CI entrypoint modes without compilation
        run: python3 .devcontainer/test_ci_modes.py
  # Job validate-pr: Build or exercise the container environment used by this repository.
  # Container/toolchain validation covers packaging and native dependencies that a host-only
  # compiler check cannot prove.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name == 'pull_request' }}. Keep this condition when refactoring triggers
  # or job dependencies.
  validate-pr:
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate book and examples on Linux (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMAGE_PULL_POLICY: never
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out Book Tooling
        uses: ./.github/actions/checkout-book-tooling
        with:
          token: ${{ secrets.BOOK_TOOLING_TOKEN }}
      - name: Reject repository links to the empty main branch
        shell: bash
        run: |
          if grep -nRE 'https://github\.com/john-cd/rust_howto/(blob|tree|edit)/main' README.md LICENSE bk; then
            echo 'Repository links must target develop, not the empty main branch.' >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build, test, lint, and render through Compose
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.ci.yaml run \
            --rm --build --pull never \
            -e VALIDATE_CODE="${{ needs.changes.outputs.code }}" \
            rust-howto-book

  ## Introduction to GitHub Actions with Docker: https://docs.docker.com/guides/gha/
  # Job build-image: Build or exercise the container environment used by this repository.
  # Container/toolchain validation covers packaging and native dependencies that a host-only
  # compiler check cannot prove.
  # Guard: ${{ github.event_name != 'pull_request' }}. Keep this condition when refactoring triggers
  # or job dependencies.
  build-image:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      image_name: ${{ env.IMAGE_NAME }}
    steps:
      ## https://github.com/marketplace/actions/free-disk-space-ubuntu
      - name: Free Disk Space (Ubuntu)
        # jlumbroso/free-disk-space v2.0.0
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Code checkout (clones the Git repository)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out Book Tooling
        uses: ./.github/actions/checkout-book-tooling
        with:
          token: ${{ secrets.BOOK_TOOLING_TOKEN }}
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      # - name: Validate YAML files
      #   run: yamllint ./.devcontainer/ ./.github/ ./.github/workflows/
      - name: Login to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      ## The default legacy `docker` driver built in the docker daemon has limited support for advanced features like caching:
      ## https://docs.docker.com/build/builders/drivers/
      ## `setup-buildx-action` uses by default the `docker-container` driver, which supports caching:
      ## https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: builder
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # - name: List Docker builders (debug)
      #   run: docker buildx ls
      - name: Build, cache (type=gha), and push to DockerHub
        run: |
          docker buildx bake -f compose.yaml -f compose.ci.yaml \
            --push --allow=fs.read=.. \
            --builder=${{ steps.builder.outputs.name }}
        working-directory: ./.devcontainer/

  # Job test: Compile, lint or test the Rust source for the scope selected by the commands below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  # Dependency boundary: ["changes", "build-image"]; downstream work must not consume an unchecked
  # or missing upstream result.
  # Guard: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' ||
  # needs.changes.outputs.code == 'true') }}. Keep this condition when refactoring triggers or job
  # dependencies.
  test:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || needs.changes.outputs.code == 'true') }}
    needs: [changes, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMAGE_PULL_POLICY: missing
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install compiler cache
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: sccache@0.19.0
      # Reuse downloaded dependencies/compiler artifacts through this cache configuration. Cache
      # misses must remain correct; keys must distinguish incompatible toolchains, profiles and
      # dependency graphs.
      - name: Rust Cache
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: "rust-howto-shared"
          cache-targets: "true"
          key: runtime-v2-${{ github.workflow }}-${{ runner.arch }}-${{
            hashFiles('**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/rust_howto/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: "bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main\nlater/crates -> ${{ github.workspace
            }}/.ci/target/rust_howto/main\ntools -> ${{ github.workspace }}/.ci/target/rust_howto/main\npublish -> ${{ github.workspace }}/.ci/target/rust_howto/main\n\
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main"
      - name: Login to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check portable GPU examples
        run: |
          cargo test --locked --manifest-path bk/crates/gpu/image_blur/Cargo.toml
          cargo check --locked --manifest-path bk/crates/gpu/vendor_compute/Cargo.toml --all-targets --all-features
      - name: Build, lint, and run all tests once
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.ci.yaml run --rm \
            -e SKIP_BOOK_BUILD="true" \
            rust-howto-book
      - name: Restore cache ownership
        if: always()
        run: |
          if [ -d .ci ]; then sudo chown -R "$(id -u):$(id -g)" .ci; fi

  # Job build-book: Build or exercise the container environment used by this repository.
  # Container/toolchain validation covers packaging and native dependencies that a host-only
  # compiler check cannot prove.
  # Dependency boundary: ["changes", "build-image", "test"]; downstream work must not consume an
  # unchecked or missing upstream result.
  # Guard: ${{ always() && !cancelled() && github.event_name != 'pull_request' &&
  # needs.build-image.result == 'success' && (needs.test.result == 'success' || needs.test.result ==
  # 'skipped') }}. Keep this condition when refactoring triggers or job dependencies.
  build-book:
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.build-image.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [changes, build-image, test]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMAGE_PULL_POLICY: missing
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set build cache scope
        uses: ./.github/actions/set-cache-scope
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install compiler cache
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: sccache@0.19.0
      # Reuse downloaded dependencies/compiler artifacts through this cache configuration. Cache
      # misses must remain correct; keys must distinguish incompatible toolchains, profiles and
      # dependency graphs.
      - name: Rust Cache
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: "rust-howto-shared"
          cache-targets: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }} # Only restore in the final build stage
          key: runtime-v2-${{ github.workflow }}-${{ runner.arch }}-${{
            hashFiles('**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/rust_howto/main
          workspaces: "bk/crates -> ${{ github.workspace }}/.ci/target/rust_howto/main\nlater/crates -> ${{ github.workspace
            }}/.ci/target/rust_howto/main\ntools -> ${{ github.workspace }}/.ci/target/rust_howto/main\npublish -> ${{ github.workspace }}/.ci/target/rust_howto/main\n\
            xmpl -> ${{ github.workspace }}/.ci/target/rust_howto/main"
      - name: Login to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the book
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.ci.yaml run --rm \
            -e VALIDATE_CODE="false" \
            -e SKIP_TESTS="true" \
            -e BUILD_PDF="${{ inputs.build_pdf || false }}" \
            rust-howto-book
      - name: Restore cache ownership
        if: always()
        run: |
          if [ -d .ci ]; then sudo chown -R "$(id -u):$(id -g)" .ci; fi
      # Transfer this job output to the next consumer or retain diagnostics. Uploading an artifact
      # alone does not execute the deployment job.
      - name: Upload artifacts
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./book/html/

  ## Deployment job
  ## https://github.com/actions/deploy-pages
  # Job deploy: Deploy the checked site or application through the configured destination.
  # This job can change a live environment; keep its condition, permissions and environment
  # protections together.
  # Dependency boundary: "build-book"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name != 'pull_request' && inputs.deploy_to_gh_pages }}. Keep this
  # condition when refactoring triggers or job dependencies.
  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name != 'pull_request' && inputs.deploy_to_gh_pages }}
    needs: build-book
    ## Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # This is a publication boundary. Preserve its preceding validation, existing event/ref guard,
      # environment approvals and write permissions.
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
