# TODO Reviewed ??-??-2026.
# Maintained dependency roots; immutable test fixtures are intentionally excluded.
version: 2
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    directories:
      - /bk/crates
      - /bk/crates/cats/database/examples/query_builders_orms/toasty_validation
      - /bk/crates/cats/memory_management/allocator_selection
      - /later/crates
      - /later/crates/cats/development_tools_ffi/python_extension
      - /later/crates/cats/embedded
      - /later/crates/cats/gui/vizia
      - /later/crates/cats/wasm/examples/wasm_standalone_runtimes/components/guest
      - /playground
      - /publish
      - /tools
      - /xmpl
  - package-ecosystem: uv
    directory: /later/crates/cats/development_tools_ffi/python_extension
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /.devcontainer
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /.devcontainer
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: devcontainers
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directories:
      - /
      - /.github/actions/docker-login
      - /.github/actions/load-pinned-versions
      - /.github/actions/set-cache-scope
      - /.github/actions/setup-rust
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: gitsubmodule
    schedule:
      interval: weekly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
