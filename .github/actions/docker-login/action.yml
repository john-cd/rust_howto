# Composite action: log in to Docker Hub. Secrets must be passed as inputs by the caller.
# This is the only place that pins `docker/login-action`.
name: Docker Hub login
description: Log in to Docker Hub.

inputs:
  username:
    description: Docker Hub user name.
    required: true
  password:
    description: Docker Hub access token.
    required: true

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      # docker/login-action v4.6.0
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
