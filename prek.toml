# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# :schema https://www.schemastore.org/prek.json
#
# TODO Reviewed ??-??-2026.

minimum_prek_version = "0.5.6"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "end-of-file-fixer" },
  { id = "file-contents-sorter" },
  { id = "fix-byte-order-marker" },
  # JSON with comments (JSONC) is valid for VS Code and dev containers.
  { id = "check-json", exclude = "^\\.(vscode|devcontainer)/" },
  # { id = "check-json5" },
  # { id = "pretty-format-json" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "no-commit-to-branch" },
  { id = "check-executables-have-shebangs" },
  # { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "format-rust-code", name = "Format staged Rust files", entry = "rustfmt +nightly-2026-11-06 --config skip_children=true", files = '\.rs$', language = "system" },
  { id = "ruff-check-python-extension", name = "Ruff check (Python extension)", entry = "just --justfile later/crates/cats/development_tools_ffi/python_extension/justfile lint", language = "system", files = '^later/crates/cats/development_tools_ffi/python_extension/.*\.py$', types = [
    "python",
  ], pass_filenames = false },
  { id = "ruff-format-python-extension", name = "Ruff format (Python extension)", entry = "just --justfile later/crates/cats/development_tools_ffi/python_extension/justfile fmt-check", language = "system", files = '^later/crates/cats/development_tools_ffi/python_extension/.*\.py$', types = [
    "python",
  ], pass_filenames = false },
]
