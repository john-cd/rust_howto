# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
license-file.workspace = true
name = "other"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools"]
publish = false
autolib = false

[features]
datafusion = ["dep:datafusion"]
arrow = ["dep:arrow"]
typegen = ["crux_core/typegen"] # for Crux
#polars = ["dep:polars"]

[dependencies]

## General
anyhow = "1.0.102"

## Data processing
arrow = { version = "58.2.0", features = ["csv", "json", "prettyprint"], optional = true }
async-trait = "0.1.89"
#polars = { version = "0.53.0", default-features = false, features = ["lazy", "csv"], optional = true }

## Cloud
aws-config = "1.8.16"
aws-sdk-s3 = "1.131.0"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }

## Cross platform
crux_core = "0.17.0"
datafusion = { version = "53.1.0", optional = true }
lambda_runtime = "1.1.3"

## Scripting
rhai = "1.24.0"
serde = { version = "1.0.228", features = ["derive"] }

## Architecture
shaku = "0.6.2"
shuttle-axum = "0.57.0"
shuttle-runtime = "0.57.0"

## GPU
spirv-std = "0.9.0"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[example]]
name = "architecture"
path = "examples/architecture/main.rs"
test = true

[[example]]
name = "cloud"
path = "examples/cloud/main.rs"
test = true

[[example]]
name = "cross_platform"
path = "examples/cross_platform/main.rs"
test = true

[[example]]
name = "data_processing"
path = "examples/data_processing/main.rs"
test = true
required-features = ["arrow"]

[[example]]
name = "datafusion"
path = "examples/datafusion/main.rs"
test = true
required-features = ["datafusion"]

# TODO optional polars and datafusion dependencies in the same package pull in incompatible chrono versions (polars-arrow vs datafusion).
#[[example]]
#name = "polars"
#path = "examples/polars/main.rs"
#test = true
#required-features = ["polars"]

[[example]]
name = "gpu"
path = "examples/gpu/main.rs"
test = true

[[example]]
name = "scripting"
path = "examples/scripting/main.rs"
test = true

[[example]]
name = "written_in_rust"
path = "examples/written_in_rust/main.rs"
test = true
