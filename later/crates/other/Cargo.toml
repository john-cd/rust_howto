# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "other"
version.workspace = true
authors.workspace = true
autolib = false
categories = ["development-tools"]
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
license-file.workspace = true
publish = false
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies"

[features]
onnx = ["dep:ort", "dep:arc-swap"]
datafusion = ["dep:datafusion"]
arrow = ["dep:arrow", "dep:arrow-array", "dep:arrow-cast", "dep:arrow-ipc"]
typegen = ["crux_core/typegen"] # for Crux
polars = ["dep:polars"]
# `polars` and `datafusion` can be enabled together: `Cargo.lock` resolves a single `chrono`
# (polars-arrow 0.51 and datafusion 55 both accept it). Re-check with
# `cargo tree --locked -i chrono --features polars,datafusion` when bumping either crate.

[dependencies]
## General
anyhow = "1.0.104"

## Machine learning
arc-swap = { version = "1", optional = true }

## Data processing
arrow = { version = "58.4.0", features = ["csv", "json", "prettyprint"], optional = true }
arrow-array = { version = "58.4.0", optional = true } # Typed columns and `RecordBatch`, without the umbrella crate.
arrow-cast = { version = "58.4.0", features = ["prettyprint"], optional = true } # Pretty-print record batches.
arrow-ipc = { version = "58.4.0", optional = true } # Arrow IPC file and stream formats.
async-trait = "0.1.92"
augurs = { version = "0.10", features = ["ets", "mstl"] }

## Cloud
aws-config = "1.13.0"
aws-sdk-cloudwatch = "1.138.0"
aws-sdk-lambda = "1.154.0"
aws-sdk-s3 = "1.155.0"
aws-sdk-sesv2 = "1.143.0"
aws-sdk-sns = "1.119.0"
aws-sdk-sqs = "1.117.0"
axum = "0.8.9"
base64 = "0.23.1" # Binary Protobuf payloads in SQS text bodies.

## Scheduling
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"

## Cross platform
crux_core = "0.17.0"
datafusion = { version = "55.2.0", default-features = false, features = [
  "sql",
], optional = true } # Enable SQL without unused native compression codecs.
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", features = ["derive", "runtime", "client"] }
lambda_runtime = "1.5.0"
ort = { version = "2.0.0-rc.15", optional = true } # Downloads ONNX Runtime binaries at build time
polars = { version = "0.51.0", default-features = false, features = ["lazy", "csv"], optional = true }
prost = "0.14.4" # Protobuf message derive.

## Scripting
rhai = "1.27.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154" # Converts Arrow JSON output back into Serde rows, and parses Lambda payloads.

## Architecture
shaku = "0.6.3"
shuttle-axum = "0.57.0"
shuttle-runtime = "0.57.0"
smartcore = "0.5.5"

## GPU
spirv-std = "0.9.0"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[example]]
name = "architecture"
path = "examples/architecture/main.rs"
test = true

[[example]]
name = "cloud"
path = "examples/cloud/main.rs"
test = true

[[example]]
name = "cross_platform"
path = "examples/cross_platform/main.rs"
test = true

[[example]]
name = "data_processing"
path = "examples/data_processing/main.rs"
test = true
required-features = ["arrow"]

[[example]]
name = "datafusion"
path = "examples/datafusion/main.rs"
test = true
required-features = ["datafusion"]

[[example]]
name = "machine_learning"
path = "examples/machine_learning/main.rs"
test = true

[[example]]
name = "polars"
path = "examples/polars/main.rs"
test = true
required-features = ["polars"]

[[example]]
name = "gpu"
path = "examples/gpu/main.rs"
test = true

[[example]]
name = "scheduling"
path = "examples/scheduling/main.rs"
test = true

[[example]]
name = "scripting"
path = "examples/scripting/main.rs"
test = true

[[example]]
name = "written_in_rust"
path = "examples/written_in_rust/main.rs"
test = true

[lints]
workspace = true
