# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "other"
version.workspace = true
description = "Book code examples and their crate dependencies"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools"]
autolib = false

[[example]]
name = "architecture"
path = "examples/architecture/main.rs"
test = true

[[example]]
name = "cloud"
path = "examples/cloud/main.rs"
test = true

[[example]]
name = "cross_platform"
path = "examples/cross_platform/main.rs"
test = true

[[example]]
name = "data_processing"
path = "examples/data_processing/main.rs"
test = true
required-features = ["arrow"]

[[example]]
name = "datafusion"
path = "examples/datafusion/main.rs"
test = true
required-features = ["datafusion"]

[[example]]
name = "machine_learning"
path = "examples/machine_learning/main.rs"
test = true

[[example]]
name = "polars"
path = "examples/polars/main.rs"
test = true
required-features = ["polars"]

[[example]]
name = "scheduling"
path = "examples/scheduling/main.rs"
test = true

[[example]]
name = "scripting"
path = "examples/scripting/main.rs"
test = true

[[example]]
name = "task_automation"
path = "examples/task_automation/main.rs"
test = true

[[example]]
name = "written_in_rust"
path = "examples/written_in_rust/main.rs"
test = true

# `polars` and `datafusion` can be enabled together: `Cargo.lock` resolves a single `chrono`
# (polars-arrow 0.51 and datafusion 55 both accept it). Re-check with
# `cargo tree --locked -i chrono --features polars,datafusion` when bumping either crate.

[dependencies]
## General
anyhow = "1.0.104"

## Machine learning
arc-swap = { version = "1", optional = true }

## Data processing
arrow = { version = "60.1.0", features = ["csv", "json", "prettyprint"], optional = true }
arrow-array = { version = "60.1.0", optional = true } # Typed columns and `RecordBatch`, without the umbrella crate.
arrow-cast = { version = "60.1.0", features = ["prettyprint"], optional = true } # Pretty-print record batches.
arrow-ipc = { version = "60.1.0", optional = true } # Arrow IPC file and stream formats.
async-trait = "0.1.92"
augurs = { version = "0.10", features = ["ets", "mstl"] }

## Cloud
aws-config = { version = "1.13.0", default-features = false, features = [
    "credentials-process",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-smithy-http-client = { version = "1.5.2", default-features = false, features = [
    "rustls-aws-lc",
] } # Custom TLS trust store for S3-compatible stores.
aws-sdk-cloudwatch = { version = "1.138.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-lambda = { version = "1.154.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
aws-sdk-sesv2 = { version = "1.143.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sigv4a",
] }
aws-sdk-sns = { version = "1.119.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sqs = { version = "1.117.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
axum = "0.8.9"
rcgen = "0.14.10" # Test certificates for the TLS trust store example.
base64 = "0.23.1" # Binary Protobuf payloads in SQS text bodies.

## Scheduling
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"

## Cross platform
crux_core = "0.20.0"
datafusion = { version = "55.2.0", default-features = false, features = [
    "sql",
], optional = true } # Enable SQL without unused native compression codecs.
duct = "1.1.2"
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["latest"] }
# Kube 4.2.0 on crates.io pins serde-saphyr 0.0.29, which caps smallvec below 1.16.
# Use an immutable revision of kube main (k8s-openapi 0.29, #2120) until a compatible Kube release is published.
kube = { version = "4.2.0", git = "https://github.com/kube-rs/kube", rev = "28e3d13a7290ade6204666580fc98df1a556c6f6", features = ["derive", "runtime", "client"] }
lambda_runtime = "1.5.0"
ort = { version = "2.0.0-rc.15", optional = true } # Downloads ONNX Runtime binaries at build time
polars = { version = "0.55.2", default-features = false, features = ["lazy"], optional = true }
prost = "0.14.4" # Protobuf message derive.

## Scripting
rhai = "1.27.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154" # Converts Arrow JSON output back into Serde rows, and parses Lambda payloads.

## Architecture
shaku = "0.6.3"
shell-words = "1.1.1"
shellexpand = "3.1.2"
shuttle-axum = "0.57.0"
shuttle-runtime = "0.57.0"
smartcore = "0.7.0"

thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tokio-rustls = "0.26.6" # Local HTTPS server for the trust store test.
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
crux_core = { version = "0.20.0", features = ["testing"] } # The `expect_*` assertions on `Command` need this feature since 0.20.

[features]
onnx = ["dep:ort", "dep:arc-swap"]
datafusion = ["dep:datafusion"]
arrow = ["dep:arrow", "dep:arrow-array", "dep:arrow-cast", "dep:arrow-ipc"]
typegen = ["crux_core/typegen"] # for Crux
polars = ["dep:polars"]

[lints]
workspace = true
