[package]
name = "other"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools"]
publish = false
autolib = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
## Architecture
shaku = "0.6.2"

## Cloud
aws-config = "1.8.13"
aws-sdk-s3 = "1.122.0"
shuttle-runtime = "0.57.0"
shuttle-axum = "0.57.0"
axum = "0.8.9"
lambda_runtime = "1.1.3"

## Cross platform
crux_core = "0.17.0"

## Data processing
arrow = { version = "58.2.0", features = ["csv", "json", "prettyprint"], optional = true }
polars = { version = "0.53.0", features = ["lazy", "csv"], optional = true }
datafusion = { version = "53.1.0", optional = true }

## Scripting
rhai = "1.24.0"

## GPU
spirv-std = "0.9.0"

## General
anyhow = "1.0.102"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
datafusion = ["dep:datafusion"]
polars = ["dep:polars"]
arrow = ["dep:arrow"]
## For Crux:
typegen = ["crux_core/typegen"]
