[package]
name = "gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Comprehensive examples of Rust GUI frameworks including Slint, Egui, Iced, and Tauri."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["gui", "slint", "egui", "iced", "tauri", "dioxus"]
categories = ["gui"]
publish.workspace = true
autolib = false

[features]
default = []
dioxus = ["dep:dioxus"]
femtovg = ["dep:femtovg"]
floem = ["dep:floem"]
gtk = ["dep:gtk4", "dep:relm4", "dep:relm4-components"]
minifb = ["dep:minifb"]
iced = ["dep:iced"]
skia = ["dep:skia-safe", "dep:glutin", "dep:gl"]
slint = ["dep:slint"]
tauri = ["dep:tauri"]
vello = ["dep:vello"]
vger = ["dep:vger"]
# TODO vizia = ["dep:vizia"]
webrender = ["dep:webrender", "dep:glutin", "dep:gl"]
xilem = ["dep:xilem"]

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
baseview = { git = "https://github.com/RustAudio/baseview", branch = "master" }
clap = { version = "4.6.1", features = ["derive"] }
cosmic-text = "0.19.0"
dioxus = { version = "0.7.7", optional = true }
eframe = "0.34.2"
egui = "0.34.2"
femtovg = { version = "0.23.2", optional = true }
floem = { version = "0.2.0", optional = true }
gl = { version = "0.14.0", optional = true }
glutin = { version = "0.32.3", optional = true }
gtk4 = { version = "0.11.3", optional = true }
iced = { version = "0.14.0", optional = true }
minifb = { version = "0.28.0", optional = true }
morphorm = "0.8.0"
parley = "0.9.0"
pollster = { version = "0.4.0", optional = true } # for vello example
# FIXME size-of v0.1.5 does not compile on Windows:
# FIXME r3bl_tuify = "0.2.0"
relm4 = { version = "0.11.0", optional = true }
relm4-components = { version = "0.11.0", optional = true }
# GTK support requires native GTK libraries and pkg-config on the host system.
# This workspace does not enforce GTK support in the all-features build.
# # FIXME https://gtk-rs.org/gtk4-rs/git/book/installation_linux.html
# # FIXME https://gtk-rs.org/gtk4-rs/git/book/installation_windows.html
rfd = "0.17.2"
skia-safe = { version = "=0.90", features = [
    "gl",
], optional = true } # TODO pinned for vizia to 0.93.1 and to 0.90 for slint
slint = { version = "1.16.1", optional = true }
taffy = "0.10.1"
tao = "0.35.1"
tauri = { version = "2.11.0", optional = true } # Requires multiple libraries. See Dockerfile
vello = { version = "0.8.0", optional = true } # TODO upgrade to 0.8.0+
vger = { version = "0.4.0", optional = true }
# TODO vizia = { version = "0.4.0", optional = true }
webrender = { version = "0.68.0", optional = true }
wgpu = "29.0.3"
winit = "0.30.13"  # for vello, winit examples
xilem = { version = "0.4.0", optional = true }

[[example]]
name = "2d_renderers"
path = "examples/2d_renderers/main.rs"
required-features = ["femtovg", "minifb", "skia", "vello", "vger", "webrender"]
test = true

[[example]]
name = "gtk"
path = "examples/gtk/main.rs"
required-features = ["gtk"]
test = true

[[example]]
name = "retained_mode_gui"
path = "examples/retained_mode_gui/main.rs"
required-features = ["floem", "iced", "slint", "xilem"]
test = true

[[example]]
name = "web"
path = "examples/web/main.rs"
required-features = ["tauri"]
test = true

[[example]]
name = "clipboard"
path = "examples/clipboard/main.rs"
test = true

[[example]]
name = "file_dialogs"
path = "examples/file_dialogs/main.rs"
test = true

[[example]]
name = "immediate_mode_gui"
path = "examples/immediate_mode_gui/main.rs"
test = true

[[example]]
name = "text_layout"
path = "examples/text_layout/main.rs"
test = true

[[example]]
name = "ui_layout"
path = "examples/ui_layout/main.rs"
test = true

[[example]]
name = "window_creation"
path = "examples/window_creation/main.rs"
test = true
