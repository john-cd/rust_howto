[package]
name = "gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - gui"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license = "CC0-1.0"
keywords.workspace = true
categories = ["gui"]
publish.workspace = true
autolib = false

[dependencies]
arboard = "3.4.1"
cosmic-text = "0.14.0"
eframe = "0.32.1"
egui = "0.32.1"
femtovg = { version = "0.16.0", optional = true }
iced = { version = "0.13.1", optional = true }
minifb = "0.28.0"
morphorm = "0.7.0"
rfd = "0.15.2"
skia-safe = { version = "0.86.0", features = ["gl"], optional = true }
taffy = "0.9.1"
tao = "0.34.0"
vello = { version = "0.5.0", optional = true }
vger = { version = "0.4.0", optional = true }
winit = "0.30.8"
xilem = { version = "0.3.0", optional = true }
image = "0.25.5"

## General
anyhow = "1.0.95"

[features]
default = []
femtovg = ["dep:femtovg"]
iced = ["dep:iced"]
skia = ["dep:skia-safe"]
vger = ["dep:vger"]
xilem = ["dep:xilem"]
