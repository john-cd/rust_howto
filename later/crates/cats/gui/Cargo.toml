[package]
name = "gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Comprehensive examples of Rust GUI frameworks including Slint, Egui, Iced, and Tauri."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["gui", "slint", "egui", "iced", "tauri", "dioxus"]
categories = ["gui"]
publish.workspace = true
autolib = false

[features]
default = []
dioxus = ["dep:dioxus"]
femtovg = ["dep:femtovg"]
floem = ["dep:floem"]
minifb = ["dep:minifb"]
iced = ["dep:iced"]
skia = ["dep:skia-safe", "dep:glutin", "dep:gl"]
slint = ["dep:slint"]
tauri = ["dep:tauri"]
vello = ["dep:vello"]
vger = ["dep:vger"]
vizia = ["dep:vizia"]
webrender = ["dep:webrender", "dep:glutin", "dep:gl"]

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
baseview = { git = "https://github.com/RustAudio/baseview", branch = "master" }
clap = { version = "4.6.1", features = ["derive"] }
cosmic-text = "0.19.0"
dioxus = { version = "0.7.7", optional = true }
eframe = "0.34.1"
egui = "0.34.1"
femtovg = { version = "0.23.2", optional = true }
floem = { version = "0.2.0", optional = true }
gl = { version = "0.14.0", optional = true }
glutin = { version = "0.32.3", optional = true }
gtk4 = { version = "0.11.3", optional = true }
iced = { version = "0.14.0", optional = true }
minifb = { version = "0.28.0", optional = true }
morphorm = "0.8.0"
parley = "0.9.0"
pollster = { version = "0.4.0", optional = true } # for vello example
# FIXME size-of v0.1.5 does not compile on Windows:
# FIXME r3bl_tuify = "0.2.0"
relm4 = { version = "0.11.0", optional = true }
relm4-components = { version = "0.11.0", optional = true }
# GTK support requires native GTK libraries and pkg-config on the host system.
# This workspace does not enforce GTK support in the all-features build.
# # FIXME https://gtk-rs.org/gtk4-rs/git/book/installation_linux.html
# # FIXME https://gtk-rs.org/gtk4-rs/git/book/installation_windows.html
rfd = "0.17.2"
skia-safe = { version = "0.97.0", features = [
    "gl",
], optional = true } # TODO was pinned for slint
slint = { version = "1.16.1", optional = true }
taffy = "0.10.1"
tao = "0.35.0"
tauri = { version = "2.11.0", optional = true } # Requires multiple libraries. See Dockerfile
vello = { version = "0.8.0", optional = true } # TODO upgrade to 0.8.0+
vger = { version = "0.4.0", optional = true }
vizia = { version = "0.4.0", optional = true }
webrender = { version = "0.68.0", optional = true }
wgpu = "29.0.3"
winit = "0.30.13"  # for vello, winit examples
