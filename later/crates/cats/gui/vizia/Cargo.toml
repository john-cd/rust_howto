# TODO Reviewed ??-??-2026

[package]
name = "gui_vizia"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[[bin]]
name = "vizia"
path = "src/main.rs"
required-features = ["vizia"]

[dependencies]
# A declarative desktop GUI framework
vizia = { version = "0.4.0", optional = true }

[features]
default = []
vizia = ["dep:vizia"]

[workspace]
resolver = "3"

[workspace.lints.clippy]
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
dbg_macro = "warn"
let_underscore_future = "warn"
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
all = { level = "warn", priority = -1 }
