[package]
name = "rendering_graphics_api"
version.workspace = true
authors.workspace = true
autolib = false
categories = ["rendering::graphics-api"]
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["rendering", "graphics", "wgpu", "gpu", "api"]
license-file.workspace = true
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples for low-level Rendering Graphics APIs like WGPU."

[features]
default = []
wgpu = ["dep:pollster", "dep:wgpu"]

[dependencies]
pollster = { version = "0.4.0", optional = true } # runs the example's async GPU setup
wgpu = { version = "29.0.4", optional = true } # was pinned for ggez

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] } # validates the WGSL without a GPU

[[example]]
name = "gpu_abstraction_layers"
path = "examples/gpu_abstraction_layers/main.rs"
test = true

[[example]]
name = "native_graphics_apis"
path = "examples/native_graphics_apis/main.rs"
test = true

[[example]]
name = "opengl"
path = "examples/opengl/main.rs"
test = true

[[example]]
name = "shaders"
path = "examples/shaders/main.rs"
test = true

[[example]]
name = "vulkan"
path = "examples/vulkan/main.rs"
test = true

[lints]
workspace = true
