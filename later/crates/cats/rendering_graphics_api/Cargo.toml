[package]
name = "rendering_graphics_api"
version.workspace = true
description = "Book code examples for low-level Rendering Graphics APIs like WGPU."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["rendering", "graphics", "wgpu", "gpu", "api"]
categories = ["rendering::graphics-api"]
autolib = false

[[example]]
name = "gpu_abstraction_layers"
path = "examples/gpu_abstraction_layers/main.rs"
test = true

[[example]]
name = "native_graphics_apis"
path = "examples/native_graphics_apis/main.rs"
test = true
required-features = ["wgpu"]

[[example]]
name = "opengl"
path = "examples/opengl/main.rs"
test = true

[[example]]
name = "shaders"
path = "examples/shaders/main.rs"
test = true

[[example]]
name = "vulkan"
path = "examples/vulkan/main.rs"
test = true

[dependencies]
# GL on Whatever: a set of bindings to run GL (Open GL, OpenGL ES, and WebGL) anywhere, and avoid target-specific code.
glow = "0.18.0" # Cross-platform OpenGL, OpenGL ES, and WebGL bindings.
# Synchronously block the thread until a future completes
pollster = { version = "1.0.1", optional = true } # runs the example's async GPU setup
# Cross-platform, safe, pure-rust graphics API
wgpu = { version = "30.0.1", optional = true } # was pinned for ggez

[dev-dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104" # Provides consistent fallible example entry points.
# Vulkan bindings for Rust
ash = "0.38.0" # Loads the Vulkan library at runtime; the example runs without one.
# Shader translator and validator. Part of the wgpu project
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] } # validates the WGSL without a GPU

[features]
default = []
wgpu = ["dep:pollster", "dep:wgpu"]

[lints]
workspace = true
