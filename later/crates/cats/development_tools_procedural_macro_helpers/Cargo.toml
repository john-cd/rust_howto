[package]
license-file.workspace = true
name = "development_tools_procedural_macro_helpers"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - development_tools_procedural_macro_helpers"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::procedural-macro-helpers"]
publish.workspace = true

# See `lib.rs`
[lib]
proc-macro = true

[dependencies]

## General
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
darling = "0.23.0"
paste = "1.0.15"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
watt = "0.5.0"

[[example]]
name = "compile_macros"
path = "examples/compile_macros/main.rs"
test = true

[[example]]
name = "write_proc_macros"
path = "examples/write_proc_macros/main.rs"
test = true

[lints]
workspace = true
