[package]
name = "development_tools_procedural_macro_helpers"
version.workspace = true
description = "Book code examples and their crate dependencies - development_tools_procedural_macro_helpers"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::procedural-macro-helpers"]

# See `lib.rs`
[lib]
proc-macro = true

[[example]]
name = "write_proc_macros"
path = "examples/write_proc_macros/main.rs"
test = true

[[example]]
name = "macro_tools"
path = "examples/macro_tools/main.rs"
test = true

[[example]]
name = "compile_macros"
path = "examples/compile_macros/main.rs"
test = true

[dependencies]
## General
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A proc-macro library for reading attributes into structs when implementing custom derives.
darling = "0.24.1"
# Macros for all your token pasting needs
paste = "1.0.15"
# A minimal `syn` syntax tree pretty-printer
prettyplease = "0.3.0"
# A substitute implementation of the compiler's `proc_macro` API to decouple token-based libraries from the procedural macro use case.
proc-macro2 = "1.0.107"
# Builds Rust token streams with quasi-quoting macros for procedural macros.
quote = "1.0.47"
# Parser for Rust source code
syn = { version = "3.0.10", features = ["full"] }

[lints]
workspace = true
