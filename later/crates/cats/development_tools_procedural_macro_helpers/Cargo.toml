[package]
name = "development_tools_procedural_macro_helpers"
version.workspace = true
description = "Book code examples and their crate dependencies - development_tools_procedural_macro_helpers"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::procedural-macro-helpers"]

# See `lib.rs`
[lib]
proc-macro = true

[[example]]
name = "write_proc_macros"
path = "examples/write_proc_macros/main.rs"
test = true

[[example]]
name = "macro_tools"
path = "examples/macro_tools/main.rs"
test = true

[[example]]
name = "compile_macros"
path = "examples/compile_macros/main.rs"
test = true

[dependencies]
## General
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
darling = "0.24.1"
paste = "1.0.15"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }

[lints]
workspace = true
