[package]
name = "game_engines"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - game_engines"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license = "CC0-1.0"
keywords.workspace = true
categories = ["game_engines"]
publish.workspace = true
autolib = false

[dependencies]
bevy = { version = "0.15.1", optional = true, default-features = false, features = ["bevy_asset", "bevy_render", "bevy_sprite", "bevy_window", "bevy_core_pipeline", "multi_threaded"] }
fyrox = { version = "1.0.1", optional = true, features = ["fyrox-impl"] }
fyrox-core = { version = "1.0.1", optional = true }
# ggez = { version = "0.9.3", optional = true }
macroquad = "0.4.14"

[features]
default = []
bevy = ["dep:bevy"]
fyrox = ["dep:fyrox", "dep:fyrox-core"]
# ggez = ["dep:ggez"]
