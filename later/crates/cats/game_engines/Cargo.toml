[package]
name = "game_engines"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - game_engines"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license = "CC0-1.0"
keywords.workspace = true
categories = ["game-engines"]
publish.workspace = true
autolib = false

[dependencies]
bevy = { version = "0.16.0", optional = true }
fyrox = { version = "0.36.0", optional = true }
# TODO fyrox-core = { version = "0.36.0", optional = true }
anyhow = { version = "1.0.95", optional = true }
ggez = { version = "0.9.3", optional = true } # TODO ggez conflict with wgpu
macroquad = "0.4.14"

# FIXME
[features]
default = []
bevy = ["dep:bevy"]
fyrox = ["dep:fyrox", "dep:anyhow"]
# TODO fyrox = ["dep:fyrox", "dep:fyrox-core"]
ggez = ["dep:ggez"]
