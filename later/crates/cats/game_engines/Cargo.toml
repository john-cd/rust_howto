[package]
name = "game_engines"
version.workspace = true
description = "Book code examples and their crate dependencies - game_engines"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["game-engines"]
autolib = false

[[example]]
name = "game_engines"
path = "examples/game_engines/main.rs"
test = true

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bevy = { version = "0.20.0", default-features = false, features = ["default_app"], optional = true ,
}
clap = { version = "4.6.7", features = ["derive"] }
fyrox = { version = "1.0.1", optional = true }
ggez = { version = "0.10.0", optional = true }
macroquad = "0.4.16"

[features]
default = []
bevy = ["dep:bevy"]
fyrox = ["dep:fyrox", "dep:anyhow"]
ggez = ["dep:ggez"]

[lints]
workspace = true
