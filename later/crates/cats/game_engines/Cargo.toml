[package]
name = "game_engines"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - game_engines"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["game-engines"]
publish.workspace = true
autolib = false

# FIXME
[features]
default = []
bevy = ["dep:bevy"]
fyrox = ["dep:fyrox", "dep:anyhow"]
# TODO fyrox = ["dep:fyrox", "dep:fyrox-core"]
ggez = ["dep:ggez"]

[dependencies]
# TODO fyrox-core = { version = "0.36.0", optional = true }
anyhow = { version = "1.0.102", optional = true }
bevy = { version = "0.18.1", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
fyrox = { version = "1.0.1", optional = true }
macroquad = "0.4.14"

# TODO review on Windows
[target.'cfg(not(target_os = "windows"))'.dependencies]
ggez = { version = "0.10.0-rc0", optional = true }

[[example]]
name = "game_engines"
path = "examples/game_engines/main.rs"
test = true
