[package]
license-file.workspace = true
name = "embedded"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - embedded"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["embedded"]
publish.workspace = true
autolib = false

[dependencies]

[dev-dependencies]
anyhow = "1.0.104" # Provides consistent fallible example entry points.
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = [
    "alloc",
    "std",
] }
embedded-hal = "1.0" # Portable traits used by the host-side peripheral examples.
embedded-storage = "0.3.2" # NOR flash traits used by the in-memory flash model.
panic-halt = "0.2"

#[features]
# default = []

[[example]]
name = "embassy"
path = "examples/embassy/main.rs"
test = true

[[example]]
name = "flash"
path = "examples/flash/main.rs"
test = true

[[example]]
name = "hals"
path = "examples/hals/main.rs"
test = true

[[example]]
name = "rtos"
path = "examples/rtos/main.rs"
test = true

[[example]]
name = "sensors"
path = "examples/sensors/main.rs"
test = true

[lints]
workspace = true
