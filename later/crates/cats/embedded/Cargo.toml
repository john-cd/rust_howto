# TODO Reviewed ??-??-2026.

[package]
name = "embedded"
version = "0.1.2"
description = "Book code examples and their crate dependencies - embedded"
authors = ["John CD"]
edition = "2024"
rust-version = "1.99"
license-file = "../../../../LICENSE"
readme = "README.md"
documentation = "https://docs.rs/rust_howto/"
homepage = "https://john-cd.com/rust_howto/"
repository = "https://github.com/john-cd/rust_howto/"
publish = false
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["embedded"]
autolib = false
autoexamples = false

[[example]]
name = "flash"
path = "examples/flash/main.rs"
test = true

[[example]]
name = "embassy"
path = "examples/embassy/main.rs"
test = true

[[example]]
name = "hals"
path = "examples/hals/main.rs"
test = true

[[example]]
name = "pacs"
path = "examples/pacs/main.rs"
test = true

[[example]]
name = "rtos"
path = "examples/rtos/main.rs"
test = true

[[example]]
name = "sensors"
path = "examples/sensors/main.rs"
test = true

[[example]]
name = "smoltcp"
path = "examples/smoltcp/main.rs"
test = true

[[example]]
name = "useful_crates_embedded"
path = "examples/useful_crates_embedded/main.rs"
test = true

[dev-dependencies]
anyhow = "1.0.104" # Provides consistent fallible example entry points.
critical-section = { version = "1.2.0", features = [
    "std",
] } # Provides host-safe locking for the shared Embassy channel.
embassy-executor = { version = "0.10.0", features = [
    "executor-thread",
    "platform-std",
] } # Runs Embassy tasks with the host executor.
embassy-sync = "0.8.0" # Provides the bounded task-to-task message channel.
embassy-time = { version = "0.5.1", features = ["std"] } # Provides host timers for the task example and timeout.
embedded-hal = "1.0.0" # Portable traits used by the host-side peripheral examples.
embedded-storage = "0.3.2" # NOR flash traits used by the in-memory flash model.
heapless = "0.9.3" # Provides the bounded queue and vector.
postcard = "1.1.3" # Encodes messages compactly without an allocator.
serde = { version = "1.0.229", features = ["derive"] } # Derives the message encoding.
smoltcp = { version = "0.14.0", default-features = false, features = ["proto-ipv4"] }

[workspace]

[workspace.lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints]
workspace = true
