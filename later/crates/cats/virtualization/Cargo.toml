[package]
name = "virtualization"
version.workspace = true
description = "Book code examples and their crate dependencies - virtualization"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["virtualization"]
autolib = false

[[example]]
name = "virtualization"
path = "examples/virtualization/main.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = { workspace = true, optional = true }
# An asynchronous Docker daemon API
bollard = { workspace = true, optional = true }
# Common utilities and extension traits for the futures-rs library.
futures-util = { workspace = true, optional = true }
# A library for integration-testing against docker containers from within Rust.
testcontainers = { workspace = true, optional = true }
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { workspace = true, optional = true }
# Interprets WebAssembly modules in a lightweight embedded runtime.
wasmi = "2.0.0"

[[example]]
name = "using_containers"
path = "examples/using_containers/main.rs"
required-features = ["containers"]
test = true

[features]
containers = ["dep:anyhow", "dep:bollard", "dep:futures-util", "dep:testcontainers", "dep:tokio"]

[lints]
workspace = true
