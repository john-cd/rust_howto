[package]
name = "virtualization"
version.workspace = true
description = "Book code examples and their crate dependencies - virtualization"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["virtualization"]
autolib = false

[[example]]
name = "virtualization"
path = "examples/virtualization/main.rs"
test = true

[dependencies]
anyhow = { workspace = true, optional = true }
bollard = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasmi = "2.0.0"

[[example]]
name = "using_containers"
path = "examples/using_containers/main.rs"
required-features = ["containers"]
test = true

[features]
containers = ["dep:anyhow", "dep:bollard", "dep:futures-util", "dep:testcontainers", "dep:tokio"]

[lints]
workspace = true
