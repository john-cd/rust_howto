[package]
name = "web_programming_websocket"
version.workspace = true
description = "Book code examples for Web Programming with WebSockets using Tungstenite."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["websocket", "networking", "tungstenite", "tokio", "async"]
categories = ["web-programming::websocket"]
autolib = false

[[example]]
name = "websocket"
path = "examples/websocket/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
async-tungstenite = { version = "0.35.0", features = [
    "tokio-runtime",
    "tokio-native-tls",
] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
# Tokio WebSocket client with TLS for the secure echo endpoint.
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
# Blocking WebSocket client with TLS for the secure echo endpoint.
tungstenite = { version = "0.30.0", features = ["native-tls"] }

[lints]
workspace = true
