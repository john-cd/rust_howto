[package]
name = "cryptography_cryptocurrencies"
version.workspace = true
description = "Book code examples and their crate dependencies - cryptography_cryptocurrencies"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["cryptography::cryptocurrencies"]
autolib = false

# LATER

[[example]]
name = "cryptocurrencies"
path = "examples/cryptocurrencies/main.rs"
test = true

[dependencies]
# Connect applications to blockchains
alloy = { version = "2.5.0", default-features = false, features = ["std", "contract", "sol-types", "provider-http", "reqwest", "reqwest-rustls-tls", "signer-local"] }
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Parse Bitcoin addresses and construct output scripts.
bitcoin = { version = "0.32.102", default-features = false, features = ["std"] }
# Derive and verify Solana program addresses on the host.
solana-pubkey = { version = "4.4.0", features = ["curve25519"] }
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
