[package]
license-file.workspace = true
name = "multimedia_audio"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - multimedia_audio"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["multimedia::audio"]
publish.workspace = true
autolib = false

[dependencies]
cpal = "0.17"
# Create and read a WAV file in memory without an audio device.
hound = "3.5"
# Render a mono source as binaural stereo from a head-related impulse response sphere.
hrtf = "0.9"
midir = "0.11.1"
# Keep 0.22: rodio 0.23 needs cpal 0.18, whose `alsa-sys` 0.4 conflicts with the 0.3 used by `bevy` in this workspace.
rodio = "0.22.2"
# Resample audio buffers between sample rates.
rubato = "5.0.1"

[[example]]
name = "wav"
path = "examples/wav/main.rs"
test = true

[[example]]
name = "audio"
path = "examples/audio/main.rs"
test = true

[lints]
workspace = true
