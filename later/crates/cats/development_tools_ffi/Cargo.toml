[package]
name = "development_tools_ffi"
version.workspace = true
description = "Book code examples and their crate dependencies - development_tools_ffi"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::ffi"]
autolib = false

[package.metadata.cargo-machete]
ignored = ["cc", "bindgen", "cbindgen"]

[lib]
path = "examples/c/cbindgen.rs"
crate-type = ["cdylib"]

[[example]]
name = "c"
path = "examples/c/main.rs"
test = true

[[example]]
name = "cpp"
path = "examples/cpp/main.rs"
required-features = ["cpp"]
test = true

[[example]]
name = "erlang_elixir"
path = "examples/erlang_elixir/main.rs"
test = true

[[example]]
name = "flutter"
path = "examples/flutter/main.rs"
test = true

[[example]]
name = "java"
path = "examples/java/main.rs"
required-features = ["java"]
test = true

[[example]]
name = "lua"
path = "examples/lua/main.rs"
test = true

[[example]]
name = "lua_module"
path = "examples/lua/module.rs"
required-features = ["lua-module"]
crate-type = ["cdylib"]
test = false

[[example]]
name = "node_napi"
path = "examples/node/napi_main.rs"
required-features = ["node"]
test = true

[[example]]
name = "node_neon"
path = "examples/node/neon_main.rs"
required-features = ["node"]
test = true

[[example]]
name = "objc"
path = "examples/objc/main.rs"
test = true

[[example]]
name = "python"
path = "examples/python/main.rs"
test = true

[[example]]
name = "ruby"
path = "examples/ruby/main.rs"
test = true

[[example]]
name = "uniffi"
path = "examples/uniffi.rs"
test = true
required-features = ["uniffi"]

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Library for reading/writing numbers in big-endian and little-endian.
byteorder = { version = "1.5.0", optional = true }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Safe interop between Rust and C++
cxx = { version = "1.0.205", optional = true }
# Flutter/Dart <-> Rust binding generator, feature-rich, but seamless and simple
flutter_rust_bridge = { version = "=2.13.0", optional = true }
# Rust bindings to the JNI
jni = { version = "0.22.4", optional = true }
# High level bindings to Lua 5.5/5.4/5.3/5.2/5.1 (including LuaJIT) and Luau
# Use the host Lua ABI so the embedded and native-module examples can be
# enabled together; mlua-sys rejects its `vendored` and `module` features in
# the same dependency graph.
mlua = { version = "0.12.2", features = ["lua54"], optional = true }
# Exposes Rust functions and types through Node.js's N-API interface.
napi = { version = "3.16.1", features = ["async"], optional = true }
# Generates Node.js N-API bindings from annotated Rust functions and types.
napi-derive = { version = "3.7.0", optional = true }
# A safe abstraction layer for Node.js.
neon = { version = "1.1.2", optional = true }
# Safe Rust wrappers for creating Erlang NIF functions
rustler = { version = "0.39.0", optional = true }
# The tie between Ruby and Rust.
rutie = { version = "0.14.3", optional = true }
# a multi-language bindings generator for rust
uniffi = { version = "0.32.2", optional = true }

[build-dependencies]
# Easy support for interacting between JS and Rust.
bindgen = "0.73.2"
# A tool for generating C bindings to Rust code.
cbindgen = "0.29.4"
# sccache 0.18 cannot parse the MSVC /Tp command emitted by cc 1.9.
cc = "=1.8.0"
# C++ code generator for integrating `cxx` crate into a Cargo build.
cxx-build = { version = "1.0.205", optional = true } # Generates and compiles the optional C++ bridge example.
# a multi-language bindings generator for rust
uniffi = { version = "0.32.2", optional = true }

[features]
cpp = ["dep:cxx", "dep:cxx-build"]
erlang = ["dep:rustler"]
flutter = ["dep:byteorder", "dep:flutter_rust_bridge"]
java = ["dep:jni"]
lua = ["dep:mlua"]
lua-module = ["dep:mlua", "mlua/module"]
objc = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
node = ["dep:napi", "dep:napi-derive", "dep:neon"]
ruby = ["dep:magnus", "dep:rutie"]
uniffi = ["dep:uniffi"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Objective-C interface and runtime bindings
objc2 = { version = "0.6.5", optional = true }
# Bindings to the AppKit framework
objc2-app-kit = { version = "0.3.2", optional = true }
# Bindings to the Foundation framework
objc2-foundation = { version = "0.3.2", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Windows RubyInstaller uses the MinGW ABI, which does not match this MSVC target.
magnus = { version = "0.9.3", features = ["embed"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Embed Python and expose Rust functions to Python on Linux and Windows.
pyo3 = "0.30.1"

[lints]
workspace = true
