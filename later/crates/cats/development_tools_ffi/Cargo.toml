[package]
name = "development_tools_ffi"
version.workspace = true
description = "Book code examples and their crate dependencies - development_tools_ffi"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::ffi"]
autolib = false

[package.metadata.cargo-machete]
ignored = ["cc", "bindgen", "cbindgen"]

[lib]
path = "examples/c/cbindgen.rs"
crate-type = ["cdylib"]

[[example]]
name = "c"
path = "examples/c/main.rs"
test = true

[[example]]
name = "cpp"
path = "examples/cpp/main.rs"
required-features = ["cpp"]
test = true

[[example]]
name = "erlang_elixir"
path = "examples/erlang_elixir/main.rs"
test = true

[[example]]
name = "flutter"
path = "examples/flutter/main.rs"
test = true

[[example]]
name = "java"
path = "examples/java/main.rs"
required-features = ["java"]
test = true

[[example]]
name = "lua"
path = "examples/lua/main.rs"
test = true

[[example]]
name = "lua_module"
path = "examples/lua/module.rs"
required-features = ["lua-module"]
crate-type = ["cdylib"]
test = false

[[example]]
name = "node"
path = "examples/node/main.rs"
test = true

[[example]]
name = "objc"
path = "examples/objc/main.rs"
test = true

[[example]]
name = "python"
path = "examples/python/main.rs"
test = true

[[example]]
name = "ruby"
path = "examples/ruby/main.rs"
test = true

[[example]]
name = "uniffi"
path = "examples/uniffi.rs"
test = true

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
cxx = { version = "1.0.205", optional = true }
flutter_rust_bridge = { version = "=2.13.0", optional = true }
jni = { version = "0.22.4", optional = true }
mlua = { version = "0.12.2", features = ["lua54"], optional = true }
napi = { version = "3.15.0", features = ["async"], optional = true }
napi-derive = { version = "3", optional = true }
neon = { version = "1.1.2", optional = true }
rustler = { version = "0.39.0", optional = true }
uniffi = { version = "0.32.2", optional = true }

[build-dependencies]
bindgen = "0.73.2"
cbindgen = "0.29.4"
# sccache 0.18 cannot parse the MSVC /Tp command emitted by cc 1.9.
cc = "=1.8.0"
cxx-build = { version = "1.0.205", optional = true } # Generates and compiles the optional C++ bridge example.
uniffi = { version = "0.32.2", optional = true }

[features]
cpp = ["dep:cxx", "dep:cxx-build"]
erlang = ["dep:rustler"]
flutter = ["dep:anyhow", "dep:flutter_rust_bridge"]
java = ["dep:jni"]
lua = ["dep:mlua", "mlua/vendored"]
lua-module = ["dep:mlua", "mlua/module"]
objc = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
node = ["dep:napi", "dep:napi-derive", "dep:neon"]
ruby = ["dep:magnus", "dep:rutie", "dep:anyhow"]
uniffi = ["dep:uniffi"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
magnus = { version = "0.9.3", features = ["embed"], optional = true }
rutie = { version = "0.14.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Embed Python and expose Rust functions to Python on Linux and Windows.
pyo3 = "0.30.1"

[lints]
workspace = true
