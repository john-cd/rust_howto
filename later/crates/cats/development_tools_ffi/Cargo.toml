[package]
name = "development_tools_ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - development_tools_ffi"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = [ "development-tools::ffi" ]
publish.workspace = true
autolib = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = { version = "1.0", optional = true }
cxx = { version = "1.0.136", optional = true }
flutter_rust_bridge = { version = "2.7.0", optional = true }
jni = { version = "0.21.1", optional = true }
napi = { version = "2.16.13", optional = true }
neon = { version = "1.0.0", optional = true }
mlua = { version = "0.11.2", features = ["lua54", "vendored"], optional = true }
rustler = { version = "0.36.0", optional = true }
uniffi = { version = "0.29", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
magnus = { version = "0.7.1", optional = true }
rutie = { version = "0.9.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pyo3 = "0.21.0" # pinned to avoid conflict with `polars`

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6.0", optional = true }
objc2-foundation = { version = "0.3.0", optional = true }
objc2-app-kit = { version = "0.3.0", optional = true }

[build-dependencies]
bindgen = "0.72.0"
cbindgen = "0.29.0"
cc = "1.2"
cxx-build = { version = "1.0.136", optional = true }
uniffi = { version = "0.29", optional = true }

[features]
cpp = ["dep:cxx", "dep:cxx-build"]
erlang = ["dep:rustler"]
flutter = ["dep:flutter_rust_bridge"]
java = ["dep:jni"]
lua = ["dep:mlua"]
objc = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
node = ["dep:napi", "dep:neon"]
ruby = ["dep:magnus", "dep:rutie", "dep:anyhow"]
uniffi = ["dep:uniffi"]

[package.metadata.cargo-machete]
ignored = ["cc", "bindgen", "cbindgen"]
