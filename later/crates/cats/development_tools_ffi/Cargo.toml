[package]
name = "development_tools_ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - development_tools_ffi"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::ffi"]
publish.workspace = true
autolib = false

[package.metadata.cargo-machete]
ignored = ["cc", "bindgen", "cbindgen"]

[features]
cpp = ["dep:cxx", "dep:cxx-build"]
erlang = ["dep:rustler"]
flutter = ["dep:flutter_rust_bridge"]
java = ["dep:jni"]
lua = ["dep:mlua"]
objc = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
node = ["dep:napi", "dep:neon"]
ruby = ["dep:magnus", "dep:rutie", "dep:anyhow"]
uniffi = ["dep:uniffi"]

[dependencies]
anyhow = { version = "1.0.102", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
cxx = { version = "1.0.194", optional = true }
flutter_rust_bridge = { version = "2.12.0", optional = true }
jni = { version = "0.22.4", optional = true }
mlua = { version = "0.11.6", features = ["lua54", "vendored"], optional = true }
napi = { version = "3.8.6", optional = true }
neon = { version = "1.1.1", optional = true }
rustler = { version = "0.37.4", optional = true }
uniffi = { version = "0.31.1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
magnus = { version = "0.8.2", optional = true }
rutie = { version = "0.9.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pyo3 = "0.28.3" # pinned to avoid conflict with `polars`

[build-dependencies]
bindgen = "0.72.1"
cbindgen = "0.29.2"
cc = "1.2.61"
cxx-build = { version = "1.0.194", optional = true }
uniffi = { version = "0.31.1", optional = true }
