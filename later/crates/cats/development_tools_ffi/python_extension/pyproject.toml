[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "rust-howto-python-module"
version = "0.1.0"
requires-python = ">=3.9"
description = "A small Python extension implemented in Rust with PyO3."

[tool.maturin]
module-name = "rust_howto_python_module"

[tool.ruff]
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[dependency-groups]
dev = ["maturin>=1.9.4,<2.0", "ruff>=0.15.10"]
