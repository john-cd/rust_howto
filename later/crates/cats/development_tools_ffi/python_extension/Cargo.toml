# TODO Reviewed ??-??-2026

[package]
name = "rust_howto_python_module"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Provides the PyO3 macros and safe bindings used by the Python extension.
pyo3 = "0.30.1"

[workspace]
resolver = "3"

[workspace.lints.clippy]
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
dbg_macro = "warn"
let_underscore_future = "warn"
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
all = { level = "warn", priority = -1 }
