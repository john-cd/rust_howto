[package]
name = "visualization"
version.workspace = true
description = "Book code examples and their crate dependencies - visualization"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["visualization"]
autolib = false

[[example]]
name = "visualization"
path = "examples/visualization/main.rs"
test = true

[dependencies]
## General
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Leptos is a full-stack, isomorphic Rust web framework leveraging fine-grained reactivity to build declarative user interfaces.
leptos = { version = "0.8.23", features = ["ssr"] }
# Chartistry is a charting library for Leptos
leptos-chartistry = "0.2.3"
# A plotting library powered by Plotly.js
plotly = "0.14.1"
# A Rust drawing library focus on data plotting for both WASM and native applications
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }

[lints]
workspace = true
