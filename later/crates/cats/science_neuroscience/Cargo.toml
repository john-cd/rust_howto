[package]
name = "science_neuroscience"
version.workspace = true
description = "Book code examples and their crate dependencies - science_neuroscience"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["science::neuroscience"]
autolib = false

[[example]]
name = "neuroscience"
path = "examples/neuroscience/main.rs"
test = true

[dependencies]
# An n-dimensional array for general elements and for numerics. Lightweight array views and slicing; views support chunking and splitting.
ndarray = "0.17.2" # Matches the ndarray type used by nifti's volume writer.
# Rust implementation of the NIfTI file format
nifti = { version = "0.18.0", features = ["ndarray_volumes"] }

