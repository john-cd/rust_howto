[package]
name = "multimedia_images"
version.workspace = true
description = "Book code examples and their crate dependencies - multimedia_images"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["multimedia::images"]
autolib = false

[[example]]
name = "color_handling"
path = "examples/color_handling/main.rs"
test = true

[[example]]
name = "images"
path = "examples/images/main.rs"
test = true

[[example]]
name = "pixel_buffers"
path = "examples/pixel_buffers/main.rs"
test = true

[dependencies]
# Imaging library. Provides basic image processing and encoders/decoders for common image formats.
image = "0.25.10"
# Exif parsing library written in pure Rust
kamadak-exif.workspace = true
# A lossless PNG compression optimizer
oxipng.workspace = true
# Convert and manage colors with a focus on correctness, flexibility and ease of use.
palette = "0.7.7"

[dev-dependencies]
# Isolate generated image files during tests.
tempfile = "3.27.0"

[lints]
workspace = true
