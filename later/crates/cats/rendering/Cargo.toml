[package]
name = "rendering"
version.workspace = true
description = "Book code examples and their crate dependencies - rendering"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["rendering"]
autolib = false

[[example]]
name = "2d_raster_graphics"
path = "examples/2d_raster_graphics/main.rs"
test = true

[[example]]
name = "2d_renderers"
path = "examples/2d_renderers/main.rs"
test = true

[[example]]
name = "2d_vector_graphics"
path = "examples/2d_vector_graphics/main.rs"
test = true

[[example]]
name = "3d_renderers"
path = "examples/3d_renderers/main.rs"
test = true

[[example]]
name = "svg_rendering"
path = "examples/svg_rendering/main.rs"
test = true

[[example]]
name = "text_rendering"
path = "examples/text_rendering/main.rs"
test = true

[dependencies]
# An SVG rendering library.
resvg = "0.49.0" # Rasterizes normalized SVG trees into pixmaps.
# An SVG simplification library.
usvg = "0.49.0" # Parses and normalizes SVG documents.

[dev-dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104" # Provides a fallible entry point for the example runner.
# A simple no_std font parser and rasterizer.
fontdue = "0.9.5" # Rasterizes a glyph without a window or GPU.
# A simple and fast 3D math library for games and graphics
glam = "0.34.3" # Computes the 3D projection in the renderer example.
# 2D Graphics rendering on the GPU using tessellation.
lyon = "1.0.19" # Builds and tessellates paths in the vector graphics example.
# A tiny Skia subset ported to Rust.
tiny-skia = "0.12.0" # Draws CPU-backed pixmaps without a window or GPU.
# A high-level, safe, zero-allocation font parser for TrueType, OpenType, and AAT.
ttf-parser = "0.25.1" # Reads font metrics without rasterizing.

[lints]
workspace = true
