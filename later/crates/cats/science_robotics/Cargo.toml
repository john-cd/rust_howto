# TODO Reviewed ??-??-2026

[package]
license-file.workspace = true
name = "science_robotics"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - science_robotics"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["science::robotics"]
publish.workspace = true
autolib = false

[features]
default = []
openrr = ["dep:openrr"]
rosrust = ["dep:rosrust", "dep:rosrust_msg"]
zenoh = ["dep:zenoh"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bonsai-bt = "0.14.0"
clap = { version = "4.6.7", features = ["derive"] }
openrr = { version = "0.1.0", optional = true }
pathfinding = "4.14.0"
pid = "4.0.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zenoh = { version = "1.10.1", optional = true } # Opt-in; used only by the Zenoh robotics-framework example.

[target.'cfg(not(target_os = "windows"))'.dependencies]
rosrust = { version = "0.9.12", optional = true }
rosrust_msg = { version = "0.1.8", optional = true }

[[example]]
name = "artificial_intelligence"
path = "examples/artificial_intelligence/main.rs"
test = true

[[example]]
name = "control_systems"
path = "examples/control_systems/main.rs"
test = true

[[example]]
name = "hardware_integration"
path = "examples/hardware_integration/main.rs"
test = true

[[example]]
name = "perception_and_sensors"
path = "examples/perception_and_sensors/main.rs"
test = true

[[example]]
name = "robot_operating_systems"
path = "examples/robot_operating_systems/main.rs"
test = true

[[example]]
name = "robotics_frameworks"
path = "examples/robotics_frameworks/main.rs"
test = true

[[example]]
name = "simulation_visualization"
path = "examples/simulation_visualization/main.rs"
test = true

[lints]
workspace = true
