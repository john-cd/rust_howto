[package]
name = "science_geo"
version.workspace = true
description = "Book code examples and their crate dependencies - science_geo"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["science::geo"]
autolib = false

[[example]]
name = "geo"
path = "examples/geo/main.rs"
test = true

[dependencies]
geo = "0.33.1"
geocoding = "0.4.0"
geojson.workspace = true
geos = { version = "11.3.1", optional = true } # Bindings to the GEOS C library; enable the `geos` feature.
haversine = "0.2.1"
rstar.workspace = true
us-state-info = "0.2.7"

[features]
default = []
geos = ["dep:geos"]

[lints]
workspace = true
