# TODO Reviewed ??-??-2026

[package]
name = "wasm"
version.workspace = true
authors.workspace = true
autolib = false
categories = ["wasm"]
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
license-file.workspace = true
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - wasm"

[features]
wasmtime = ["dep:wasmtime", "dep:wat", "dep:blake3"]

[dependencies]
any_spawner = { version = "0.3.0", features = ["tokio"] }

## General
anyhow = "1.0.104"
blake3 = { version = "1.8.7", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
# LATER add example?
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["ssr"] }
leptos_router = { version = "0.8.17", features = ["ssr"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
wasm-bindgen = "0.2.129"
wasmtime = { version = "50.0.0", optional = true } # Heavy compile
wat = { version = "1.262.0", optional = true }
web-sys = { version = "0.3.106", features = ["Window"] }
yew = { version = "0.23.0", features = ["csr", "ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic-web-wasm-client = "0.9.2"

[[example]]
name = "interfacing_with_javascript"
path = "examples/interfacing_with_javascript/main.rs"
test = true

[[example]]
name = "leptos_client"
path = "examples/leptos_client/main.rs"
test = true

[[example]]
name = "wasm_development"
path = "examples/wasm_development/main.rs"
test = true

[[example]]
name = "wasm_standalone_runtimes"
path = "examples/wasm_standalone_runtimes/main.rs"
test = true

[[example]]
name = "yew"
path = "examples/yew/main.rs"
test = true

[lints]
workspace = true
