[package]
license-file.workspace = true
name = "wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - wasm"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["wasm"]
publish.workspace = true
autolib = false

[features]
wasmtime = ["dep:wasmtime", "dep:wat", "dep:blake3"]

[dependencies]

## General
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# LATER add example?
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasmer = "6.1.0"
wasmtime = { version = "43.0.2", optional = true } # Heavy compile
wat = { version = "1", optional = true }
blake3 = { version = "1", optional = true }
web-sys = { version = "0.3.106", features = ["Window"] }
yew = { version = "0.23.0", features = ["csr"] }

[[example]]
name = "interfacing_with_javascript"
path = "examples/interfacing_with_javascript/main.rs"
test = true

[[example]]
name = "wasm_development"
path = "examples/wasm_development/main.rs"
test = true

[[example]]
name = "wasm_standalone_runtimes"
path = "examples/wasm_standalone_runtimes/main.rs"
test = true

[[example]]
name = "yew"
path = "examples/yew/main.rs"
test = true

[lints]
workspace = true
