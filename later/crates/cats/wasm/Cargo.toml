[package]
name = "wasm"
version.workspace = true
description = "Book code examples and their crate dependencies - wasm"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["wasm"]
autolib = false

[[example]]
name = "interfacing_with_javascript"
path = "examples/interfacing_with_javascript/main.rs"
test = true

[[example]]
name = "leptos_client"
path = "examples/leptos_client/main.rs"
test = true

[[example]]
name = "wasm_development"
path = "examples/wasm_development/main.rs"
test = true

[[example]]
name = "wasm_standalone_runtimes"
path = "examples/wasm_standalone_runtimes/main.rs"
test = true

[[example]]
name = "wasm_basics"
path = "examples/wasm_basics/main.rs"
test = true

[[example]]
name = "yew"
path = "examples/yew/main.rs"
test = true

[dependencies]
any_spawner = { version = "0.3.0", features = ["tokio"] }

## General
anyhow = "1.0.104"
blake3 = { version = "1.8.7", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
icondata = { version = "0.7.0", default-features = false, features = ["lucide"] }
# LATER add example?
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["ssr"] }
leptos_router = { version = "0.8.17", features = ["ssr"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.7"
tonic-prost = "0.14.7"
wasm-bindgen = "0.2.129"
wasmparser = "0.262.0"
wasmtime = { version = "50.0.0", optional = true } # Heavy compile
wat = "1.262.0"
web-sys = { version = "0.3.106", features = ["Window"] }
yew = { version = "0.23.0", features = ["csr", "ssr"] }

[features]
wasmer = ["dep:wasmer"]
wasmtime = ["dep:wasmtime", "dep:blake3"]

[target.'cfg(target_os = "windows")'.dependencies]
wasmer = { workspace = true, features = ["v8-default"], optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wasmer = { workspace = true, features = ["singlepass"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6.5"
tonic-web-wasm-client = "0.9.2"
wasm-bindgen-futures = "0.4.79"

[lints]
workspace = true
