[package]
name = "greeter_guest"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Rust bindings generator and runtime support for WIT and the component model. Used when compiling Rust programs to the component model.
wit-bindgen = "0.63.0"

# TODO Reviewed ??-??-2026.

# The guest is built for `wasm32-wasip2`, so it is its own workspace
# rather than a member of the host's.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
