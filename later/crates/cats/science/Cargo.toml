# TODO Reviewed ??-??-2026

[package]
name = "science"
version.workspace = true
authors.workspace = true
autolib = false
categories = ["science"]
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["science", "machine-learning", "ndarray", "linfa", "candle", "ai"]
license-file.workspace = true
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Scientific computing and machine learning examples using Ndarray, Linfa, and Candle."

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn"]

[dependencies]
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
linfa = "0.8.1"
linfa-clustering = "0.8.1"
linfa-linear = "0.8.1"
ndarray = "0.17.2"
# Keep Linfa 0.8.1's dataset and fit APIs on their ndarray 0.16 array types.
ndarray_016 = { package = "ndarray", version = "0.16.1" }
rand = { version = "0.10.3", features = ["std"] }
rand_08 = { package = "rand", version = "0.8.8", features = ["std", "std_rng"] }
smartcore = "0.6.16"

[[example]]
name = "ml"
path = "examples/ml/main.rs"
test = true

[lints]
workspace = true
