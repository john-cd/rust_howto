[package]
name = "science"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Scientific computing and machine learning examples using Ndarray, Linfa, and Candle."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["science", "machine-learning", "ndarray", "linfa", "candle", "ai"]
categories = ["science"]
publish.workspace = true
autolib = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
candle-core = { version = "0.9.1", optional = true }
candle-nn = { version = "0.9.1", optional = true }
linfa = "0.7.0"
linfa-linear = "0.7.0"
ndarray = "0.15.6" # pinned to 0.15.6 for linfa
smartcore = "0.4.0"
rand = { version = "0.10.1", features = ["std"] }

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn"]
