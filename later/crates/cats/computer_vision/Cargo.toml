[package]
name = "computer_vision"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - computer_vision"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["computer-vision"]
publish.workspace = true
autolib = false

[dependencies]
rand = { version = "0.10.1", features = ["thread_rng"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", optional = true }
opencv = { version = "0.98.2", default-features = false, features = [ "clang-runtime", "imgcodecs", "imgproc" ], optional = true }
# The above requires `libopencv-dev` `clang` `libclang-dev`

[features]
# default = []
opencv = ["dep:opencv", "dep:image"]
