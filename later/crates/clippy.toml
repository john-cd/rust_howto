# TODO Reviewed ??-??-2026.

# Relaxed rules in tests
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = false
allow-expect-in-tests = true
allow-dbg-in-tests = true

# Relaxed rules in const
allow-expect-in-consts = true

# Enforce a hard ceiling while the style guide applies the stricter character-based preference.
absolute-paths-max-segments = 3

# Disallow ambiguous abbreviations and generic variable names
# For configurations that are a list type with default values such as disallowed-names, you can use the unique value ".." to extend the default values instead of replacing them.
disallowed-names = ["cmds", "res", "idx", ".."]

# Disallow unbounded channels to enforce bounded memory usage
disallowed-methods = [
  { path = "std::sync::mpsc::channel", reason = "unbounded std::sync::mpsc::channel is prohibited; use bounded channels (e.g. crossbeam_channel::bounded or tokio::sync::mpsc::channel) or EventSender wrappers" },
  { path = "crossbeam_channel::unbounded", reason = "unbounded crossbeam_channel is prohibited; use crossbeam_channel::bounded" },
  { path = "flume::unbounded", reason = "unbounded flume channel is prohibited; use flume::bounded" },
  { path = "tokio::sync::mpsc::unbounded_channel", reason = "unbounded tokio mpsc channel is prohibited; use tokio::sync::mpsc::channel" },
]

allowed-duplicate-crates = []

# Suppress lints whenever the suggested change would cause breakage for other crates.
avoid-breaking-exported-api = false

# Checks for blocks which are nested beyond a certain threshold.
excessive-nesting-threshold = 5
