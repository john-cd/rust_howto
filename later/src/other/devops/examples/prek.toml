# File checks supplied by prek.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

# Local hooks for Rust workspaces.
[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt --check",
    entry = "cargo fmt --all -- --check",
    language = "system",
    files = '\.rs$',
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings",
    language = "system",
    files = '\.rs$',
    pass_filenames = false,
  },
]
