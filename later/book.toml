[book]
title = "The Rust How-to Book: Future Chapters"
language = "en"
src = "src"

[build]
create-missing = false

[rust]
edition = "2024"

[preprocessor.scrub]
do-not-include-hidden-chapters = false
command = "../bin/mdbook-scrub"
before = ["links"]

[preprocessor.links]
after = ["scrub"]

[preprocessor.directives]
command = "../bin/mdbook-scrub --stage directives"
after = ["links"]

[output.html]
