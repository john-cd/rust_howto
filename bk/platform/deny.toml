# TODO Reviewed ??-??-2026.

# Advisory policy for the staging workspace `later/crates`. It is not built or
# published by the book, so these entries document triage instead of blocking CI.
# Run: `cargo deny --manifest-path Cargo.toml check advisories` from this folder.
#
# The default gate follows ordinary workspace features. Audit optional
# integrations separately with `cargo deny --all-features check advisories`;
# the full lockfile is also inspected with `cargo audit`.
#
# Unmaintained and unsound warnings (anymap2, bincode, im, paste, rustybuzz,
# ttf-parser, zvariant, zstd-safe, ...) come from transitive dependencies of the
# GUI, graphics, data-frame, ML, and WebAssembly stacks. They remain teaching
# exceptions while the chapters stay in staging. `unmaintained`/`unsound` below
# only consider direct workspace dependencies, which are listed individually.

[graph]
all-features = false

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 is pinned by hyper 0.14 through geocoding 0.4 in science_geo. Only the optional locate_online helper reaches the fixed OpenStreetMap provider; the example entry point and tests use a fake provider, and users cannot select an endpoint. A malicious peer could still send hostile HTTP/2 frames if that helper is used. No compatible geocoding update exists; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 is pinned by urdf-rs 0.9.1 (via k 0.32.0 in science_robotics); the fix is in 0.41. The kinematics example parses only a URDF string embedded in the source, never untrusted XML. Recheck when urdf-rs updates quick-xml; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 is pinned by urdf-rs 0.9.1 (via k 0.32.0 in science_robotics); the fix is in 0.41. The kinematics example parses only a URDF string embedded in the source, never untrusted XML. Recheck when urdf-rs updates quick-xml; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0192", reason = "The staging rendering font-metrics example directly uses unmaintained ttf-parser 0.25.1. Upstream has no fixed release; evaluate replacing the parser with skrifa. Other GUI and game dependencies also select this version. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 remains pinned by ggez 0.10.0, which requires zip 8.x. The example draws generated geometry and does not open or extract ZIP archives, so SUID/SGID preservation is not reached. Recheck when ggez accepts zip 9; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 remains pinned by ggez 0.10.0, which requires zip 8.x. The example does not call ZipArchive::extract or accept an archive, so attacker-controlled symlink targets are not exercised. Recheck when ggez accepts zip 9; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 remains pinned by ggez 0.10.0, which requires zip 8.x. The example does not extract archives or apply archive permissions through symlinks. Recheck when ggez accepts zip 9; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  # RUSTSEC-2026-0429: ggez still requires zip 8.x; its example does not extract archives.
  { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 remains pinned by ggez 0.10.0, which requires zip 8.x; the fix is in zip 9.0.0. The example draws generated geometry and does not extract archives. Recheck when ggez accepts zip 9; keep staging-only. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 has secret-dependent timing in operations intended to be constant-time. The locked graph still reaches elliptic-curve 0.13.8 through Alloy's k256 0.13 and str0m's p256/p384 0.13; those crates need compatible updates to use the fixed crypto-bigint 0.7 line. The timing risk remains, so keep affected examples staging-only and recheck when either chain changes. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2025-0035", reason = "macroquad is a direct dependency of a staging crate; no fixed release exists. Replace or isolate it before the chapter leaves staging. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2024-0436", reason = "paste is a direct dependency of a staging crate. Replace it (for example with pastey) before promotion. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2116" },
]
unmaintained = "workspace"
unsound = "workspace"

# License, ban and source policy for the staging workspace; mirrors bk/crates/deny.toml.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-2-Clause-Patent",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MITNFA",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "X11",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
  # egui bundles the Ubuntu and Hack fonts (SIL OFL 1.1 and the Ubuntu Font License) in this crate.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
  { crate = "epaint_default_fonts@=0.34.3", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
  { crate = "epaint_default_fonts@=0.36.2", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
  { crate = "epaint_default_fonts@=0.37.0", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
  # The optional Slint examples use the upstream royalty-free license option.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
  { crate = "i-slint-backend-selector@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-winit@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-common@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-compiler@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core-macros@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-femtovg@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-skia@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-software@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "slint@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "slint-macros@=1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  # The optional Wasmer recipe demonstrates Singlepass on non-Windows hosts.
  # The book distributes example source. The shipped license restricts production use.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
  { crate = "wasmer-compiler-singlepass@=7.5.0", allow = ["BUSL-1.1"] },
]

# Published manifests point to license files without SPDX expressions.
# Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
[[licenses.clarify]]
crate = "allo-isolate@=0.1.27"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0a6d4ed6 }]

[[licenses.clarify]]
crate = "wasmer-compiler-singlepass@=7.5.0"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xa3d75455 }]

[licenses.private]
# Workspace examples are not published packages; the root LICENSE is not an
# SPDX license grant for these private workspace members.
ignore = true

[bans]
# Keep duplicate and wildcard dependency debt visible without hiding crates.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # The finance example pins trading-calendar to the commit with fixed lru.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2116
  "https://github.com/danjloveless/trading-calendar",
  # The optional window-creation example pins Baseview to a Git commit.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
  "https://github.com/RustAudio/baseview",
]
