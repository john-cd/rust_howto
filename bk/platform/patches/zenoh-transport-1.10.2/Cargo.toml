[package]
name = "zenoh-transport"
version = "1.10.2"
description = "Internal crate for zenoh."
authors = [
    "Julien Enoch <julien@enoch.fr>",
    "Luca Cominardi <luca.cominardi@zettascale.tech>",
    "Olivier Hécart <olivier.hecart@zettascale.tech>",
    "Pierre Avital <pierre.avital@zettascale.tech>",
    "kydos <angelo@icorsaro.net>",
]
edition = "2021"
rust-version = "1.75.0"
license = "EPL-2.0 OR Apache-2.0"
readme = "README.md"
homepage = "http://zenoh.io"
repository = "https://github.com/eclipse-zenoh/zenoh"
categories = ["network-programming"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
name = "zenoh_transport"
path = "src/lib.rs"

[dependencies]
# Type erasure for async trait methods
async-trait= { version = "0.1.92"}
# Utilities for concurrent programming
crossbeam-utils= { version = "0.8.23"}
# A blazingly fast multi-producer channel
# Must match zenoh-link channel types crossing the transport API.
flume= { version = "0.11.1"}
# An implementation of futures and streams featuring zero allocations, composability, and iterator-like interfaces.
futures= { version = "0.3.34"}
# A macro for declaring lazily evaluated statics in Rust.
lazy_static= { version = "1.5.1"}
# This crate provides concurrent data structures and a solution to the ABA problem as an alternative of hazard pointers
lockfree= { version = "0.5", optional = true}
# Fastest LZ4 implementation in Rust, no unsafe by default.
lz4_flex= { version = "0.11.6"}
# Random number generators and other randomness functionality.
# zenoh-crypto 1.10.2 exposes rand_chacha 0.3, using rand 0.8 traits.
rand= { version = "0.8.8", features = ["default"], default-features = false}
# A fast thread-safe single producer-single consumer ring buffer
ringbuffer-spsc= { version = "0.1.15"}
# Pure Rust RSA implementation
rsa= { version = "0.9.10", optional = true}
# A generic serialization/deserialization framework
serde= { version = "1.0.229", features = [
    "derive",
    "default",
], default-features = false}
# Implementation of the SHA-3 family of cryptographic hash algorithms
sha3= { version = "0.10.9"}
# Safe mutable static and non const static initialization, and code execution at program startup/exit.
static_init= { version = "1.0.3", optional = true}
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio= { version = "1.53.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
], default-features = false}
# Additional utilities for working with Tokio.
tokio-util= { version = "0.7.19", features = ["rt"]}
# Application-level tracing for Rust.
tracing= { version = "0.1.44"}
# Efficient byte buffers used by Zenoh protocol and transport code.
zenoh-buffers= { version = "=1.10.2", default-features = false}
# Encodes and decodes Zenoh protocol messages.
zenoh-codec= { version = "=1.10.2"}
# Configuration types and parsing for Zenoh.
zenoh-config= { version = "=1.10.2"}
# Core identifiers, primitives, and types for Zenoh.
zenoh-core= { version = "=1.10.2"}
# Cryptographic primitives and security helpers for Zenoh.
zenoh-crypto= { version = "=1.10.2"}
# Transport link abstractions used by Zenoh.
zenoh-link= { version = "=1.10.2"}
# Shared utilities for Zenoh transport link implementations.
zenoh-link-commons= { version = "=1.10.2"}
# Zenoh wire protocol message and data types.
zenoh-protocol= { version = "=1.10.2", default-features = false}
# Shared error and result types used by Zenoh crates.
zenoh-result= { version = "=1.10.2", default-features = false}
# Runtime services and resource management for Zenoh.
zenoh-runtime= { version = "=1.10.2"}
# Shared-memory transport support for Zenoh.
zenoh-shm= { version = "=1.10.2", optional = true}
# Statistics and telemetry types for Zenoh.
zenoh-stats= { version = "=1.10.2", optional = true}
# Synchronization primitives used by Zenoh components.
zenoh-sync= { version = "=1.10.2"}
# Task spawning and async execution helpers for Zenoh.
zenoh-task= { version = "=1.10.2"}
# Linux io_uring transport support for Zenoh.
zenoh-uring= { version = "=1.10.2", optional = true}
# Common utilities shared across Zenoh crates.
zenoh-util= { version = "=1.10.2"}

[features]
auth_pubkey = [
    "rsa",
    "transport_auth",
]
auth_usrpwd = ["transport_auth"]
default = [
    "test",
    "transport_multilink",
]
shared-memory = [
    "lockfree",
    "static_init",
    "zenoh-buffers/shared-memory",
    "zenoh-codec/shared-memory",
    "zenoh-protocol/shared-memory",
    "zenoh-shm",
    "zenoh-stats?/shared-memory",
]
stats = ["zenoh-stats"]
test = []
transport_auth = []
transport_compression = []
transport_multilink = ["auth_pubkey"]
transport_quic = ["zenoh-link/transport_quic"]
transport_quic_datagram = ["zenoh-link/transport_quic_datagram"]
transport_serial = ["zenoh-link/transport_serial"]
transport_tcp = [
    "zenoh-config/transport_tcp",
    "zenoh-link/transport_tcp",
]
transport_tls = ["zenoh-link/transport_tls"]
transport_udp = ["zenoh-link/transport_udp"]
transport_unixpipe = ["zenoh-link/transport_unixpipe"]
transport_unixsock-stream = ["zenoh-link/transport_unixsock-stream"]
transport_vsock = ["zenoh-link/transport_vsock"]
transport_ws = ["zenoh-link/transport_ws"]
unstable = [
    "zenoh-config/unstable",
    "zenoh-protocol/unstable",
]
uring = [
    "zenoh-link/uring",
    "zenoh-uring",
]
