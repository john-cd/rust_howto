# TODO Reviewed ??-??-2026.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--color", "always"]
need_stdout = true
analyzer = "nextest"
