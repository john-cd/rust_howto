# File checks supplied by prek.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

# Local hooks for Rust workspaces.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all"
language = "system"
files = '\.rs$'
pass_filenames = false
