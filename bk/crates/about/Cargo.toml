# Reviewed 10-27-2026.

[package]
name = "about"
version.workspace = true
description = "Book code examples and their crate dependencies"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories.workspace = true
autolib = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[example]]
name = "about"
path = "examples/about.rs"
test = true

[[example]]
name = "about1"
path = "examples/about1.rs"
test = true

[[example]]
name = "about2"
path = "examples/about2.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Random number generators and other randomness functionality.
rand = { version = "0.10.3", features = ["thread_rng"] }
# URL library for Rust, based on the WHATWG URL Standard
url = "2.5.8"

[lints]
workspace = true
