[package]
name = "language"
version.workspace = true
description = "Examples covering fundamental Rust language features, macros, and asynchronous programming."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
keywords = ["language", "rust-fundamentals", "macros", "tokio", "strum"]
autolib = false

