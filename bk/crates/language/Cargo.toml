[dependencies]
anyhow = "1.0.104"
cfg-if = "1.0.5"
clap = { version = "4.6.7", features = ["derive"] }
proc_macros = { path = "../proc_macros" }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
trybuild = "1.0.122"

