[workspace]
resolver = "3"
members = [
    "about",
    "cats/algorithms",
    "cats/asynchronous",
    "cats/authentication",
    "cats/caching",
    "cats/command_line_interface",
    "cats/compression",
    "cats/concurrency",
    "cats/config",
    "cats/cryptography",
    "cats/data_structures",
    "cats/database",
    "cats/database_implementations",
    "cats/date_and_time",
    "cats/development_tools",
    "cats/development_tools_build_utils",
    "cats/development_tools_cargo_plugins",
    "cats/development_tools_debugging",
    "cats/development_tools_profiling",
    "cats/development_tools_testing",
    "cats/email",
    "cats/encoding",
    "cats/filesystem",
    "cats/graphics",
    "cats/hardware_support",
    "cats/mathematics",
    "cats/memory_management",
    "cats/network_programming",
    "cats/os",
    "cats/os_unix_apis",
    "cats/os_windows_apis",
    "cats/parser_implementations",
    "cats/parsing",
    "cats/rust_patterns",
    "cats/template_engine",
    "cats/text_processing",
    "cats/web_programming",
    "cats/web_programming_http_client",
    "cats/web_programming_http_server",
    "code_organization",
    "language",
    "proc_macros",
    "standard_library",
    "utils",
]
exclude = []

# Default values for packages in the workspace
[workspace.package]
version = "0.1.2"
authors = ["John CD"]
edition = "2024"
rust-version = "1.90"
description = "A documentation summary and a compendium of snippets and recipes for the Rust language and ecosystem. Everything you need for day-to-day Rust coding, all in one place."
documentation = "https://docs.rs/rust_howto/"
homepage = "https://john-cd.com/rust_howto/"
repository = "https://github.com/john-cd/rust_howto/"
license-file = "../LICENSE"
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = [
    "algorithms",
    "asynchronous",
    "concurrency",
    "web-programming",
    "development-tools",
    "api-bindings",
    "caching",
    "command-line-interface",
    "compilers",
    "compression",
]
publish = false

[workspace.lints.clippy]
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# Optional
# expect_used = "warn"
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"  # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
