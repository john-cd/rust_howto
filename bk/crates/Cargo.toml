[workspace]
resolver = "3"
members = [
    "about",
    "cats/algorithms",
    "cats/asynchronous",
    "cats/authentication",
    "cats/caching",
    "cats/command_line_interface",
    "cats/compression",
    "cats/concurrency",
    "cats/config",
    "cats/cryptography",
    "cats/data_structures",
    "cats/database",
    "cats/database_implementations",
    "cats/date_and_time",
    "cats/development_tools",
    "cats/development_tools_build_utils",
    "cats/development_tools_cargo_plugins",
    "cats/development_tools_debugging",
    "cats/development_tools_profiling",
    "cats/development_tools_testing",
    "cats/email",
    "cats/encoding",
    "cats/filesystem",
    "cats/graphics",
    "cats/hardware_support",
    "cats/mathematics",
    "cats/memory_management",
    "cats/network_programming",
    "cats/os",
    "cats/os_unix_apis",
    "cats/os_windows_apis",
    "cats/parser_implementations",
    "cats/parsing",
    "cats/rust_patterns",
    "cats/template_engine",
    "cats/text_processing",
    "cats/web_programming",
    "cats/web_programming_http_client",
    "cats/web_programming_http_server",
    "code_organization",
    "language",
    # "other",
    "proc_macros",
    "standard_library",
    "utils",
]
exclude = []

# Default values for packages in the workspace
[workspace.package]
version = "0.1.2"
authors = ["John CD"]
edition = "2024"
rust-version = "1.86"
description = "A documentation summary and a compendium of snippets and recipes for the Rust language and ecosystem. Everything you need for day-to-day Rust coding, all in one place."
documentation = "https://docs.rs/rust_howto/"
homepage = "https://john-cd.com/rust_howto/"
repository = "https://github.com/john-cd/rust_howto/"
license-file = "../LICENSE"
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = [
    "algorithms",
    "asynchronous",
    "concurrency",
    "web-programming",
    "development-tools",
    "api-bindings",
    "caching",
    "command-line-interface",
    "compilers",
    "compression",
]
publish = false

