[package]
license-file.workspace = true
name = "mathematics"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - mathematics"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["mathematics"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.104"
approx = "0.5.1" # was pinned at 0.4.0
argmin = { version = "0.11.0", default-features = false } # Scalar root finding and optimization algorithms.
argmin-math = { version = "0.5.1", default-features = false, features = ["vec"] } # `Vec<f64>` parameters for `argmin` solvers.
cmaes = "0.2.2" # CMA-ES evolution strategy.
clap = { version = "4.6.7", features = ["derive"] }
fixed = "1.31.0"
half = "2.7.1"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
ndarray = { version = "0.17.2", features = [
    "approx",
] } # was pinned to 0.15.6 for linfa
num = "0.4.3"
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2.19"
ode_solvers = "0.6.2" # Fixed-step and adaptive solvers for ordinary differential equations.
ordered-float = "5.5.0"
petgraph = "0.8.3" # Directed graphs and graph algorithms.
rand = "0.10.3" # Seeded random numbers for the particle swarm example.
radiate = { version = "1.3.2", default-features = false } # Genetic algorithms.
rayon = "1.12.0" # Parallel evaluation of independent graph levels.
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
serde_json = "1.0.154"
typenum = "1.20.1"
uom = "0.38.0" # Type-safe physical quantities and unit conversion.

[target.'cfg(target_os = "linux")'.dependencies]
rug = "1.30.0"

[dev-dependencies]
proptest = "1.12.0" # Generate DAGs for topological order property tests.

[[example]]
name = "additional_numeric_types"
path = "examples/additional_numeric_types/main.rs"
test = true

[[example]]
name = "complex_numbers"
path = "examples/complex_numbers/main.rs"
test = true

[[example]]
name = "discrete_mathematics"
path = "examples/discrete_mathematics/main.rs"
test = true

[[example]]
name = "differential_equations"
path = "examples/differential_equations/main.rs"
test = true

[[example]]
name = "graph_theory"
path = "examples/graph_theory/main.rs"
test = true

[[example]]
name = "linear_algebra"
path = "examples/linear_algebra/main.rs"
test = true

[[example]]
name = "numerical_analysis"
path = "examples/numerical_analysis/main.rs"
test = true

[[example]]
name = "optimization"
path = "examples/optimization/main.rs"
test = true

[[example]]
name = "stats"
path = "examples/stats/main.rs"
test = true

[[example]]
name = "trigonometry"
path = "examples/trigonometry/main.rs"
test = true

[[example]]
name = "units"
path = "examples/units/main.rs"
test = true

[lints]
workspace = true
