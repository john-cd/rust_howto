[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Approximate floating point equality comparisons and assertions.
approx = "0.5.1" # was pinned at 0.4.0
# Numerical optimization in pure Rust
argmin = { version = "0.11.0", default-features = false } # Scalar root finding and optimization algorithms.
# Provides numeric and linear algebra abstractions for argmin optimization solvers.
argmin-math = { version = "0.5.1", default-features = false, features = [
    "vec",
] } # `Vec<f64>` parameters for `argmin` solvers.
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# An implementation of the CMA-ES optimization algorithm.
cmaes = "0.2.2" # CMA-ES evolution strategy.
# Provides fixed-point numeric types for deterministic arithmetic without floating-point rounding.
fixed = "1.31.0"
# Half-precision floating point f16 and bf16 types for Rust implementing the IEEE 754-2008 standard binary16 and bfloat16 types.
half = "2.7.1"
# General-purpose linear algebra library; pin 0.34.2 to match ode_solvers 0.6.2's matrix types.
nalgebra = { version = "=0.34.2", features = ["serde-serialize"] }
# An n-dimensional array for general elements and for numerics. Lightweight array views and slicing; views support chunking and splitting.
ndarray = { version = "0.17.2", features = [
    "approx",
] } # was pinned to 0.15.6 for linfa
# A collection of numeric types and traits for Rust, including bigint, complex, rational, range iterators, generic integers, and more!
num = "0.4.3"
# Big integer implementation for Rust
num-bigint = "0.5.1"
# Rational numbers implementation for Rust
num-rational = "0.4.2"
# Numeric traits for generic mathematics
num-traits = "0.2.19"
# Numerical methods to solve ordinary differential equations (ODEs) in Rust.
ode_solvers = "0.6.2" # Fixed-step and adaptive solvers for ordinary differential equations.
# Wrappers for total ordering on floats
ordered-float = "5.5.1"
# Graph data structure library. Provides graph types and graph algorithms.
petgraph = "0.8.3" # Directed graphs and graph algorithms.
# A Rust library for genetic algorithms and artificial evolution.
radiate = { version = "1.3.2", default-features = false } # Genetic algorithms.
# Random number generators and other randomness functionality.
rand = "0.10.3" # Seeded random numbers for the particle swarm example.
# Either acts as rayon or creates a single-threaded facade
rayon = "1.12.0" # Parallel evaluation of independent graph levels.
# Decimal number implementation written in pure Rust suitable for financial and fixed-precision calculations.
rust_decimal = "1.43.0"
# Shorthand macros to assist creating Decimal types.
rust_decimal_macros = "1.40.0"
# A JSON serialization file format
serde_json = "1.0.154"
# A sparse matrix library
sprs = "0.11.6"
# Typenum is a Rust library for type-level numbers evaluated at compile time. It currently supports bits, unsigned integers, and signed integers....
typenum = "1.20.1"
# Provides unit-aware quantities and dimensional analysis for physical measurements.
uom = "0.38.0" # Type-safe physical quantities and unit conversion.

[dev-dependencies]
# Hypothesis-like property-based testing and shrinking.
proptest = "1.12.0" # Generate DAGs for topological order property tests.

[target.'cfg(target_os = "linux")'.dependencies]
# Arbitrary-precision integers, rational, floating-point and complex numbers based on GMP, MPFR and MPC.
rug = "1.30.0"

[lints]
workspace = true
