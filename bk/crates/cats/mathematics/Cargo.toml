[package]
name = "mathematics"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - mathematics"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["mathematics"]
publish.workspace = true
autolib = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.100"
approx = "0.5.1" # was pinned at 0.4.0
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
ndarray = { version = "0.16.1", features = [
    "approx",
] } # was pinned to 0.15.6 for linfa
num = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
ordered-float = "5.1.0"
rust_decimal = "1.39.0"
rust_decimal_macros = "1.39.0"
serde_json = "1.0.145"
typenum = "1.17.0"

[target.'cfg(target_os = "linux")'.dependencies]
rug = "1.28.0"
