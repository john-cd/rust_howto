[package]
name = "development_tools_profiling"
version.workspace = true
description = "Book code examples and their crate dependencies - development_tools_profiling"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::profiling"]

[[bench]]
name = "divan"
# When set to false, you are responsible for defining a main() function to run tests and benchmarks.
harness = false

[[example]]
name = "benchmarking"
path = "examples/benchmarking/main.rs"
test = true

[[example]]
name = "dhat_assertions"
path = "examples/dhat_assertions.rs"
test = true

[[example]]
name = "profiling_scopes"
path = "examples/profiling_scopes.rs"
test = true

[[example]]
name = "puffin_server"
path = "examples/puffin_server.rs"
test = true

[dependencies]
# Measures Rust benchmark performance with statistical analysis and comparison reports.
criterion = "0.8.2"
# A library for heap profiling and ad hoc profiling with DHAT.
dhat = "0.3.3"
# Provices macros to measure the time until end of scope.
measure_time = "0.9.0"
# This crate provides a very thin abstraction over other profiler crates.
profiling = "1.0.18"
# Simple instrumentation profiler for games
puffin = "0.20.0"
# TCP server/client for puffin profiler data
puffin_http = "0.17.0"

[dev-dependencies]
# Provides statistical microbenchmarking, output formatting, and benchmark comparison tools.
divan = "0.1.21"

## Config for dhat example below:
## Profiles for the non root package are ignored.
# [profile.release]
# debug = 1

[features]
dhat-heap = []
dhat-ad-hoc = []
# Select the `profiling` backend in one place:
profile-with-puffin = ["profiling/profile-with-puffin"]

[lints]
workspace = true
