[package]
name = "development_tools_profiling"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - development_tools_profiling"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools::profiling"]
publish.workspace = true

## Config for dhat example below:
## Profiles for the non root package are ignored.
# [profile.release]
# debug = 1

[features]
dhat-heap = []
dhat-ad-hoc = []

[dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
measure_time = "0.9"

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "divan"
# When set to false, you are responsible for defining a main() function to run tests and benchmarks.
harness = false

[[example]]
name = "benchmarking"
path = "examples/benchmarking/main.rs"
test = true
