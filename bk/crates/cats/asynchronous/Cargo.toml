[package]
name = "asynchronous"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Book code examples for Asynchronous programming with Tokio, Smol, and Rayon."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["async", "tokio", "smol", "futures", "concurrency"]
categories = ["asynchronous"]
publish.workspace = true
autolib = false

[dependencies]

## General
anyhow = "1.0.100"
async-channel = "2.5.0"
# LATER async-stream = "0.3.6"
async-trait = "0.1.89"
futures = "0.3.31"
futures-executor = "0.3.31"
futures-util = "0.3.31"
kanal = "0.1.1"                                                        # NOTE: pre version
mio = "1.0.2"
postage = "0.5.0"
rand = { version = "0.10.1", features = ["thread_rng"] }
rayon = "1.11.0"
reqwest = "0.12.24"
smol = "2.0.2"
time = "0.3.45"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "fs"] }
tokio-graceful-shutdown = "0.19.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
