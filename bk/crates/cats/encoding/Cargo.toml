[package]
license-file.workspace = true
name = "encoding"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - encoding"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["encoding"]
publish.workspace = true
build = "build.rs"
autolib = false

[package.metadata.cargo-machete]
ignored = ["capnpc", "prost", "prost-types", "prost-build"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde"] } # TODO update to 3.0.0
bytemuck = { version = "1.25.0", features = ["derive"] }
byteorder = "1.5.0"
capnp = "0.25.4"
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
data-encoding = "2.11.0"
flatbuffers = "25.12.19"
heapless = "0.9.3" # pinned to 0.7.17 for postcard
monostate = "1.0.2"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.3"
prost-types = "0.14.3"
rkyv = "0.8.16"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.149"
toml = "1.1.2"
url = "2.5.8"
zerocopy = { version = "0.8.48", features = ["derive"] }

[build-dependencies]
capnpc = "0.25.3"
prost-build = "0.14.3"
protoc-bin-vendored = "3"

[[example]]
name = "binary_encoders"
path = "examples/binary_encoders/main.rs"
test = true

[[example]]
name = "csv"
path = "examples/csv/main.rs"
test = true

[[example]]
name = "endian_byte"
path = "examples/endian_byte.rs"
test = true

[[example]]
name = "no_external_schema_file"
path = "examples/no_external_schema_file/main.rs"
test = true

[[example]]
name = "serde"
path = "examples/serde/main.rs"
test = true

[[example]]
name = "string_encoding"
path = "examples/string_encoding/main.rs"
test = true

[[example]]
name = "toml_encoding"
path = "examples/toml_encoding/main.rs"
test = true

[[example]]
name = "typecasts"
path = "examples/typecasts/main.rs"
test = true
