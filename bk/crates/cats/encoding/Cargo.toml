[package]
name = "encoding"
version.workspace = true
description = "Book code examples and their crate dependencies - encoding"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["encoding"]
autolib = false
build = "build.rs"

[package.metadata.cargo-machete]
ignored = ["capnpc", "prost", "prost-types", "prost-build"]

[[example]]
name = "binary_encoders"
path = "examples/binary_encoders/main.rs"
test = true

[[example]]
name = "csv"
path = "examples/csv/main.rs"
test = true

[[example]]
name = "endian_byte"
path = "examples/endian_byte.rs"
test = true

[[example]]
name = "excel"
path = "examples/excel/main.rs"
test = true

[[example]]
name = "no_external_schema_file"
path = "examples/no_external_schema_file/main.rs"
test = true

[[example]]
name = "serde"
path = "examples/serde/main.rs"
test = true

[[example]]
name = "string_encoding"
path = "examples/string_encoding/main.rs"
test = true

[[example]]
name = "toml_encoding"
path = "examples/toml_encoding/main.rs"
test = true

[[example]]
name = "typecasts"
path = "examples/typecasts/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bincode = { version = "=2", features = [
    "serde",
] } # Keep 2.x: 3.0.0 is a tombstone release without the `serde` feature or an API
bytemuck = { version = "1.25.2", features = ["derive"] }
byteorder = "1.5.0"
calamine = "0.37.0"
capnp = "0.27.3"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
data-encoding = "2.11.1"
flatbuffers = "25.12.19"
heapless = "0.9.3"
hex = "0.4.3" # Hexadecimal encoding and decoding.
monostate = "1.0.3"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.4"
prost-types = "0.14.4"
rkyv = "0.8.18"
rmp-serde = "1.3.1"
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1" # `application/x-www-form-urlencoded` (de)serialization.
toml = "1.1.8"
url = "2.5.8"
urlencoding = "2.1.3" # Percent-encode and decode a string.
zerocopy = { version = "0.8.63", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
capnpc = "0.27.0"
prost-build = "0.14.4"
protox = "0.10.0" # Compile .proto files without launching a protoc executable.

[lints]
workspace = true
