[package]
name = "encoding"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - encoding"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["encoding"]
publish.workspace = true
build = "build.rs"
autolib = false

[package.metadata.cargo-machete]
ignored = ["capnpc", "prost", "prost-types", "prost-build"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bincode = "2.0.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
byteorder = "1.5.0"
capnp = "0.24.0"
ciborium = "0.2.2"
csv = "1.4.0"
data-encoding = "2.9.0"
flatbuffers = "25.1.21"
heapless = "0.7.17" # pinned to 0.7.17 for postcard
monostate = "1.0.2"
percent-encoding = "2.3.2"
postcard = "1.1.3"
prost = "0.14.1"
prost-types = "0.14.1"
rkyv = "0.8.12"
rmp-serde = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.145"
toml = "0.9.8"
url = "2.5.7"
zerocopy = { version = "0.8.27", features = ["derive"] }

[build-dependencies]
capnpc = "0.21.4"
prost-build = "0.14.1"
