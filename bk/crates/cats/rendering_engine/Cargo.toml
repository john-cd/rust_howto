# TODO Reviewed ??-??-2026.

[package]
name = "rendering"
version.workspace = true
description = "Book code examples and their crate dependencies - rendering"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["rendering::engine"]
autolib = false

[[example]]
name = "engine_scene"
path = "examples/engine_scene.rs"
required-features = ["engine-scene"]
test = true

[[example]]
name = "offscreen_render"
path = "examples/offscreen_render.rs"
required-features = ["wgpu"]
test = true

[dependencies]
clap = "4.6.7"
pollster = { version = "1.0.1", optional = true }
three-d = { version = "=0.19.0", optional = true }
three-d-asset = { version = "=0.10.0", optional = true, features = ["obj"] }
wgpu = { version = "30.0.1", optional = true }

[dev-dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104" # Provides a fallible entry point for the example runner.
# Parses and validates the offscreen example shader without a GPU.
naga = { version = "30.0.1", features = ["wgsl-in"] }

[features]
engine-scene = ["dep:three-d", "dep:three-d-asset"]
wgpu = ["dep:pollster", "dep:wgpu"]

[lints]
workspace = true
