[package]
name = "multimedia_images"
version.workspace = true
description = "Book code examples and their crate dependencies - multimedia_images"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["multimedia::images"]
autolib = false

[[example]]
name = "images"
path = "examples/images/main.rs"
test = true

[[example]]
name = "color_handling"
path = "examples/color_handling/main.rs"
test = true

[[example]]
name = "pixel_buffers"
path = "examples/pixel_buffers/main.rs"
test = true

[[example]]
name = "avif_round_trip"
path = "examples/avif_round_trip.rs"
test = true

[dependencies]
avif-decode = { version = "3.0.0", default-features = false }
imgref = "1.12.3"
ravif = { version = "0.13.0", default-features = false }
rgb = "0.8.53"
clap = "4.6.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6.2"
oxipng = { version = "10.2.1", default-features = false }
palette = "0.7.7"

[dev-dependencies]
# Isolate generated image files during tests.
tempfile = "3.27.0"

[lints]
workspace = true
