[package]
name = "development_tools_testing"
version.workspace = true
description = "Examples of advanced testing techniques including property-based testing, mocking, and fuzzing."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["testing", "proptest", "mockall", "insta", "fuzzing", "bolero"]
categories = ["development-tools::testing"]
autolib = false

## General

[[bin]]
name = "cli-demo"
path = "examples/cli_testing/cli_demo.rs"
test = false

[[example]]
name = "env_vars"
path = "examples/test_techniques/env_vars.rs"
test = true

[[example]]
name = "float_asserts"
path = "examples/test_techniques/float_asserts.rs"
test = true

[[example]]
name = "snapshot_redactions"
path = "examples/test_techniques/snapshot_redactions.rs"
test = true

[[example]]
name = "http_mock"
path = "examples/test_techniques/http_mock.rs"
test = true

[[example]]
name = "paused_time"
path = "examples/test_techniques/paused_time.rs"
test = true

[[example]]
name = "proptest_strategy"
path = "examples/test_techniques/proptest_strategy.rs"
test = true

[[example]]
name = "rstest_cases"
path = "examples/test_techniques/rstest_cases.rs"
test = true

[[example]]
name = "assertions"
path = "examples/assertions/main.rs"
test = true

[[example]]
name = "cli_testing"
path = "examples/cli_testing/main.rs"
test = true

[[example]]
name = "code_coverage"
path = "examples/code_coverage/main.rs"
test = true

[[example]]
name = "fuzzing"
path = "examples/fuzzing/main.rs"
required-features = ["afl-fuzzing"]
test = true

[[example]]
name = "mocking"
path = "examples/mocking/main.rs"
test = true

[[example]]
name = "property_based_testing"
path = "examples/property_based_testing/main.rs"
test = true

[[example]]
name = "test_runners"
path = "examples/test_runners/main.rs"
test = true

[[example]]
name = "testing"
path = "examples/testing/main.rs"
test = true

[dependencies]
afl = { version = "0.18.2", optional = true }
anyhow = "1.0.104"
approx = "0.5.1" # was pinned at 0.4.0
arbitrary = { version = "1.5.0", features = ["derive"] }
assert_cmd = "2.2.2" # Test command-line programs.
bolero = "=0.13.4" # Pinned: bolero-generator-derive 0.13.5+ requires indexmap =2.11.2, conflicting with indexmap 2.14 in data_structures.
clap = { version = "4.6.7", features = ["derive"] }
fake = { version = "5.1.0", features = ["derive"] }
faux = "0.1.13"
float-cmp = "0.10.0"
httpmock = "0.9.0" # Mock an HTTP server.
insta = { version = "1.49.0", features = ["json", "redactions"] }
lcov = "0.8.2" # Parse LCOV coverage reports.
mockall = "0.15.0"
# Match command-line output and diagnostics in tests.
predicates = "3.1.4"

proptest = "1.12.0"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "test-util"] }
ureq = "3.5.0"

[features]
afl-fuzzing = ["dep:afl"]

[lints]
workspace = true
