[package]
name = "caching"
version.workspace = true
description = "Book code examples and their crate dependencies - caching"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["caching"]
autolib = false

[[example]]
name = "in_memory_cache"
path = "examples/in_memory_cache/main.rs"
test = true

[dependencies]
# Generic cache implementations and simplified function memoization
cached = "4.1.1"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A LRU cache implementation
lru = "0.19.0"
# A fast and concurrent cache library inspired by Java Caffeine
moka = { version = "0.12.16", features = ["sync"] }

[lints]
workspace = true
