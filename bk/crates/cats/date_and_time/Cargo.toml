[package]
name = "date_and_time"
version.workspace = true
description = "Book code examples and their crate dependencies - date_and_time"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["date-and-time"]
autolib = false

[[example]]
name = "chrono"
path = "examples/chrono/main.rs"
test = true

[[example]]
name = "duration"
path = "examples/duration/main.rs"
test = true

[[example]]
name = "humantime"
path = "examples/humantime.rs"
test = true

[[example]]
name = "time"
path = "examples/time.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Date and time library for Rust
chrono = "0.4.45"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A parser and formatter for std::time::{Duration, SystemTime}
humantime = "2.4.0"
# Date and time library. Fully interoperable with the standard library. Mostly compatible with #![no_std].
time = { version = "0.3.55", features = [
    "formatting",
    "parsing",
    "macros",
] } # Parse, display, construct, and calculate with dates and times.

[lints]
workspace = true
