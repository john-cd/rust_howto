[package]
name = "date_and_time"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - date_and_time"

autolib = false
categories = ["date-and-time"]
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
time = { version = "0.3.55", features = [
  "formatting",
  "parsing",
  "macros",
] } # Parse, display, construct, and calculate with dates and times.

[[example]]
name = "chrono"
path = "examples/chrono/main.rs"
test = true

[[example]]
name = "duration"
path = "examples/duration/main.rs"
test = true

[[example]]
name = "humantime"
path = "examples/humantime.rs"
test = true

[[example]]
name = "time"
path = "examples/time.rs"
test = true

[lints]
workspace = true
