[package]
license-file.workspace = true
name = "date_and_time"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - date_and_time"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["date-and-time"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
humantime = "2.3.0"
time = "0.3.47"

[[example]]
name = "chrono"
path = "examples/chrono/main.rs"
test = true

[[example]]
name = "duration"
path = "examples/duration/main.rs"
test = true

[[example]]
name = "humantime"
path = "examples/humantime.rs"
test = true

[[example]]
name = "time"
path = "examples/time.rs"
test = true
