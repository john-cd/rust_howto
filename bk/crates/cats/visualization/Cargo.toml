# TODO Reviewed ??-??-2026.

[package]
name = "visualization"
version.workspace = true
description = "Book code examples and their crate dependencies - visualization"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["visualization"]
autolib = false
autoexamples = false

[[example]]
name = "terminal_table"
path = "examples/terminal_table.rs"
test = true

[[example]]
name = "visualization"
path = "examples/visualization/main.rs"
test = true

[dev-dependencies]
## General
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
clap = "4.6.7"
# A plotting library powered by Plotly.js
plotly = "0.14.1"
# A Rust drawing library focus on data plotting for both WASM and native applications
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }
# Present exact values as a plain text table.
tabled = { version = "0.22.0", default-features = false, features = ["std"] }

[features]
# Exposes the browser launch instructions in the native example dispatcher.
chartistry = []

[lints]
workspace = true
