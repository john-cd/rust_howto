[package]
name = "parsing"
version.workspace = true
description = "Book code examples and their crate dependencies - parsing"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["parsing"]
autolib = false

[[example]]
name = "calc_parser"
path = "examples/calc/calc_parser.rs"
test = true

[[example]]
name = "parsing"
path = "examples/parsing/main.rs"
test = true

[[example]]
name = "tree_sitter_spans"
path = "examples/parsing/tree_sitter_spans.rs"
test = true

[[example]]
name = "pest"
path = "examples/pest/main.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A byte-oriented, zero-copy, parser combinators library
nom = "8.0.0"
# Parses input using grammars defined with the Parsing Expression Grammar model.
pest = "2.9.6"
# Generates pest parser implementations from grammar files at compile time.
pest_derive = "2.9.6"
# Rust bindings to the Tree-sitter parsing library
tree-sitter = "0.27.2"
# Rust grammar for tree-sitter
tree-sitter-rust = "0.24.2"
# A byte-oriented, zero-copy, parser combinators library
winnow = "1.0.5"

[lints]
workspace = true
