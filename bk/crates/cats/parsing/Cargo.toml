[package]
name = "parsing"
version.workspace = true
description = "Book code examples and their crate dependencies - parsing"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["parsing"]
autolib = false

[package.metadata.cargo-machete]
ignored = ["pest_generator"]

[[example]]
name = "calc_parser"
path = "examples/calc/calc_parser.rs"
test = true

[[example]]
name = "parsing"
path = "examples/parsing/main.rs"
test = true

[[example]]
name = "tree_sitter_spans"
path = "examples/parsing/tree_sitter_spans.rs"
test = true

[[example]]
name = "pest"
path = "examples/pest/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nom = "8.0.0"
pest = "2.9.5"
pest_derive = "2.9.5"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
winnow = "1.0.4"

[build-dependencies]
pest_generator = "2.9.5"

[lints]
workspace = true
