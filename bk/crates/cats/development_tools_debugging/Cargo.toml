[package]
license-file.workspace = true
name = "development_tools_debugging"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Examples of logging, tracing, and observability patterns using tracing, log4rs, and OpenTelemetry."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["debugging", "tracing", "logging", "opentelemetry", "observability"]
categories = ["development-tools::debugging"]
publish.workspace = true
autolib = false

[features]
default = []
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-stdout",
    "dep:tracing-opentelemetry",
]

[dependencies]

## General
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] } # Serve a `/metrics` route.
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
log4rs = "1.4.0"
metrics = "0.24.6" # Instrumentation facade for emitting counters and histograms.
metrics-exporter-prometheus = { version = "0.18.3", default-features = false } # In-memory recorder and Prometheus exposition format.
opentelemetry = { version = "0.32.0", optional = true }
# Builds an OTLP/HTTP exporter for OpenObserve traces.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"], optional = true }
# Exports spans to stdout for a self-contained example.
opentelemetry-stdout = { version = "0.32.0", optional = true }
# Provides tracer providers for the stdout exporter example.
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["rt-tokio", "trace"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
slog = "2.8.2"
slog-async = "2.8.0"
slog-scope = "4.4.1"
slog-term = "2.9.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.32.1", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
syslog = "7.0.0"

[dev-dependencies]
anyhow = "1.0.104"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] } # Exercise routes without opening a socket.
metrics-util = { version = "0.20.4", features = ["debugging"] } # In-memory recorder for metric behavior tests.

[[example]]
name = "metrics"
path = "examples/metrics/main.rs"
test = true

[[example]]
name = "debugging"
path = "examples/debugging/main.rs"
test = true

[[example]]
name = "log"
path = "examples/log/main.rs"
test = true

[[example]]
name = "other"
path = "examples/other/main.rs"
test = true

[[example]]
name = "tracing"
path = "examples/tracing/main.rs"
test = true

[lints]
workspace = true
