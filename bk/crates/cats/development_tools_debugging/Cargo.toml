[package]
name = "development_tools_debugging"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Examples of logging, tracing, and observability patterns using tracing, log4rs, and OpenTelemetry."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["debugging", "tracing", "logging", "opentelemetry", "observability"]
categories = ["development-tools::debugging"]
publish.workspace = true
autolib = false

[features]
default = []
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-jaeger",
    "dep:opentelemetry-stdout",
    "dep:tracing-opentelemetry",
]

[dependencies]

## General
anyhow = "1.0.100"
chrono = "0.4.42"
env_logger = "0.11.8"
log = "0.4.28"
log4rs = "1.4.0"
opentelemetry = { version = "0.30.0", optional = true }
opentelemetry-jaeger = { version = "0.22.0", optional = true }
opentelemetry-stdout = { version = "0.30.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
slog = "2.8.2"
slog-async = "2.8.0"
slog-scope = "4.4.1"
slog-term = "2.9.2"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-opentelemetry = { version = "0.31.0", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "time", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
syslog = "7.0.0"

[dev-dependencies]
anyhow = "1.0.100"
