[package]
name = "database_implementations"
version.workspace = true
description = "Examples for interacting with various database backends like Sled, SurrealDB, and Meilisearch."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["database", "sled", "surrealdb", "meilisearch", "tantivy", "persistence"]
categories = ["database-implementations"]
autolib = false

[[example]]
name = "databases"
path = "examples/databases/main.rs"
test = true

[[example]]
name = "search_engines"
path = "examples/search_engines/main.rs"
test = true

[dependencies]
## General
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Rust wrapper for the Meilisearch API. Meilisearch is a powerful, fast, open-source, easy to use and deploy search engine.
meilisearch-sdk = { version = "0.33.0", optional = true }
# Provides a transactional, embedded key-value database implemented in Rust.
redb = { version = "4.5.0", optional = true }
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
# Lightweight high-performance pure-rust transactional embedded database.
sled = { version = "0.34.7", optional = true }
# Keep the embedded example independent of SurrealDB's network transports.
# A scalable, distributed, collaborative, document-graph database, for the realtime web
surrealdb = { version = "4.0.1", default-features = false, features = ["kv-mem", "parse"], optional = true }
# Indexes documents and runs full-text searches using an embedded search engine.
tantivy = { version = "0.27.0", optional = true }
# A library for managing temporary files and directories.
tempfile = "3.27.0"
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[features]
# default = []
meilisearch = ["dep:meilisearch-sdk"]
redb = ["dep:redb"]
sled = ["dep:sled"]
surrealdb = ["dep:surrealdb"]
tantivy = ["dep:tantivy"]

[lints]
workspace = true
