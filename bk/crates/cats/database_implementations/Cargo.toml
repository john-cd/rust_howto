[package]
license-file.workspace = true
name = "database_implementations"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Examples for interacting with various database backends like Sled, SurrealDB, and Meilisearch."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["database", "sled", "surrealdb", "meilisearch", "tantivy", "persistence"]
categories = ["database-implementations"]
publish.workspace = true
autolib = false

[features]
# default = []
meilisearch = ["dep:meilisearch-sdk"]
sled = ["dep:sled"]
surrealdb = ["dep:surrealdb"]
tantivy = ["dep:tantivy"]

[dependencies]

## General
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
meilisearch-sdk = { version = "0.33.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sled = { version = "0.34.7", optional = true }
# Keep the embedded example independent of SurrealDB's network transports.
surrealdb = { version = "3.3.4", default-features = false, features = ["kv-mem", "parse"], optional = true }
tantivy = { version = "0.27.0", optional = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "databases"
path = "examples/databases/main.rs"
test = true

[[example]]
name = "search_engines"
path = "examples/search_engines/main.rs"
test = true

[lints]
workspace = true
