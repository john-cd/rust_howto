[package]
name = "config"
version.workspace = true
description = "Book code examples and their crate dependencies - config"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["config"]
autolib = false

[[example]]
name = "configuration"
path = "examples/configuration/main.rs"
test = true

[[example]]
name = "env"
path = "examples/env/main.rs"
test = true

[dependencies]
## General
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["cargo", "derive"] }
# Layered configuration system for Rust applications.
config = "0.15.27"
# Loads and saves application configuration files with minimal setup.
confy = "2.0.0"
# dotenv is outdated, replaced by dotenvy
dotenvy = "0.15.7"
# deserialize env vars into typesafe structs
envy = "0.4.2"
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# A library for managing temporary files and directories.
tempfile = "3.27.0"

[lints]
workspace = true
