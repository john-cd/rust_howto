[package]
name = "config"
version.workspace = true
description = "Book code examples and their crate dependencies - config"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["config"]
autolib = false

[[example]]
name = "configuration"
path = "examples/configuration/main.rs"
test = true

[[example]]
name = "env"
path = "examples/env/main.rs"
test = true

[dependencies]
## General
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo", "derive"] }
config = "0.15.27"
confy = "2.0.0"
# dotenv is outdated, replaced by dotenvy
dotenvy = "0.15.7"
envy = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
