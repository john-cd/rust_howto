[package]
name = "web_programming_websocket"
version.workspace = true
description = "Book code examples for Web Programming with WebSockets using Tungstenite."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["websocket", "networking", "tungstenite", "tokio", "async"]
categories = ["web-programming::websocket"]
autolib = false

[[example]]
name = "websocket"
path = "examples/websocket/tokio_tungstenite.rs"
test = true

[[example]]
name = "websocket_blocking"
path = "examples/websocket/tungstenite.rs"
test = true

[[example]]
name = "websocket_async_adapter"
path = "examples/websocket/async_tungstenite.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
async-tungstenite = { version = "0.35.0", features = ["tokio-runtime"] }
# Common utilities and extension traits for the futures-rs library.
futures-util = "0.3.34"
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"

[lints]
workspace = true
