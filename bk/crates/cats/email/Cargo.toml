[package]
license-file.workspace = true
name = "email"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - email"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["email"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.104"
imap = "2.4.1"
lettre = { version = "0.11.23", features = ["tokio1-native-tls"] }
mail-parser = "1.0.0"
mailchecker = "6.0.21"
native-tls = "0.2.18"
# Parse raw email messages and MIME parts for the book example.
mailparse = "0.18.0"

[[example]]
name = "imap"
path = "examples/imap/main.rs"
test = true

[[example]]
name = "lettre"
path = "examples/lettre.rs"
test = true

[[example]]
name = "mailparse"
path = "examples/mailparse.rs"
test = true

[lints]
workspace = true
