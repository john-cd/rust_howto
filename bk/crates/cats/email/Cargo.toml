# TODO Reviewed ??-??-2026.

[package]
name = "email"
version.workspace = true
description = "Book code examples and their crate dependencies - email"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["email"]
autolib = false

[[example]]
name = "imap"
path = "examples/imap/main.rs"
test = true

[[example]]
name = "html2text"
path = "examples/html2text.rs"
test = true

[[example]]
name = "lettre"
path = "examples/lettre.rs"
test = true

[[example]]
name = "mailparse"
path = "examples/mailparse.rs"
test = true

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = [
    "runtime-tokio",
] }
futures = "0.3.34"
html2text = "0.17.4"
lettre = { version = "0.11.23", features = ["tokio1-native-tls"] }
mail-parser = "1.0.0"
mailchecker = "6.0.21"
# Parse raw email messages and MIME parts for the book example.
mailparse = "0.18.0"
native-tls = "0.2.18"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-native-tls = "0.3.1"

[lints]
workspace = true
