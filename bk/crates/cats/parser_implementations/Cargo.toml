[package]
name = "parser_implementations"
version.workspace = true
description = "Book code examples and their crate dependencies - parser_implementations"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["parser-implementations"]
autolib = false

[package.metadata.cargo-machete]
ignored = ["rust-ini"]

[[example]]
name = "html"
path = "examples/html/main.rs"
test = true

[[example]]
name = "ini"
path = "examples/ini/main.rs"
test = true

[[example]]
name = "javascript"
path = "examples/javascript/main.rs"
test = true

[[example]]
name = "json"
path = "examples/json/main.rs"
test = true

[[example]]
name = "markdown"
path = "examples/markdown/main.rs"
test = true

[[example]]
name = "sql_readonly"
path = "examples/programming_languages/sql_readonly.rs"
required-features = ["sqlparser"]
test = true

[[example]]
name = "programming_languages"
path = "examples/programming_languages/main.rs"
test = true

[[example]]
name = "toml"
path = "examples/toml/main.rs"
test = true

[[example]]
name = "xml"
path = "examples/xml/main.rs"
test = true

[[example]]
name = "yaml"
path = "examples/yaml/main.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Date and time library for Rust
chrono = { version = "0.4.45", features = ["serde"] }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A 100% CommonMark-compatible GitHub Flavored Markdown parser and formatter
comrak = "0.59.0"
# INI parser used by the configparser example.
configparser = "3.3.0"
# Rust implementation of CSS Syntax Level 3
cssparser = "0.38.0"
# High-performance browser-grade HTML5 parser
html5ever = "0.40.1"
# A Rust JSON5 serializer and deserializer which speaks Serde.
json5 = "1.3.7"
# CommonMark compliant markdown parser in Rust with ASTs and extensions
markdown = "1.0.0"
# Common code for xml5ever and html5ever
markup5ever = "0.40.0"
# A pull parser for CommonMark
pulldown-cmark = "0.13.6"
# High performance xml reader and writer
quick-xml = { version = "0.42.0", features = ["serialize"] }
# Represent an XML as a read-only tree.
roxmltree = "0.21.2"
# An Ini configuration file parsing library in Rust
rust-ini = "0.21.3"
# HTML tree traversal and CSS selectors for the scraper example.
scraper = "0.29.0"
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
# YAML (de)serializer for Serde, emphasizing panic-free parsing, fast builds and good error reporting. Supports properties, include, tag and...
serde-saphyr = "2.1.1"
# A JSON serialization file format
serde_json = "1.0.154"
# High performance JSON parser based on a port of simdjson
simd-json = "0.19.0"
# Extensible SQL Lexer and Parser with support for ANSI SQL:2011
sqlparser = { version = "0.64.0", features = ["visitor"], optional = true }
# Common utilities for the swc project.
swc_common = "27.0.0"
# Defines Rust data structures for ECMAScript abstract syntax trees.
swc_ecma_ast = "30.0.2"
# Parses ECMAScript and JavaScript source into SWC syntax trees.
swc_ecma_parser = "47.0.1"
# Parser for Rust source code
syn = { version = "3.0.10", features = ["full"] }
# Fast HTML parser written in pure Rust
tl = "0.7.8"
# A native Rust encoder and decoder of TOML-formatted files and streams. Provides implementations of the standard Serialize/Deserialize traits for...
toml = "1.2.1"
# Yet another format-preserving TOML parser.
toml_edit = "0.25.19"
# An XML library in pure Rust
xml = "1.4.0"
# Push based streaming parser for XML.
xml5ever = "0.40.0"
# Pull-based, zero-allocation XML parser.
xmlparser = "0.13.6"

[features]
sqlparser = ["dep:sqlparser"]

[lints]
workspace = true
