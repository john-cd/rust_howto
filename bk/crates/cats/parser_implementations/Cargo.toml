# TODO Reviewed ??-??-2026.

[package]
name = "parser_implementations"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - parser_implementations"

autolib = false
categories = ["parser-implementations"]
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["rust-ini"]

[features]
sqlparser = ["dep:sqlparser"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
comrak = "0.52.0"
# INI parser used by the configparser example.
configparser = "3.3.0"
cssparser = "0.38.0"
html5ever = "0.40.1"
json5 = "1.3.4"
markdown = "1.0.0"
markup5ever = "0.40.0"
pulldown-cmark = "0.13.5"
quick-xml = { version = "0.42.0", features = ["serialize"] }
roxmltree = "0.21.2"
rust-ini = "0.21.3"
# HTML tree traversal and CSS selectors for the scraper example.
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
simd-json = "0.17.3"
sqlparser = { version = "0.61.0", features = ["visitor"], optional = true }
swc_common = "21.0.2"
swc_ecma_ast = "23.0.1"
swc_ecma_parser = "39.1.1"
syn = { version = "3.0.9", features = ["full"] }
tl = "0.7.8"
toml = "1.1.8"
toml_edit = "0.25.17"
xml = "1.4.0"
xml5ever = "0.40.0"
xmlparser = "0.13.6"

[[example]]
name = "html"
path = "examples/html/main.rs"
test = true

[[example]]
name = "ini"
path = "examples/ini/main.rs"
test = true

[[example]]
name = "javascript"
path = "examples/javascript/main.rs"
test = true

[[example]]
name = "json"
path = "examples/json/main.rs"
test = true

[[example]]
name = "markdown"
path = "examples/markdown/main.rs"
test = true

[[example]]
name = "sql_readonly"
path = "examples/programming_languages/sql_readonly.rs"
required-features = ["sqlparser"]
test = true

[[example]]
name = "programming_languages"
path = "examples/programming_languages/main.rs"
test = true

[[example]]
name = "toml"
path = "examples/toml/main.rs"
test = true

[[example]]
name = "xml"
path = "examples/xml/main.rs"
test = true

[[example]]
name = "yaml"
path = "examples/yaml/main.rs"
test = true

[lints]
workspace = true
