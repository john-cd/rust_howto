[package]
name = "memory_management"
version.workspace = true
description = "Examples of advanced memory management, allocators, and data structures like Slab and Bumpalo."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["memory", "allocators", "bumpalo", "mimalloc", "slab", "optimization"]
categories = ["memory-management"]
autolib = false

[[example]]
name = "bumpalo"
path = "examples/bumpalo.rs"
test = true

[[example]]
name = "bumpalo_tree"
path = "examples/bumpalo_tree.rs"
test = true

[[example]]
name = "global_allocator"
path = "examples/global_allocator.rs"
test = true

[[example]]
name = "interning"
path = "examples/interning.rs"
test = true

[[example]]
name = "interner_allocations"
path = "examples/interner_allocations.rs"
test = false

[[example]]
name = "jemalloc"
path = "examples/jemalloc.rs"
test = true

[[example]]
name = "lazy_initialization"
path = "examples/lazy_initialization/main.rs"
test = true

[[example]]
name = "mimalloc"
path = "examples/mimalloc.rs"
test = true

[[example]]
name = "seize"
path = "examples/seize.rs"
test = true

[[example]]
name = "slab"
path = "examples/slab.rs"
test = true

[dependencies]
anyhow = "1.0.104"
bumpalo = { version = "3.20.3", features = ["boxed"] }
clap = { version = "4.6.7", features = ["derive"] }
lazy_static = "1.5.1"
mimalloc = "0.1.52"
once_cell = "1.21.4"
seize = "0.5.1"
slab = "0.4.12"
ustr = "1.1.0"

[features]
# Select the global allocator in the `global_allocator` example (at most one).
use-mimalloc = []
use-jemalloc = []

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats", "use_std"] }
tikv-jemallocator = "0.7.0"

[lints]
workspace = true
