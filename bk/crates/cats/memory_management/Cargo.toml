[package]
name = "memory_management"
version.workspace = true
description = "Examples of advanced memory management, allocators, and data structures like Slab and Bumpalo."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["memory", "allocators", "bumpalo", "mimalloc", "slab", "optimization"]
categories = ["memory-management"]
autolib = false

[[bench]]
name = "arena"
harness = false

[[example]]
name = "bumpalo"
path = "examples/bumpalo.rs"
test = true

[[example]]
name = "bumpalo_tree"
path = "examples/bumpalo_tree.rs"
test = true

[[example]]
name = "interning"
path = "examples/interning.rs"
test = true

[[example]]
name = "interner_allocations"
path = "examples/interner_allocations.rs"
test = true

[[example]]
name = "jemalloc"
path = "examples/jemalloc.rs"
test = true

[[example]]
name = "lazy_initialization"
path = "examples/lazy_initialization/main.rs"
test = true

[[example]]
name = "mimalloc"
path = "examples/mimalloc.rs"
test = true

[[example]]
name = "seize"
path = "examples/seize.rs"
test = true

[[example]]
name = "slab"
path = "examples/slab.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A fast bump allocation arena for Rust.
bumpalo = { version = "3.20.3", features = ["boxed"] }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A macro for declaring lazily evaluated statics in Rust.
lazy_static = "1.5.1"
# Performance and security oriented drop-in allocator
mimalloc = "0.1.52"
# Single assignment cells and lazy values.
once_cell = "1.21.4"
# Fast, efficient, and robust memory reclamation for concurrent data structures.
seize = "0.5.1"
# Pre-allocated storage for a uniform data type
slab = "0.4.12"
# Fast, FFI-friendly string interning.
ustr = "1.1.0"

[dev-dependencies]
# Measures Rust benchmark performance with statistical analysis and comparison reports.
criterion = "0.8.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
# A safe wrapper over jemalloc's control and introspection APIs
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats", "use_std"] }
# A Rust allocator backed by jemalloc
tikv-jemallocator = "0.7.0"

[lints]
workspace = true
