[package]
name = "memory_management"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Examples of advanced memory management, allocators, and data structures like Slab and Bumpalo."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["memory", "allocators", "bumpalo", "mimalloc", "slab", "optimization"]
categories = ["memory-management"]
publish.workspace = true
autolib = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.100"
bumpalo = "3.17.0"
lazy_static = "1.5.0"
mimalloc = "0.1.48"
once_cell = "1.21.3"
seize = "0.5.1"
slab = "0.4.9"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.6.1", features = ["stats", "use_std"] }
tikv-jemallocator = "0.6.1"
