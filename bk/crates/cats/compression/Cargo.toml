[package]
license-file.workspace = true
name = "compression"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples - compression"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["compression"]
publish.workspace = true
autolib = false

[dependencies]

# General
anyhow = "1.0.104"
async-compression = { version = "0.4.51", features = ["tokio", "gzip"] }

# async_zip
async_zip = { version = "0.0.18", features = ["full"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
futures-lite = "2.6.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
zip = "9.0.5"

[[example]]
name = "async_zip"
path = "examples/async_zip/main.rs"
test = true

[[example]]
name = "compression"
path = "examples/compression/main.rs"
test = true

[[example]]
name = "tar"
path = "examples/tar/main.rs"
test = true
