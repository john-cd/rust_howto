# TODO Reviewed ??-??-2026

[package]
name = "compression"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples - compression"

autolib = false
categories = ["compression"]
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
publish.workspace = true

[dependencies]
# General
anyhow = "1.0.104"
async-compression = { version = "0.4.51", features = ["tokio", "gzip"] }

# Tokio adapter for async ZIP I/O; the example writes stored entries without a codec.
async_zip = { version = "0.0.19", features = ["tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-lite = "2.6.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
zip = "9.1.2"

[dev-dependencies]
# Creates automatically cleaned temporary directories and files for the examples.
tempfile = "3.27.0"
[[example]]
name = "compression"
path = "examples/compression/main.rs"
test = true

[[example]]
name = "tar"
path = "examples/tar/main.rs"
test = true

[lints]
workspace = true
