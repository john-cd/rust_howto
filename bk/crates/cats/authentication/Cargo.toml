# Reviewed 10-27-2026

[package]
name = "authentication"
version.workspace = true
description = "Book code examples and their crate dependencies - authentication"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["authentication"]
autolib = false

[[example]]
name = "basic_authentication"
path = "examples/basic_authentication/main.rs"
test = true

[[example]]
name = "session_login"
path = "examples/session_login/main.rs"
test = true

[[example]]
name = "jwt_authentication"
path = "examples/jwt_authentication/main.rs"
test = true

[[example]]
name = "oauth_client_credentials"
path = "examples/oauth_client_credentials/main.rs"
test = true

[dependencies]
## General
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["form"] }
axum-login = "0.18.0"
getrandom = "0.4.3" # Generate random CSRF tokens.
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", features = [
    "rust_crypto",
] } # Sign and validate HS256 JSON Web Tokens with RustCrypto.
oauth2 = "5.0.0"
password-auth = "1.0.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] } # Run the asynchronous Axum tests.
tower = { version = "0.5.3", features = ["util"] } # Exercise routes without opening a socket.
# Pinned: axum-login needs the tower-sessions 0.14 SessionManagerLayer.
tower-sessions = { version = "0.15.0", features = ["memory-store"] }

[dev-dependencies]
httpmock = "0.9.0"

[lints]
workspace = true
