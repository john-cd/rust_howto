[package]
name = "os_unix_apis"
version.workspace = true
description = "Book code examples and their crate dependencies - os_unix_apis"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["os::unix-apis"]
autolib = false

[[example]]
name = "unix"
path = "examples/unix/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_family = "unix")'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }
rustix = { version = "1.1.6", features = ["fs"] }

[lints]
workspace = true
