[package]
license-file.workspace = true
name = "command_line_interface"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - command_line_interface"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["command-line-interface"]
publish.workspace = true
autolib = false

[dependencies]
nu-ansi-term = "0.50.3"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
console = "0.16.6"
crossterm = "0.29.0"
indicatif = "0.18.6"
inquire = "0.9.4"
lexopt = "0.3.2"
pico-args = "0.5.0"
ratatui = "0.30.2" # requires crossterm

[[example]]
name = "ansi_term"
path = "examples/ansi_term/main.rs"
test = true

[[example]]
name = "arguments"
path = "examples/arguments/main.rs"
test = true

[[example]]
name = "crossterm"
path = "examples/crossterm.rs"
test = true

[[example]]
name = "ratatui"
path = "examples/ratatui.rs"
test = true

[[example]]
name = "user_interaction"
path = "examples/user_interaction/main.rs"
test = true

[lints]
workspace = true
