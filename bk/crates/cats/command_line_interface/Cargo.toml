[package]
name = "command_line_interface"
version.workspace = true
description = "Book code examples and their crate dependencies - command_line_interface"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["command-line-interface"]
autolib = false

[[example]]
name = "ansi_term"
path = "examples/ansi_term/main.rs"
test = true

[[example]]
name = "arguments"
path = "examples/arguments/main.rs"
test = true

[[example]]
name = "crossterm"
path = "examples/crossterm.rs"
test = true

[[example]]
name = "ratatui"
path = "examples/ratatui.rs"
test = true

[[example]]
name = "user_interaction"
path = "examples/user_interaction/main.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Generate shell completion scripts for your clap::Command
clap_complete = "4.6.11"
# The most simple way to add colors in your terminal
colored = "3.1.1"
# An easy to use library for building beautiful tables with automatic content wrapping
comfy-table = "8.0.1" # Terminal tables that adapt to their content and width.
# A terminal and console abstraction for Rust
console = "0.16.6"
# A crossplatform terminal library for manipulating terminals.
crossterm = "0.29.0"
# A progress bar and cli reporting library for Rust
indicatif = "0.18.6"
# inquire is a library for building interactive prompts on terminals
inquire = "0.9.4"
# Minimalist pedantic command line parser
lexopt = "0.3.2"
# Library for ANSI terminal colors and styles (bold, underline)
nu-ansi-term = "0.50.3"
# An ultra simple CLI arguments parser.
pico-args = "0.5.0"
# A library that's all about cooking up terminal user interfaces
ratatui = "0.30.2" # requires crossterm

[lints]
workspace = true
