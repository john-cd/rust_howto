[package]
name = "command_line_interface"
version.workspace = true
description = "Book code examples and their crate dependencies - command_line_interface"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["command-line-interface"]
autolib = false

[[example]]
name = "ansi_term"
path = "examples/ansi_term/main.rs"
test = true

[[example]]
name = "arguments"
path = "examples/arguments/main.rs"
test = true

[[example]]
name = "crossterm"
path = "examples/crossterm.rs"
test = true

[[example]]
name = "ratatui"
path = "examples/ratatui.rs"
test = true

[[example]]
name = "user_interaction"
path = "examples/user_interaction/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
comfy-table = "8.0.1" # Terminal tables that adapt to their content and width.
console = "0.16.6"
crossterm = "0.29.0"
indicatif = "0.18.6"
inquire = "0.9.4"
lexopt = "0.3.2"
nu-ansi-term = "0.50.3"
pico-args = "0.5.0"
ratatui = "0.30.2" # requires crossterm

[lints]
workspace = true
