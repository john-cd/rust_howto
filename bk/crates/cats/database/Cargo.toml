[package]
name = "database"
version.workspace = true
description = "Book code examples for Database interactions with SQLx, Diesel, MongoDB, and Redis."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["database", "sqlx", "diesel", "postgres", "sqlite", "mongodb", "redis"]
categories = ["database"]
autolib = false

[[example]]
name = "amqp"
path = "examples/amqp/main.rs"
test = true

[[example]]
name = "nats"
path = "examples/nats/main.rs"
test = true

[[example]]
name = "cassandra"
path = "examples/cassandra/main.rs"
test = true
required-features = ["cassandra"]

[[example]]
name = "connection_pool"
path = "examples/connection_pool/main.rs"
test = true

[[example]]
name = "kv"
path = "examples/kv/main.rs"
test = true

[[example]]
name = "mssql"
path = "examples/mssql/main.rs"
test = true

[[example]]
name = "mysql"
path = "examples/mysql/main.rs"
test = true

[[example]]
name = "nosql"
path = "examples/nosql/main.rs"
test = true

[[example]]
name = "oracle"
path = "examples/oracle/main.rs"
test = true

[[example]]
name = "postgres"
path = "examples/postgres/main.rs"
test = true

[[example]]
name = "query_builders_orms"
path = "examples/query_builders_orms/main.rs"
test = true

[[example]]
name = "search"
path = "examples/search/main.rs"
test = true

[[example]]
name = "sqlite"
path = "examples/sqlite/main.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A async Rust NATS client
async-nats = { version = "0.52.0", optional = true }
# Library for reading/writing numbers in big-endian and little-endian.
byteorder = "1.5.0"
# Encodes and decodes the native Cassandra database wire protocol.
cassandra-protocol = { version = "5.0.0", optional = true }
# Async Cassandra DB driver written in Rust
cdrs-tokio = { version = "10.0.0", features = ["derive"], optional = true }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Layered configuration system for Rust applications.
config = "0.15.27"
# Generated database query bindings produced by Cornucopia.
cornucopia_queries = { package = "database-cornucopia-queries", path = "cornucopia_queries", optional = true } # Generated by the `cornucopia` 1.0 CLI.
# Dead simple async pool
deadpool = "0.13.1"
# Dead simple async pool for tokio-postgres
deadpool-postgres = { version = "0.14.2", features = [
    "serde",
], optional = true }
# A safe, extensible ORM and Query Builder for PostgreSQL, SQLite, and MySQL
diesel = { version = "2.3.14", optional = true }
# A oci database adapter for diesel
diesel-oci = { version = "0.5.1", optional = true }
# Migration management for diesel
diesel_migrations = { version = "2.3.2", features = [
    "sqlite",
], optional = true }
# A well-maintained fork of the dotenv crate
dotenvy = "0.15.7"
# Official Elasticsearch Rust client
elasticsearch = { version = "9.1.0-alpha.1", optional = true } # NOTE: alpha version
# An implementation of futures and streams featuring zero allocations, composability, and iterator-like interfaces.
futures = "0.3.34"
# A fully typed LMDB (mdb.master) wrapper with minimum overhead
heed = { version = "0.23.1", optional = true }
# Provides an asynchronous AMQP client for RabbitMQ and compatible brokers.
lapin = { version = "4.12.3", optional = true }
# Native bindings to the libsqlite3 library
libsqlite3-sys = { version = "0.37.0", features = ["bundled"], optional = true }
# The official MongoDB driver for Rust
mongodb = { version = "3.10.0", optional = true }
# Tokio based asynchronous MySql client library.
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls"], optional = true } # Asynchronous MySQL and MariaDB driver.
# Single assignment cells and lazy values.
once_cell = "1.21.4"
# Connects Rust applications to Oracle databases using the OCI client interface.
oracle = { version = "0.6.3", optional = true }
# A native, synchronous PostgreSQL client
postgres = { version = "0.19.14", optional = true }
# Conversions between Rust and Postgres values
postgres-types = { version = "0.2.14", optional = true }
# Redis driver for Rust.
redis = { version = "1.8.1", optional = true }
# Rust wrapper for Facebook's RocksDB embeddable database
rocksdb = { version = "0.25.0", optional = true, default-features = false, features = [
    "bindgen-runtime",
] }
# Pin to the newest rusqlite line compatible with sqlx-sqlite 0.9 and Diesel's SQLite bindings.
rusqlite = { version = "0.39.0", optional = true }
# 🐚 An async & dynamic ORM for Rust
sea-orm = { version = "2.0.4", optional = true }
# 🧭 A GraphQL framework for SeaORM
seaography = { version = "=2.0.0-rc.9", optional = true }
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
# A JSON serialization file format
serde_json = { version = "1.0.154", optional = true }
# An OCI-based (synchronous or asynchronous) interface between Rust applications and Oracle databases
sibyl = { version = "0.7.1", features = ["blocking"], optional = true }
# 🧰 The Rust SQL Toolkit. An async, pure Rust SQL crate featuring compile-time checked queries without a DSL. Supports PostgreSQL, MySQL, and SQLite.
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
], optional = true }
# A library for managing temporary files and directories.
tempfile = { version = "3.27.0", optional = true }
# A TDS (MSSQL) driver
tiberius = { version = "0.13.0", default-features = false, features = [
    "native-tls",
    "tds73",
], optional = true }
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
# A native, asynchronous PostgreSQL client
tokio-postgres = { version = "0.7.18", optional = true }
# Additional utilities for working with Tokio.
tokio-util = { version = "0.7.20", features = ["compat"] }
# URL library for Rust, based on the WHATWG URL Standard
url = "2.5.8" # Validate Elasticsearch endpoints and their security policy.
# A library to generate and parse UUIDs.
uuid = { version = "1.29.2", features = ["v4"] }

[features]
# default = []
cassandra = ["dep:cassandra-protocol", "dep:cdrs-tokio"]
diesel = ["dep:diesel", "diesel/sqlite", "dep:diesel_migrations", "dep:libsqlite3-sys"]
elasticsearch = ["dep:elasticsearch", "dep:serde_json"]
lapin = ["dep:lapin"]
nats = ["dep:async-nats", "dep:serde_json", "tokio/signal"]
lmdb = ["dep:heed", "dep:tempfile"]
mongodb = ["dep:mongodb"]
mssql = ["dep:tiberius"]
mysql = ["dep:mysql_async"]
oracle = ["dep:diesel", "dep:diesel-oci", "dep:oracle"]
"sibyl" = ["dep:sibyl"]
postgres = [
    "dep:deadpool-postgres",
    "dep:postgres",
    "dep:tokio-postgres",
    "dep:cornucopia_queries",
    "dep:postgres-types",
]
redis = ["dep:redis"]
rocksdb = ["dep:rocksdb", "dep:tempfile"]
sea_orm = [
    "dep:sea-orm",
    "dep:seaography",
    "dep:serde_json",
    "sea-orm/sqlx-sqlite",
    "sea-orm/runtime-tokio-rustls",
]
sqlx = ["dep:sqlx"]
sqlite = ["dep:rusqlite"]

[lints]
workspace = true
