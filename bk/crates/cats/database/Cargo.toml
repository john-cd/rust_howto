[package]
name = "database"
version.workspace = true
description = "Book code examples for Database interactions with SQLx, Diesel, MongoDB, and Redis."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["database", "sqlx", "diesel", "postgres", "sqlite", "mongodb", "redis"]
categories = ["database"]
autolib = false

[[example]]
name = "amqp"
path = "examples/amqp/main.rs"
test = true

[[example]]
name = "cassandra"
path = "examples/cassandra/main.rs"
test = true
required-features = ["cassandra"]

[[example]]
name = "connection_pool"
path = "examples/connection_pool/main.rs"
test = true

[[example]]
name = "kv"
path = "examples/kv/main.rs"
test = true

[[example]]
name = "mssql"
path = "examples/mssql/main.rs"
test = true

[[example]]
name = "nosql"
path = "examples/nosql/main.rs"
test = true

[[example]]
name = "oracle"
path = "examples/oracle/main.rs"
test = true

[[example]]
name = "postgres"
path = "examples/postgres/main.rs"
test = true

[[example]]
name = "query_builders_orms"
path = "examples/query_builders_orms/main.rs"
test = true

[[example]]
name = "search"
path = "examples/search/main.rs"
test = true

[[example]]
name = "sqlite"
path = "examples/sqlite/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
byteorder = "1.5.0"
cassandra-protocol = { version = "4.0.1", optional = true }
cdrs-tokio = { version = "9.0.2", features = ["derive"], optional = true }
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
cornucopia = { version = "1.0.1", optional = true }
# Runtime for executing the generated asynchronous query functions.
# Pinned: cornucopia_async 0.4 breaks with cornucopia_client_core >0.4.0; keep it in step via the lockfile (cornucopia_client_core = 0.4.0).
cornucopia_async = { version = "0.6.1", optional = true, default-features = false }
deadpool = "0.13.1"
deadpool-postgres = { version = "0.14.2", features = [
    "serde",
], optional = true }
diesel = { version = "2.3.14", features = ["sqlite"], optional = true }
diesel-oci = { version = "0.5.1", optional = true }
diesel_migrations = { version = "2.3.2", features = [
    "sqlite",
], optional = true }
dotenvy = "0.15.7"
elasticsearch = { version = "9.1.0-alpha.1", optional = true } # NOTE: alpha version
futures = "0.3.34"
heed = { version = "0.23.1", optional = true }
lapin = { version = "4.12.3", optional = true }
# Bundle SQLite for the Diesel in-memory example on hosts without SQLite development libraries.
libsqlite3-sys = { version = "0.39.1", features = ["bundled"], optional = true }
mongodb = { version = "3.9.1", optional = true }
once_cell = "1.21.4"
oracle = { version = "0.6.3", optional = true }
postgres = { version = "0.19.14", optional = true }
# Exposes `ToSql` for the generated Cornucopia query bindings.
postgres-types = { version = "0.2.14", optional = true }
redis = { version = "1.8.0", optional = true }
# Use bindgen-runtime so Windows can load libclang.dll from the LLVM installation.
rocksdb = { version = "0.25.0", optional = true, default-features = false, features = [
    "bindgen-runtime",
] }
rusqlite = { version = "=0.32.1", optional = true } # Keep sqlite linkage compatible with sqlx 0.8.x.
sea-orm = { version = "2.0.4", optional = true } # Pinned: sea-orm 2 needs seaography 2 (release candidates only) and sqlx 0.9 / newer libsqlite3-sys.
seaography = { version = "1.1.4", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
# Provides the Oracle Instant Client-backed example on Linux and Windows.
sibyl = { version = "0.7.1", features = ["blocking"], optional = true }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
], optional = true }
tempfile = { version = "3.27.0", optional = true }
tiberius = { version = "0.13.0", default-features = false, features = [
    "native-tls",
    "tds73",
], optional = true }
# Bound the connection attempt in the Cassandra client example.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7.18", optional = true }
tokio-util = { version = "0.7.20", features = ["compat"] }
url = "2.5.8" # Validate Elasticsearch endpoints and their security policy.
uuid = { version = "1.29.0", features = ["v4"] }

[features]
# default = []
cassandra = ["dep:cassandra-protocol", "dep:cdrs-tokio"]
diesel = ["dep:diesel", "dep:diesel_migrations", "dep:libsqlite3-sys"]
elasticsearch = ["dep:elasticsearch", "dep:serde_json"]
lapin = ["dep:lapin"]
lmdb = ["dep:heed", "dep:tempfile"]
mongodb = ["dep:mongodb"]
mssql = ["dep:tiberius"]
oracle = ["dep:diesel", "dep:diesel-oci", "dep:oracle"]
"sibyl" = ["dep:sibyl"]
postgres = [
    "dep:deadpool-postgres",
    "dep:postgres",
    "dep:tokio-postgres",
    "dep:cornucopia",
    "dep:cornucopia_async",
    "dep:postgres-types",
]
redis = ["dep:redis"]
rocksdb = ["dep:rocksdb", "dep:tempfile"]
sea_orm = [
    "dep:sea-orm",
    "dep:seaography",
    "dep:serde_json",
    "sea-orm/sqlx-sqlite",
    "sea-orm/runtime-tokio-rustls",
]
sqlx = ["dep:sqlx"]
sqlite = ["dep:rusqlite"]

[lints]
workspace = true
