[profile.dev.package]
hashbrown = {opt-level = 3}
indexmap = {opt-level = 3}
memchr = {opt-level = 3}
proc-macro2 = {opt-level = 3}
quote = {opt-level = 3}
rand = {opt-level = 3}
regex = {opt-level = 3}
