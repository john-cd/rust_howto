[package]
name = "toasty-validation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
toasty = { version = "0.11.0", default-features = false, features = ["sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# Toasty's SQLite driver uses a newer libsqlite3-sys than the database examples
# workspace, so validate this example in an independent dependency graph.
[workspace]
resolver = "3"
