[package]
name = "hardware_support"
version.workspace = true
description = "Book code examples and their crate dependencies - hardware_support"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["hardware-support"]
autolib = false

[[example]]
name = "peripherals"
path = "examples/peripherals/main.rs"
test = true

[[example]]
name = "processor"
path = "examples/processor/main.rs"
test = true

[[example]]
name = "simd"
path = "examples/simd/main.rs"
test = true

[dependencies]
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Get the number of CPUs on a machine.
num_cpus = "1.17.0"
# A cross-platform low-level serial port library.
serialport = { version = "4.10.1", default-features = false } # Enumerates serial ports; no libudev needed.
# A crate to help you go wide.
wide = "1.7.1"

[lints]
workspace = true
