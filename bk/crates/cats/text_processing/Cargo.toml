[package]
name = "text_processing"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - text_processing"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["text-processing"]
publish.workspace = true
autolib = false

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.102"
bstr = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
concat-string = "1.0.1"
concat_strs = "1.0.2"
console = "0.16.3"
diff = "0.1.13"
fancy-regex = "0.18.0"
fuzzy-matcher = "0.3.7"
heck = "0.5.0"
hyphenation = "0.8.4"
indoc = "2.0.7"
joinery = "3.1.0"
lazy_static = "1.5.0"
libc = "0.2.186"
memchr = "2.8.0"
once_cell = "1.21.4"
regex = "1.12.3"
similar = "3.1.0"
strsim = "0.11.1"
textwrap = { version = "0.16.2", features = ["hyphenation"] }
unicode-segmentation = "1.13.2"
ustr = "1.1.0"

[[example]]
name = "diffing"
path = "examples/diffing/main.rs"
test = true

[[example]]
name = "other_strings"
path = "examples/other_strings/main.rs"
test = true

[[example]]
name = "regex"
path = "examples/regex/main.rs"
test = true

[[example]]
name = "string_concat"
path = "examples/string_concat/main.rs"
test = true

[[example]]
name = "string_manipulation"
path = "examples/string_manipulation/main.rs"
test = true

[[example]]
name = "string_parsing"
path = "examples/string_parsing/main.rs"
test = true

[[example]]
name = "string_search"
path = "examples/string_search/main.rs"
test = true

[[example]]
name = "unicode"
path = "examples/unicode/main.rs"
test = true
