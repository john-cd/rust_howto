[package]
name = "text_processing"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - text_processing"

autolib = false
categories = ["text-processing"]
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
publish.workspace = true

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
bstr = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
concat-string = "1.0.1"
console = "0.16.6"
# Concatenates constant string slices during compilation.
constcat = "0.6.1"
diff = "0.1.13"
fancy-regex = "0.20.0"
fuzzy-matcher = "0.3.7"
heck = "0.5.0"
hyphenation = "0.8.4"
indoc = "2.0.8"
joinery = "3.1.0"
lazy_static = "1.5.1"
libc = "0.2.191"
memchr = "2.8.3"
nucleo = "0.5.0"
once_cell = "1.21.4"
rake = "0.3.6"
regex = "1.13.1"
similar = "3.2.1"
slug = "0.1.6" # Turn a title into a URL-friendly slug.
strsim = "0.11.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
textwrap = { version = "0.16.4", features = ["hyphenation"] }
tree-sitter = { workspace = true }
tree-sitter-json = { workspace = true }
unicode-segmentation = "1.13.3"
ustr = "1.1.0"

[[example]]
name = "fuzzy_search"
path = "examples/text_analysis/fuzzy_search.rs"
test = true

[[example]]
name = "keyword_extraction"
path = "examples/text_analysis/keyword_extraction.rs"
test = true

[[example]]
name = "syntect_html"
path = "examples/text_analysis/syntect_html.rs"
test = true

[[example]]
name = "tree_sitter_json_spans"
path = "examples/text_analysis/tree_sitter_json_spans.rs"
test = true

[[example]]
name = "word_boundaries"
path = "examples/text_analysis/word_boundaries.rs"
test = true

[[example]]
name = "case_conversion"
path = "examples/string_manipulation/case_conversion.rs"
test = true

[[example]]
name = "diffing"
path = "examples/diffing/main.rs"
test = true

[[example]]
name = "other_strings"
path = "examples/other_strings/main.rs"
test = true

[[example]]
name = "regex"
path = "examples/regex/main.rs"
test = true

[[example]]
name = "string_concat"
path = "examples/string_concat/main.rs"
test = true

[[example]]
name = "string_manipulation"
path = "examples/string_manipulation/main.rs"
test = true

[[example]]
name = "string_parsing"
path = "examples/string_parsing/main.rs"
test = true

[[example]]
name = "aho_corasick_redact"
path = "examples/string_search/aho_corasick_redact.rs"
test = true

[[example]]
name = "string_search"
path = "examples/string_search/main.rs"
test = true

[[example]]
name = "unicode"
path = "examples/unicode/main.rs"
test = true

