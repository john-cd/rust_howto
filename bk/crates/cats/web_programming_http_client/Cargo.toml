[package]
license-file.workspace = true
name = "web_programming_http_client"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - web_programming_http_client"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["web-programming::http-client"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.104"
backon = "1.6.0"
clap = { version = "4.6.7", features = ["derive"] }
# Iterates over reqwest's streamed response chunks when downloading files.
futures-util = "0.3.34"
governor = "0.10.4"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
reqwest = { version = "0.13.5", features = ["blocking", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std"] }
ureq = "3.5.0"
url = "2.5.8"

[dev-dependencies]
mockito = "1.7.2"
# Parses captured JSON request bodies in the REST API example tests.
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "test-util"] }

[[example]]
name = "apis"
path = "examples/apis/main.rs"
test = true

[[example]]
name = "download"
path = "examples/download/main.rs"
test = true

[[example]]
name = "http_clients"
path = "examples/http_clients/main.rs"
test = true

[[example]]
name = "rate_limit"
path = "examples/rate_limit/main.rs"
test = true

[[example]]
name = "requests"
path = "examples/requests/main.rs"
test = true

[[example]]
name = "retry"
path = "examples/retry/main.rs"
test = true

[[example]]
name = "retry_after"
path = "examples/retry_after/main.rs"
test = true

[lints]
workspace = true
