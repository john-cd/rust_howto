[package]
name = "web_programming_http_client"
version.workspace = true
description = "Book code examples and their crate dependencies - web_programming_http_client"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["web-programming::http-client"]
autolib = false

[[example]]
name = "apis"
path = "examples/apis/main.rs"
test = true

[[example]]
name = "download"
path = "examples/download/main.rs"
test = true

[[example]]
name = "http_clients"
path = "examples/http_clients/main.rs"
test = true

[[example]]
name = "offline_http_client"
path = "examples/offline_http_client.rs"
test = true

[[example]]
name = "rate_limit"
path = "examples/rate_limit/main.rs"
test = true

[[example]]
name = "requests"
path = "examples/requests/main.rs"
test = true

[[example]]
name = "retry"
path = "examples/retry/main.rs"
test = true

[[example]]
name = "retry_after"
path = "examples/retry_after/main.rs"
test = true

[[example]]
name = "cache_revalidation"
path = "examples/cache_revalidation.rs"
test = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
backon = "1.6.0"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
governor = "0.10.4"
http = "1.5.0"
http-body-util = "0.1.5"
http-cache-semantics = { version = "3.0.0", default-features = false }
hyper = "1.12.0"
hyper-util = "0.1.21"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std"] }
ureq = "3.5.1"
url = "2.5.8"

[dev-dependencies]
# HTTP mocking for Rust.
mockito = "1.7.2"
# Parses captured JSON request bodies in the REST API example tests.
serde_json = "1.0.154"
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["time", "test-util"] }

[lints]
workspace = true
