[package]
name = "network_programming"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Network programming examples covering Axum servers, ngrok tunneling, and load balancing with Pingora."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["networking", "axum", "ngrok", "pingora", "load-balancer"]
categories = ["network-programming"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["tokio"] }
clap = { version = "4.6.1", features = ["derive"] }
ngrok = { version = "0.18.0", features = ["axum"] }
pingora = { version = "0.8.0", features = ["lb"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
glommio = "0.9.0"

[[example]]
name = "reverse_proxy"
path = "examples/reverse_proxy/main.rs"
test = true

[[example]]
name = "server"
path = "examples/server/main.rs"
test = true
