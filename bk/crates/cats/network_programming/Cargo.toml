[package]
name = "network_programming"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Network programming examples covering Axum servers, ngrok tunneling, and load balancing with Pingora."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["networking", "axum", "ngrok", "pingora", "load-balancer"]
categories = ["network-programming"]
publish.workspace = true
autolib = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["tokio"] }
ngrok = { version = "0.15.0", features = ["axum"] }
pingora = { version = "0.8.0", features = ["lb"] }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"

[target.'cfg(target_os = "linux")'.dependencies]
glommio = "0.9.0"
