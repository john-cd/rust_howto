[package]
license-file.workspace = true
name = "network_programming"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Network programming examples covering Axum servers, ngrok tunneling, and load balancing with Pingora."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["networking", "axum", "ngrok", "pingora", "load-balancer"]
categories = ["network-programming"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
ngrok = { version = "0.19.0", default-features = false, features = ["axum", "ring"] } # Share the ring TLS backend across Windows dependencies.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
url = "2.5.8"

[target.'cfg(target_family = "unix")'.dependencies]
pingora = { version = "0.9.0", features = ["lb"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Supplies async read and write extension traits for Glommio TCP streams.
futures-lite = "2.6.1"
glommio = "0.9.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] } # Exercise Axum routes without binding a network port.

[[example]]
name = "reverse_proxy"
path = "examples/reverse_proxy/main.rs"
test = true

[[example]]
name = "server"
path = "examples/server/main.rs"
test = true

[lints]
workspace = true
