[package]
name = "algorithms"
version.workspace = true
description = "Book code examples and their crate dependencies - algorithms"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["algorithms"]
autolib = false

[[bench]]
name = "hashing"
harness = false

[[example]]
name = "graph_algorithms"
path = "examples/graph/main.rs"
test = true

[[example]]
name = "hashing"
path = "examples/hashing/main.rs"
test = true

[[example]]
name = "rand"
path = "examples/rand/main.rs"
test = true

[[example]]
name = "sort"
path = "examples/sort/main.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Pure Rust implementation of Base16 a.k.a hexadecimal (RFC 4648) which avoids any usages of data-dependent branches/LUTs and thereby provides...
base16ct = { version = "1.0.0", features = ["alloc"] }
# Pure Rust implementation of Base64 (RFC 4648) which avoids any usages of data-dependent branches/LUTs and thereby provides portable "best effort"...
base64ct = { version = "1.8.3", features = ["alloc"] }
# the BLAKE3 hash function
blake3 = "1.8.7"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Efficient and customizable data-encoding functions like base64, base32, and hex
data-encoding = "2.11.1"
# A simple and fast random number generator
fastrand = "2.5.0"
# A fast, non-cryptographic, minimally DoS-resistant hashing algorithm.
foldhash = "0.2.0"
# A macro for converting hexadecimal string literals to a byte array at compile time
hex-literal = "1.1.0"
# Computes MD5 message digests for compatibility and non-security checksums.
md-5 = "0.11.0"
# Pathfinding, flow, and graph algorithms
pathfinding = "4.16.0"
# Graph data structure library. Provides graph types and graph algorithms.
petgraph = "0.8.3"
# Random number generators and other randomness functionality.
rand = "0.10.3"
# Sampling from random number distributions
rand_distr = "0.6.0"
# Provides cryptographic primitives and TLS building blocks for networked applications.
ring = "0.17.14"
# Computes SHA-1 digests for protocol compatibility and data identification.
sha1 = "0.11.0"
# Pure Rust implementation of the SHA-2 hash function family including SHA-224, SHA-256, SHA-384, and SHA-512.
sha2 = "0.11.1"
# A library for managing temporary files and directories.
tempfile = "3.27.0"
# Computes fast non-cryptographic xxHash checksums.
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
# A non-cryptographic hash function using AES-NI for high performance
ahash = "0.8.12"
# Measures Rust benchmark performance with statistical analysis and comparison reports.
criterion = "0.8.2"
# A speedy, non-cryptographic hashing algorithm used by rustc
rustc-hash = "2.1.3"

[lints]
workspace = true
