[package]
name = "algorithms"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - algorithms"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["algorithms"]
publish.workspace = true
autolib = false

[dependencies]
anyhow = "1.0.102"
base16ct = { version = "1.0.0", features = ["alloc"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }
data-encoding = "2.11.0"
fastrand = "2.4.1"
hex-literal = "1.1.0"
md5 = "0.8.0"

petgraph = "0.8.3"
rand = "0.10.1"
rand_distr = "0.6.0"
ring = "0.17.14"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"

[[example]]
name = "graph"
path = "examples/graph/main.rs"
test = true

[[example]]
name = "hashing"
path = "examples/hashing/main.rs"
test = true

[[example]]
name = "rand"
path = "examples/rand/main.rs"
test = true

[[example]]
name = "sort"
path = "examples/sort/main.rs"
test = true
