[package]
name = "cryptography"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - cryptography"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license = "CC0-1.0"
keywords.workspace = true
categories = ["cryptography"]
publish.workspace = true
autolib = false

[dependencies]
aes-gcm = "0.10.3"
aes-gcm-siv = "0.11.1"
anyhow = "1.0.100"
argon2 = "0.5.3"
base64ct = "1.8.0"
bcrypt = "0.17.1"
chacha20poly1305 = "0.10.1"
data-encoding = "2.9.0"
der = { version = "0.7.10", features = ["derive", "alloc"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
p256 = { version = "0.13.2", features = ["pkcs8"] }
pkcs8 = "0.10.2"
rand = { version = "0.10.1", features = ["os_rng", "thread_rng"] }
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
ring = "0.17.14"
rsa = "0.9.10"
scrypt = "0.11.0"
subtle = "2.6.1"
zeroize = "1.8.2"
