[package]
name = "cryptography"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples for Cryptography including AES, RSA, and TLS implementations."

autolib = false
categories = ["cryptography"]
keywords = ["cryptography", "encryption", "tls", "aes", "rsa", "security"]
publish.workspace = true

[dependencies]
aes-gcm = "0.10.3"
aes-gcm-siv = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.5.3"
base64 = "0.23.1"
base64ct = "1.8.3"
bcrypt = "0.19.3"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
der = { version = "0.8.2", features = ["derive", "alloc"] }
digest = "0.11.3"
dsa = "0.6.3"
ecdsa = "0.16.9"
ed25519 = "3.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
hex = "0.4.3"
hyper = { version = "1.12.0", features = ["client"] }
hyper-tls = "0.6.0"
keyring = "4.2.0"
native-tls = "0.2.18"
p256 = { version = "0.13.2", features = ["pkcs8"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
pkcs8 = "0.11.0"
rand = "0.10.3"
rand_core = "0.10.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
rsa = "0.9.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.12.0", features = ["password-hash", "getrandom", "phc"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
signature = "3.0.0"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# Mozilla's WebPKI roots for validating public TLS server certificates.
webpki-roots = "1.0.10"
x509-cert = { version = "0.2.5", features = ["builder"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
# Generate a temporary localhost certificate for the TLS handshake test.
rcgen = "0.14.10"

[[example]]
name = "aead"
path = "examples/aead/main.rs"
test = true

[[example]]
name = "encryption"
path = "examples/encryption/main.rs"
test = true

[[example]]
name = "certs"
path = "examples/certs/main.rs"
test = true

[[example]]
name = "password_hashing"
path = "examples/password_hashing/main.rs"
test = true

[[example]]
name = "rsa"
path = "examples/rsa.rs"
test = true

[[example]]
name = "secrets"
path = "examples/secrets/main.rs"
test = true

[[example]]
name = "sign"
path = "examples/sign/main.rs"
test = true

[[example]]
name = "tls"
path = "examples/tls/main.rs"
test = true

[[example]]
name = "utilities"
path = "examples/utilities/main.rs"
test = true

[lints]
workspace = true
