[package]
name = "template_engine"
version.workspace = true
description = "Code examples for popular Rust template engines including Tera and TinyTemplate."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["templates", "tera", "tinytemplate", "web", "rendering"]
categories = ["template-engine"]
autolib = false

[[example]]
name = "tera"
path = "examples/tera/main.rs"
test = true

[[example]]
name = "tinytemplate"
path = "examples/tinytemplate/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
tera = { version = "2.4.0", features = ["glob_fs"] }
tinytemplate = "1.2.1"

[lints]
workspace = true
