[package]
name = "filesystem"
version.workspace = true
description = "Book code examples and their crate dependencies - filesystem"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["filesystem"]
autolib = false

[[example]]
name = "atomic_write"
path = "examples/atomic_write/main.rs"
test = true

[[example]]
name = "directories"
path = "examples/directories/main.rs"
test = true

[[example]]
name = "directory_traversal"
path = "examples/directory_traversal/main.rs"
test = true

[[example]]
name = "file_watching"
path = "examples/file_watching/main.rs"
test = true

[[example]]
name = "metadata"
path = "examples/metadata/main.rs"
test = true

[[example]]
name = "open"
path = "examples/open.rs"
test = true

[[example]]
name = "paths"
path = "examples/paths/main.rs"
test = true

[[example]]
name = "read_write"
path = "examples/read_write/main.rs"
test = true

[[example]]
name = "stdin_stdout"
path = "examples/stdin_stdout/main.rs"
test = true

[[example]]
name = "symbolic_links"
path = "examples/symbolic_links/main.rs"
test = true

[[example]]
name = "tempfile"
path = "examples/tempfile/main.rs"
test = true

[[example]]
name = "user_directories"
path = "examples/user_directories/main.rs"
test = true

[dependencies]
anyhow = "1.0.104"
atomicwrites = "0.4.4" # Atomic file replacement.
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
dirs = "7.0.0"
pathdiff = "0.2.3" # Relative paths between two paths.
dunce = "1.0.5" # Canonicalize paths without the Windows `\\?\` prefix.
glob = "0.3.4"
globset = "0.4.21"
ignore = "0.4.34"
infer = "0.22.0" # Detect file types from their content.
memmap2 = "0.9.12"
notify = "8.2.1"
open = "5.4.5"
remove_dir_all = { version = "1.0.0", features = ["parallel"] }
same-file = "1.0.6"
# tempdir is outdated, replaced by tempfile
tempfile = "3.27.0"
utils = { path = "../../utils" }
walkdir = "2.5.0"

[lints]
workspace = true
