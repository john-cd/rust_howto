[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# API client for crates.io
crates_io_api = "0.12.0"
# A substitute implementation of the compiler's `proc_macro` API to decouple token-based libraries from the procedural macro use case.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# Builds Rust token streams with quasi-quoting macros for procedural macros.
quote = "1.0.47"
# Parser and evaluator for Cargo's flavor of Semantic Versioning
semver = "1.0.28"
# Parser for Rust source code
syn = { version = "3.0.10", features = ["full", "visit"] }
# Application-level tracing for Rust.
tracing = "0.1.44"
# Utilities for implementing and composing `tracing` subscribers.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# A simple event-driven library for parsing WebAssembly binary files.
wasmparser = "0.263.0"

[dev-dependencies]
# structured access to the output of `cargo metadata`
cargo_metadata = "0.23.1"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Macro to generate doc comments
doc-comment = "0.3.4"
# Interact with git repositories just like git would
gix = { version = "0.90.0", default-features = false, features = ["revision", "blob-diff", "sha1"] }
# A minimal `syn` syntax tree pretty-printer
prettyplease = "0.3.0"
# Isolated filesystem fixtures for local crate-index examples.
tempfile = "3.27.0"
# Yet another format-preserving TOML parser.
toml_edit = "0.25.19"
# Local Cargo, metadata, and book-index operations reused from the helper tools.
tool_lib = { path = "../../../../tools/tool_lib" }
# Rust converter from the WebAssembly binary format to the text format.
wasmprinter = "0.263.0"
# Rust parser for the WebAssembly Text format, WAT
wat = "1.263.0"

[lints]
workspace = true
