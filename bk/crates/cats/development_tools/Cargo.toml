[package]
name = "development_tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - development_tools"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools"]
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crates_io_api = "0.12.0"
doc-comment = "0.3.4"
semver = "1.0.28"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "crate_registries"
path = "examples/crate_registries/main.rs"
test = true

[[example]]
name = "documentation"
path = "examples/documentation/main.rs"
test = true

[[example]]
name = "rustdoc4"
path = "examples/rustdoc4.rs"
test = true

[[example]]
name = "semver"
path = "examples/semver/main.rs"
test = true

