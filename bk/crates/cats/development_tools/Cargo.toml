[package]
license-file.workspace = true
name = "development_tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Book code examples and their crate dependencies - development_tools"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["development-tools"]
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crates_io_api = "0.12.0"
doc-comment = "0.3.4"
gix = { version = "0.90.0", default-features = false, features = ["revision", "blob-diff", "sha1"] }
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
semver = "1.0.28"
syn = { version = "3.0.9", features = ["full", "visit"] }
toml_edit = "0.25.17+spec-1.1.0"
# Local Cargo, metadata, and book-index operations reused from the helper tools.
tool_lib = { path = "../../../../tools/tool_lib" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasmparser = "0.262.0"
wasmprinter = "0.262.0"
wat = "1.262.0"

[dev-dependencies]
# Isolated filesystem fixtures for local crate-index examples.
tempfile = { workspace = true }

[[example]]
name = "cargo_metadata"
path = "examples/rust_source/cargo_metadata.rs"
test = true

[[example]]
name = "git_churn"
path = "examples/automation/git_churn.rs"
test = true

[[example]]
name = "workspace_lints"
path = "examples/automation/workspace_lints.rs"
test = true

[[example]]
name = "find_unwraps"
path = "examples/rust_source/find_unwraps.rs"
test = true

[[example]]
name = "quote_prettyplease"
path = "examples/rust_source/quote_prettyplease.rs"
test = true

[[example]]
name = "wasm_roundtrip"
path = "examples/rust_source/wasm_roundtrip.rs"
test = true

[[example]]
name = "syn_file"
path = "examples/rust_source/syn_file.rs"
test = true

[[example]]
name = "crate_indices"
path = "examples/crate_indices/main.rs"
test = true

[[example]]
name = "crate_registries"
path = "examples/crate_registries/main.rs"
test = true

[[example]]
name = "documentation"
path = "examples/documentation/main.rs"
test = true

[[example]]
name = "rustdoc4"
path = "examples/rustdoc4.rs"
test = true

[[example]]
name = "semver"
path = "examples/semver/main.rs"
test = true

[[example]]
name = "documentation_doc_comment"
path = "examples/documentation/doc_comment.rs"
test = true

[lints]
workspace = true
