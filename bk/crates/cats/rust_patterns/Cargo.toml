[package]
name = "rust_patterns"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - rust_patterns"

autolib = false
categories = ["rust-patterns"]
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.4.0"
dyn-clone = "1.0.20"
either = "1.19.0"
frunk = "0.5.0"
frunk_core = "0.5.0"
# Use the maintained `imbl` fork instead of upstream `im`.
imbl = "7.0.2"
# eyre is outdated, see color-eyre
itertools = "0.15.0"
miette = { version = "7.6.0", features = ["fancy"] }
pin-project = "1.1.13"
# pin-project-lite = "0.2.16"
rpds = "1.2.1"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
zen-engine = "2.1.6"

[[example]]
name = "decision_table"
path = "examples/business_rules/decision_table.rs"
test = true

[[example]]
name = "behavioral_patterns"
path = "examples/behavioral_patterns/main.rs"
test = true

[[example]]
name = "builder_pattern"
path = "examples/builder_pattern/main.rs"
test = true

[[example]]
name = "creational_patterns"
path = "examples/creational_patterns/main.rs"
test = true

[[example]]
name = "error"
path = "examples/error/main.rs"
test = true

[[example]]
name = "functional_programming"
path = "examples/functional_programming/main.rs"
test = true

[[example]]
name = "rust_specific_patterns"
path = "examples/rust_specific_patterns/main.rs"
test = true

[[example]]
name = "structural_patterns"
path = "examples/structural_patterns/main.rs"
test = true

[[example]]
name = "scopeguard"
path = "examples/scopeguard.rs"
test = true

[lints]
workspace = true
