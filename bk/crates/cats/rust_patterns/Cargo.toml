[package]
name = "rust_patterns"
version.workspace = true
description = "Book code examples and their crate dependencies - rust_patterns"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
categories = ["rust-patterns"]
autolib = false

[[example]]
name = "decision_table"
path = "examples/business_rules/decision_table.rs"
test = true

[[example]]
name = "behavioral_patterns"
path = "examples/behavioral_patterns/main.rs"
test = true

[[example]]
name = "builder_pattern"
path = "examples/builder_pattern/main.rs"
test = true

[[example]]
name = "creational_patterns"
path = "examples/creational_patterns/main.rs"
test = true

[[example]]
name = "error"
path = "examples/error/main.rs"
test = true

[[example]]
name = "functional_programming"
path = "examples/functional_programming/main.rs"
test = true

[[example]]
name = "rust_specific_patterns"
path = "examples/rust_specific_patterns/main.rs"
test = true

[[example]]
name = "structural_patterns"
path = "examples/structural_patterns/main.rs"
test = true

[[example]]
name = "scopeguard"
path = "examples/scopeguard.rs"
test = true

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# An error report handler for panics and eyre::Reports for colorful, consistent, and well formatted error reports for all kinds of errors.
color-eyre = "0.6.5"
# Fast CSV parsing with support for serde.
csv = "1.4.0"
# Clone trait that is dyn-compatible
dyn-clone = "1.0.20"
# The enum `Either` with variants `Left` and `Right` is a general purpose sum type with two cases.
either = "1.19.0"
# Frunk provides developers with a number of functional programming tools like HList, Coproduct, Generic, LabelledGeneric, Validated, Monoid,...
frunk = "0.5.0"
# Frunk core provides developers with HList, Coproduct, LabelledGeneric and Generic
frunk_core = "0.5.0"
# Use the maintained `imbl` fork instead of upstream `im`.
imbl = "7.0.2"
# eyre is outdated, see color-eyre
itertools = "0.15.0"
# Fancy diagnostic reporting library and protocol for us mere mortals who aren't compiler hackers.
miette = { version = "7.6.0", features = ["fancy"] }
# A crate for safe and ergonomic pin-projection.
pin-project = "1.1.13"
# pin-project-lite = "0.2.16"
# Persistent data structures with structural sharing
rpds = "1.2.1"
# A RAII scope guard that will run a given closure when it goes out of scope, even if the code between panics (assuming unwinding panic). Defines...
scopeguard = "1.2.0"
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
# A JSON serialization file format
serde_json = "1.0.154"
# Derives standard Error implementations for custom Rust error types.
thiserror = "2.0.21"
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["rt"] }
# Evaluates decision tables and business rules expressed in Zen Engine definitions.
zen-engine = "2.1.7"

[lints]
workspace = true
