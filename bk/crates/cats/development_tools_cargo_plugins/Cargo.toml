[package]
name = "cargo"
version.workspace = true
description = "Book code examples for creating and using Cargo plugins and automating tasks with xshell."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["cargo", "plugins", "xshell", "automation", "development-tools"]
categories = ["development-tools::cargo-plugins"]
autoexamples = false

[[bin]]
name = "cargo-hello"
path = "examples/write_cargo_plugin/main.rs"
test = true

[[example]]
name = "building"
path = "examples/building/main.rs"
test = true

[dependencies]
## General
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# structured access to the output of `cargo metadata`
cargo_metadata = "0.23.1" # Read the workspace layout from `cargo metadata`.
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# Re-usable CLI flags for `cargo` plugins
clap-cargo = { version = "0.19.0", features = ["cargo_metadata"] } # Standard cargo flags for clap.
# A library for managing temporary files and directories.
tempfile = "3.27.0"
# Application-level tracing for Rust.
tracing = "0.1.44"
[dev-dependencies]
# Utilities for implementing and composing `tracing` subscribers.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Utilities for quick shell scripting in Rust
xshell = "0.2.7"

[lints]
workspace = true
