[package]
name = "cargo"
version.workspace = true
description = "Book code examples for creating and using Cargo plugins and automating tasks with xshell."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["cargo", "plugins", "xshell", "automation", "development-tools"]
categories = ["development-tools::cargo-plugins"]
autoexamples = false

[[bin]]
name = "cargo-hello"
path = "examples/write_cargo_plugin/main.rs"
test = true

[[example]]
name = "building"
path = "examples/building/main.rs"
test = true

[dependencies]
## General
anyhow = "1.0.104"
cargo_metadata = "0.23.1" # Read the workspace layout from `cargo metadata`.
clap = { version = "4.6.7", features = ["derive"] }
clap-cargo = { version = "0.19.0", features = ["cargo_metadata"] } # Standard cargo flags for clap.
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xshell = "0.2.7"

[lints]
workspace = true
