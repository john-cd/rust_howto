[package]
name = "web_programming_http_server"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Examples for building web servers using Actix-web, Axum, Rocket, and gRPC with Tonic."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["http-server", "actix-web", "axum", "rocket", "grpc", "tonic"]
categories = ["web-programming::http-server"]
publish.workspace = true
autolib = false

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-build"]

[features]
async-graphql-support = ["dep:async-graphql", "dep:async-graphql-axum"]
leptos-support = ["dep:leptos"]
rocket-support = ["dep:rocket"]
loco-support = ["dep:loco-rs"]

[dependencies]
# trillium = "0.2.20"
# [trillium: do we need LATER](https://github.com/john-cd/rust_howto/issues/1314)
actix-web = "4.13.0"
anyhow = "1.0.102"
async-graphql = { version = "7.2.1", optional = true }
async-graphql-axum = { version = "7.2.1", optional = true }
axum = "0.8.9"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
leptos = { version = "0.8.19", optional = true }
loco-rs = { version = "0.16.4", optional = true }
prost = "0.14.3"
rocket = { version = "0.5.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net"] }
tonic = "0.14.5"
tonic-prost = "0.14.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["full", "auth"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"
