[package]
name = "web_programming_http_server"
version.workspace = true
description = "Examples for building web servers using Actix-web, Axum, Rocket, and gRPC with Tonic."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["http-server", "actix-web", "axum", "rocket", "grpc", "tonic"]
categories = ["web-programming::http-server"]
autolib = false

[package.metadata.cargo-machete]
ignored = ["prost"]

[[example]]
name = "actix_web"
path = "examples/actix_web.rs"
test = true

[[example]]
name = "async_graphql"
path = "examples/async_graphql.rs"
test = true
required-features = ["async-graphql-support"]

[[example]]
name = "axum_extras"
path = "examples/axum_extras/main.rs"
test = true

[[example]]
name = "axum"
path = "examples/axum.rs"
test = true

[[example]]
name = "grpc"
path = "examples/grpc/main.rs"
test = true

[[example]]
name = "hyper_server"
path = "examples/hyper_server.rs"
test = true

[[example]]
name = "leptos"
path = "examples/leptos.rs"
test = true

[[example]]
name = "loco"
path = "examples/loco/main.rs"
test = true

[[example]]
name = "middleware"
path = "examples/middleware/main.rs"
test = true

[[example]]
name = "openapi"
path = "examples/openapi/main.rs"
test = true

[[example]]
name = "rocket"
path = "examples/rocket.rs"
test = true

[[example]]
name = "rust_i18n"
path = "examples/rust_i18n.rs"
test = true

[dependencies]
# Parse and compare Accept-Language header strings
accept-language = "3.1.0"
# Actix Web is a powerful, pragmatic, and extremely fast web framework for Rust
actix-web = { version = "4.19.0", default-features = false, features = ["macros"] }
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# A GraphQL server library implemented in Rust
async-graphql = { version = "~7.0.19", optional = true }
# async-graphql for axum
async-graphql-axum = { version = "~7.0.19", optional = true }
# HTTP routing and request handling library that focuses on ergonomics and modularity
axum = { version = "0.8.9", features = ["macros"] }
# Extra utilities for axum
axum-extra = { version = "0.12.6", features = ["typed-header"] }
# 🛎️ One-time notification messages for Axum.
axum-messages = "0.8.0"
# High level server designed to be used with axum framework.
axum-server = { version = "0.9.1", features = ["tls-rustls"] }
# Types and traits for working with bytes
bytes = "1.12.1"
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { version = "4.6.7", features = ["derive"] }
# A set of types for representing HTTP requests and responses.
http = "1.5.0"
# Combinators and adapters for HTTP request or response bodies.
http-body-util = "0.1.5"
# A protective and efficient HTTP library for all.
hyper = { version = "1.12.0", features = ["full"] }
# Provides runtime, client, server, and protocol utilities for Hyper applications.
hyper-util = "0.1.21"
# JSON schema validaton library
jsonschema = "0.61.1"
# Leptos is a full-stack, isomorphic Rust web framework leveraging fine-grained reactivity to build declarative user interfaces.
leptos = { version = "0.8.23", optional = true }
# The one-person framework for Rust
loco-rs = { version = "1.3.1", optional = true, default-features = false }
# A Protocol Buffers implementation for the Rust Language.
prost = "0.14.5"
# Rust X.509 certificate generator
rcgen = "0.14.10"
# higher level HTTP client library
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Web framework with a focus on usability, security, extensibility, and speed.
rocket = { version = "0.5.2", optional = true }
# Rust I18n is use Rust codegen for load YAML file storage translations on compile time, and give you a t! macro for simply get translation texts.
rust-i18n = "4.2.4"
# Rustls is a modern TLS library written in Rust.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }
# Generate JSON Schemas from Rust code
schemars = "1.2.3"
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
# A JSON serialization file format
serde_json = "1.0.154"
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# Utilities to work with `Stream` and `tokio`.
tokio-stream = { version = "0.1.19", features = ["net"] }
# A gRPC over HTTP/2 implementation focused on high performance, interoperability, and flexibility.
tonic = "0.14.9"
# Prost codec implementation for tonic
tonic-prost = "0.14.9"
# grpc-web protocol translation for tonic services.
tonic-web = "0.14.9"
# Tower is a library of modular and reusable components for building robust clients and servers.
tower = { version = "0.5.3", features = ["util"] }
# Cookie manager middleware for tower.
tower-cookies = "0.11.0"
# Tower middleware and utilities for HTTP clients and servers
tower-http = { version = "0.7.1", features = ["full", "auth"] }
# 🥠 Sessions as a `tower` and `axum` middleware.
tower-sessions = { version = "0.15.0", features = ["memory-store"] } # Pinned: axum-messages 0.8 (latest) needs tower-sessions 0.14; 0.15 is out.
# Application-level tracing for Rust.
tracing = "0.1.44"
# Utilities for implementing and composing `tracing` subscribers.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Compile time generated OpenAPI documentation for Rust
utoipa = { version = "6.0.0", features = ["axum_extras"] }
# Swagger UI for utoipa
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
# Test harness for ui tests of compiler diagnostics
trybuild = "1.0.122"

[build-dependencies]
# A rust implementation of the protobuf compiler.
protox = "0.10.0" # Compile .proto files without launching a protoc executable.
# Prost build integration for tonic
tonic-prost-build = "0.14.9"

[features]
async-graphql-support = ["dep:async-graphql", "dep:async-graphql-axum"]
leptos-support = ["dep:leptos", "leptos/csr"]
rocket-support = ["dep:rocket"]
loco-support = ["dep:loco-rs"]

[lints]
workspace = true
