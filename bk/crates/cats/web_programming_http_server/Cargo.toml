[package]
name = "web_programming_http_server"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Book code examples and their crate dependencies - web_programming_http_server"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license = "CC0-1.0"
keywords.workspace = true
categories = ["web_programming_http_server"]
publish.workspace = true
autolib = false

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-build"]

[features]
loco = ["dep:loco-rs"]
async-graphql-support = ["async-graphql", "async-graphql-axum"]
leptos-support = ["leptos"]
rocket-support = ["rocket"]

[dependencies]
# trillium = "0.2.20"
# [trillium: do we need LATER](https://github.com/john-cd/rust_howto/issues/1314)
actix-web = "4.9.0"
anyhow = "1.0.100"
async-graphql = { version = "7.0.17", optional = true }
async-graphql-axum = { version = "7.0.17", optional = true }
axum = "0.8.4"
bytes = "1.11.1"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
rocket = { version = "0.5.0-rc.3", optional = true }
leptos = { version = "0.8.2", optional = true }
loco-rs = { version = "0.16.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
prost = "0.14.1"
serde_json = "1.0.138"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
tonic = "0.14.2"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["full", "auth"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
