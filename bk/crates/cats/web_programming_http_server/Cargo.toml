# TODO Reviewed ??-??-2026

[package]
name = "web_programming_http_server"
version.workspace = true
authors.workspace = true
autolib = false
categories = ["web-programming::http-server"]
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["http-server", "actix-web", "axum", "rocket", "grpc", "tonic"]
license-file.workspace = true
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Examples for building web servers using Actix-web, Axum, Rocket, and gRPC with Tonic."

[package.metadata.cargo-machete]
ignored = ["prost"]

[features]
async-graphql-support = ["dep:async-graphql", "dep:async-graphql-axum"]
leptos-support = ["dep:leptos", "leptos/csr"]
rocket-support = ["dep:rocket"]
loco-support = ["dep:loco-rs"]

[dependencies]
# Trillium is listed in the middleware draft but has no example here.
# Add it as a dependency if a Trillium example is introduced.
# The example uses HTTP/1 only; enabling Actix's default HTTP/2 feature pulls
# the vulnerable h2 0.3 line.
actix-web = { version = "4.18.1", default-features = false, features = ["macros"] }
anyhow = "1.0.104"
async-graphql = { version = "7.2.1", optional = true }
async-graphql-axum = { version = "7.2.1", optional = true }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-messages = "0.8.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
# Adapts Tokio streams to Hyper's runtime-neutral I/O traits.
hyper-util = "0.1.21"
jsonschema = "0.60.1"
leptos = { version = "0.8.22", optional = true }
# This HTTP example does not need Loco's database or queue integrations.
loco-rs = { version = "1.2.0", optional = true, default-features = false }
prost = "0.14.4"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rocket = { version = "0.5.2", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# Provides a stream wrapper for the ephemeral Tokio listener in the gRPC test.
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.7.1", features = ["full", "auth"] }
tower-sessions = { version = "0.15.0", features = ["memory-store"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[build-dependencies]
protox = "0.10.0" # Compile .proto files without launching a protoc executable.
tonic-prost-build = "0.14.6"

[[example]]
name = "actix_web"
path = "examples/actix_web.rs"
test = true

[[example]]
name = "async_graphql"
path = "examples/async_graphql.rs"
test = true
required-features = ["async-graphql-support"]

[[example]]
name = "axum_extras"
path = "examples/axum_extras/main.rs"
test = true

[[example]]
name = "axum"
path = "examples/axum.rs"
test = true

[[example]]
name = "grpc"
path = "examples/grpc/main.rs"
test = true

[[example]]
name = "hyper_server"
path = "examples/hyper_server.rs"
test = true

[[example]]
name = "leptos"
path = "examples/leptos.rs"
test = true

[[example]]
name = "loco"
path = "examples/loco/main.rs"
test = true

[[example]]
name = "middleware"
path = "examples/middleware/main.rs"
test = true

[[example]]
name = "openapi"
path = "examples/openapi/main.rs"
test = true

[[example]]
name = "rocket"
path = "examples/rocket.rs"
test = true

[lints]
workspace = true
