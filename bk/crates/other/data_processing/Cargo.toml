[package]
name = "data_processing"
version.workspace = true
description = "Book code examples and their crate dependencies - data_processing"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["patterns", "cookbook", "howto", "how-to", "documentation", "Rust bible"]
autolib = false

[[example]]
name = "dataframes"
path = "examples/dataframes/main.rs"
test = true

[[example]]
name = "data_processing"
path = "examples/data_processing/main.rs"
test = true
required-features = ["arrow"]

[[example]]
name = "datafusion"
path = "examples/datafusion/main.rs"
test = true
required-features = ["datafusion"]

[[example]]
name = "object_store_round_trip"
path = "examples/object_store_round_trip.rs"
test = true
required-features = ["object-storage"]

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.3.2", features = ["csv", "json", "prettyprint"], optional = true }
arrow-array = { version = "59.3.2", optional = true }
arrow-cast = { version = "59.3.2", features = ["prettyprint"], optional = true }
arrow-ipc = { version = "59.3.2", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
datafusion = { version = "55.2.0", default-features = false, features = ["sql"], optional = true }
futures-util = { version = "0.3.34", optional = true }
object_store = { version = "0.14.2", features = ["fs"], optional = true }
polars = { version = "0.55.2", default-features = false, features = ["lazy"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1.54.1", features = ["macros", "rt"], optional = true }

[features]
object-storage = ["dep:object_store", "dep:futures-util", "dep:tempfile", "dep:tokio"]
arrow = ["dep:arrow", "dep:arrow-array", "dep:arrow-cast", "dep:arrow-ipc", "dep:clap", "dep:serde", "dep:serde_json"]
datafusion = ["dep:datafusion", "dep:tokio"]

[lints]
workspace = true
