# TODO Reviewed ??-??-2026.

[graph]
# Audit optional example stacks in the advisory workflow with
# `cargo deny --all-features check advisories`.
all-features = false

[advisories]
# Record each no-fix advisory explicitly with a reason. Revisit the entries
# when an upstream fix is available.
ignore = [
  { id = "RUSTSEC-2026-0291", reason = "No fixed owned-alloc or lockfree release exists. The sole path is the Linux-only Glommio teaching example, which documents the panicking-Drop trigger and production risk. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is pulled through elliptic-curve 0.13.8 and jsonwebtoken 10.4.0 by the latest meilisearch-sdk 0.33.0 and SurrealDB 4.0.1 dependency paths. Fixed versions start at 0.7.6; recheck when those upstream stacks move to elliptic-curve 0.14. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2023-0071", reason = "The locked graph still selects rsa 0.9.10 through jsonwebtoken 10.4.0, openidconnect 4.1.0, and the reqsign 0.20.7 stack from zen-engine 2.1.7. These dependencies require the 0.9 series. The patched range starts at 0.10.0. Remove this exception once all affected paths accept a fixed release. Review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2026-0459", reason = "The bk/crates database adapters currently resolve libsqlite3-sys 0.37.0: SQLx 0.9.0 caps it below 0.38 and Diesel 2.3.14 below 0.39. Bundled SQLite before 3.54.0 is affected, so this records an unresolved risk, not a remediation. Upgrade the adapters together to resolve patched libsqlite3-sys >=0.39.0, then remove this entry; review by 2026-12-16. https://github.com/john-cd/rust_howto/issues/2245" },
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is pulled through multiple workspace examples and helper crates; RustSec lists no patched release. Replace affected upstream macros or remove their dependency paths, then remove this exception. Review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2025-0035", reason = "macroquad 0.4.16 is used only by the game_engines and games teaching examples; RustSec lists no fixed release. Remove or replace those example paths, then remove this exception. Review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is used by several workspace examples; upstream considers it complete and has no patched release. Migrate affected serialization paths to a maintained format, then remove this exception. Review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2026-0542", reason = "humantime has no patched release and is unmaintained because it wraps chrono. Replace direct and transitive uses with maintained alternatives, then remove this exception. Review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2026-0543", reason = "chrono has no patched release; it is widely used by workspace examples and upstream dependencies. Coordinate migration to jiff or time and compatible upstreams, then remove this exception. Review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is pulled through font and GUI examples; RustSec lists no patched release. Replace the parser with skrifa or remove affected paths once compatible upstream releases are available. Review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2247" },
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example renders generated geometry and does not extract archives or preserve archive permissions. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example does not accept archives or call ZipArchive::extract. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example does not extract archives or apply archive permissions through symlinks. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example renders generated geometry and does not extract archives. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0545", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example does not create or read encrypted archives. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0546", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example does not accept archives or call ZipArchive::extract. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0547", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example does not decompress archive entries. Recheck when ggez accepts zip 9; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
  { id = "RUSTSEC-2026-0548", reason = "zip 8.6.0 is pinned by ggez 0.10.0 in the game_engines teaching example, which requires zip 8.x. That example does not stream or extract archives. Recheck when ggez accepts zip 9.0.5 or newer; review by 2027-01-19. https://github.com/john-cd/rust_howto/issues/2116" },
]
unmaintained = "workspace"
unsound = "workspace"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-2-Clause-Patent",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MITNFA",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "X11",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
  # The mathematics examples intentionally demonstrate arbitrary precision
  # through rug/GMP. Readers obtain these LGPL crates independently from
  # crates.io; the book publishes neither their sources nor linked binaries.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
  { crate = "rug@=1.30.0", allow = ["LGPL-3.0-or-later"] },
  { crate = "gmp-mpfr-sys@=1.7.1", allow = ["LGPL-3.0-or-later"] },
  # The optional SurrealDB example uses kv-mem and parse to teach an embedded
  # in-memory database. Upstream 4.0.1 ships these exact packages with BUSL-1.1
  # license files. The book publishes the example source only.
  # Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2282
  { crate = "surrealdb@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-catalog@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-cnf@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-collections@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-common@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-core@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-datastore@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-engine-api@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-engine-local@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-expr@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-iam@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-idx@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-keyspace-macro@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-kvs@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-kvs-any@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-kvs-mem@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-observe@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-parse-common@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-parser-next@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-rpc@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-runtime@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-stored-derive@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-strand@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-types@=4.0.1", allow = ["BUSL-1.1"] },
  { crate = "surrealdb-types-derive@=4.0.1", allow = ["BUSL-1.1"] },
]

# The upstream manifests use the deprecated LGPL-3.0+ identifier.
# Review by 2026-12-16: https://github.com/john-cd/rust_howto/issues/2283
[[licenses.clarify]]
crate = "gmp-mpfr-sys@=1.7.1"
expression = "LGPL-3.0-or-later"
license-files = [{ path = "LICENSE-LGPL.md", hash = 0x3ad3d07a }]

[[licenses.clarify]]
crate = "rug@=1.30.0"
