# Configuration for `cargo deny check`
# See https://embarkstudios.github.io/cargo-deny/

# The graph table configures how the dependency graph is constructed
[graph]
all-features = false
no-default-features = false

# Security advisories check
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# Advisory IDs to ignore
ignore = [
    # ansi_term is unmaintained but still used transitively
    "RUSTSEC-2021-0139",
]

# License check
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "AGPL-3.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# Bans check
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Known duplicate crates that can be skipped
skip = [
    "windows-sys@0.59.0",
    "windows-sys@0.52.0",
    "windows-sys@0.48.0",
    "windows-targets@0.48.5",
    "windows_aarch64_gnullvm@0.48.5",
    "windows_aarch64_msvc@0.48.5",
    "windows_i686_gnu@0.48.5",
    "windows_i686_msvc@0.48.5",
    "windows_x86_64_gnu@0.48.5",
    "windows_x86_64_gnullvm@0.48.5",
    "windows_x86_64_msvc@0.48.5",
    "syn@1.0.109",
    "sync_wrapper@0.1.2",
    "regex-syntax@0.6.29",
    "regex-automata@0.1.10",
    "bitflags@1.3.2",
    "hashbrown@0.14.5",
]

# Sources check
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
