[graph]
# Audit optional example stacks in the advisory workflow with
# `cargo deny --all-features check advisories`.
all-features = false

[advisories]
# Record each no-fix advisory explicitly with a reason. Revisit the entries
# when an upstream fix is available.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "No fixed rsa release exists. The only use is a local encryption/key-format teaching example; both examples warn against network exposure and production use." },
  { id = "RUSTSEC-2025-0141", reason = "The encoding chapter demonstrates Bincode 2 format interoperability; 1.3.3 is also transitive through hyphenation and syntect. Bincode 3.0.0 is an intentional compile_error release, so these stable versions remain with an explicit maintenance warning." },
  { id = "RUSTSEC-2026-0291", reason = "No fixed owned-alloc or lockfree release exists. The sole path is the Linux-only Glommio teaching example, which documents the panicking-Drop trigger and production risk." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is pinned by elliptic-curve 0.13 (p256/p384 0.13) through jsonwebtoken 11.1.0 in the authentication chapter; the cryptography chapter already uses p256 0.14. Revisit when jsonwebtoken moves to elliptic-curve 0.14." },
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 is pinned by zen-engine 2.1.6 (rust_patterns); no newer zen-engine exists. The book's own zip 9.x dependency (compression chapter) is not affected, and the decision_table example does not extract archives." },
  { id = "RUSTSEC-2026-0368", reason = "Same zen-engine pin as RUSTSEC-2026-0367: the vulnerable extract() is never called by the examples." },
  { id = "RUSTSEC-2026-0369", reason = "Same zen-engine pin as RUSTSEC-2026-0367: the vulnerable extract() is never called by the examples." },
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 is pinned by pingora-core (git rev in network_programming); pingora HEAD still uses 0.13.3 as of 2026-10-28. The network_programming sources do not call zstd directly." },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0 is pinned through zstd 0.13.3 by pingora; the Seekable API is not used." },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0 is pinned through zstd 0.13.3 by pingora; legacy-frame streaming decompression is not used by the examples." },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 is pinned by object_store 0.13.2 in the optional SurrealDB 3.3.4 stack. The example instantiates only the in-memory Mem engine and does not parse user-supplied XML; object_store requires quick-xml ^0.39.0, so updating the lockfile to the fixed 0.41.0 was rejected by Cargo. Revisit when SurrealDB releases an object_store dependency that accepts a fixed quick-xml." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 is pinned by object_store 0.13.2 in the optional SurrealDB 3.3.4 stack. The example instantiates only the in-memory Mem engine and does not parse user-supplied XML; object_store requires quick-xml ^0.39.0, so updating the lockfile to the fixed 0.41.0 was rejected by Cargo. Revisit when SurrealDB releases an object_store dependency that accepts a fixed quick-xml." },
]
unmaintained = "workspace"
unsound = "workspace"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-2-Clause-Patent",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MITNFA",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "X11",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
  # The text_processing example specifically teaches concat_strs; it is not
  # linked into a product binary or distributed as part of the book build.
  { crate = "concat_strs@1.0.2", allow = ["AGPL-3.0"] },
  { crate = "concat_strs_impl@1.0.1", allow = ["AGPL-3.0"] },
  # The mathematics examples intentionally demonstrate arbitrary precision
  # through rug/GMP. Readers obtain these LGPL crates independently from
  # crates.io; the book publishes neither their sources nor linked binaries.
  { crate = "rug@1.30.0", allow = ["LGPL-3.0-or-later"] },
  { crate = "gmp-mpfr-sys@1.7.1", allow = ["LGPL-3.0-or-later"] },
]

[licenses.private]
# Workspace examples are not published packages; the root LICENSE is not an
# SPDX license grant for these private workspace members.
ignore = true

[bans]
# Keep duplicate and wildcard dependency debt visible without hiding crates.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/john-cd/book_tooling",
  # Pingora is pinned to a git revision (see the `pingora` workspace dependency).
  "https://github.com/cloudflare/pingora",
]
