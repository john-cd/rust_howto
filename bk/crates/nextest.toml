[profile.default]
## Default number of retries for tests
retries = 0

[profile.ci]
## Handle transient failures in CI environments
retries = 2

## Minimize I/O by only showing relevant output
failure-output = "immediate-final"
success-output = "never"

## Identify and kill hung tests early
[profile.ci.slow-timeout]
period = "60s"
terminate-after = 2

[[profile.ci.overrides]]
filter = 'test(test_heavy_integration)'
threads_required = 2
