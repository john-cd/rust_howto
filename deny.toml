# TODO Reviewed ??-??-2026

# Shared cargo-deny policy for advisories, licenses, duplicate versions, and sources.
# See https://embarkstudios.github.io/cargo-deny/ for the configuration reference.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = [
  # Dependabot alerts #148 and #288: zenoh-transport 1.10.2 requires lz4_flex 0.10.0,
  # which predates the fix in 0.11.6. The direct science_robotics dependency now uses
  # 0.14.0, but it does not replace Zenoh's separate transitive 0.10.0 copy.
  # Remove when Zenoh accepts a fixed release.
  {
    id = "RUSTSEC-2026-0041",
    reason = "zenoh-transport 1.10.2 still introduces lz4_flex 0.10.0 through the optional Zenoh feature; the fixed direct science_robotics dependency no longer selects this vulnerable version. Zenoh's version constraint prevents updating its transitive dependency. Tracked in #2116.",
  },
  # Dependabot alert #86: trading-calendar 0.2.3 requires lru 0.12.5; the fix is >=0.16.3.
  # The repo's unsound = "workspace" scope does not scan this transitive dependency;
  # retain the narrow exception to record the Dependabot disposition without broadening policy.
  {
    id = "RUSTSEC-2026-0002",
    reason = "Dependabot reports lru 0.12.5 via trading-calendar 0.2.3; no upstream release accepts fixed lru yet. The current unsound = workspace policy excludes transitive deps. Tracked in #2116.",
  },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-2-Clause-Patent",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MITNFA",
  "MPL-2.0",
  "NCSA",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
  "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # The tools workspace pins book_tooling in Cargo.lock.
  "https://github.com/john-cd/book_tooling",
]
