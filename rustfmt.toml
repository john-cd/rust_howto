# Use the workspace's Rust syntax and style conventions.
edition = "2024"
style_edition = "2024"

# Keep source and wrapped comments within the repository's 100-column style.
max_width = 100
comment_width = 100

# Use portable LF line endings and four-space indentation.
newline_style = "Unix"
hard_tabs = false
tab_spaces = 4

# Group imports by standard library, external crate, and local crate; keep item-level imports.
reorder_imports = true
group_imports = "StdExternalCrate"
imports_granularity = "Item"

# Wrap and normalize comments, and format code examples inside documentation comments.
wrap_comments = true
normalize_comments = true
format_code_in_doc_comments = true

# Keep implementation blocks and macro matchers consistently formatted.
reorder_impl_items = true
condense_wildcard_suffixes = true
format_macro_matchers = true

# Some settings above are nightly-only; rustfmt-toolchain.toml and Makefile.toml pin that formatter.
unstable_features = true
