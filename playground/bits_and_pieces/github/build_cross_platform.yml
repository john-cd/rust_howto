name: Build cross-platform

on: [push]

env:
  # The project name specified in your Cargo.toml
  PROJECT_NAME: <insert-name>

jobs:
  build:
    # Set the job to run on the platform specified by the matrix below
    runs-on: ${{ matrix.runner }}

    # Define the build matrix for cross-compilation
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: win-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    # The steps to run for each matrix item
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load pinned stable Rust version
        id: load-stable-rust
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rust_version="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          if [[ -z "$rust_version" ]]; then
            echo "Could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load-stable-rust.outputs.version }}
          targets: "${{ matrix.target }}"

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --verbose --locked --release --target ${{ matrix.target }}

      # - name: Release Binary
