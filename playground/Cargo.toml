[workspace]
members = ["examples_wip"]
resolver = "3"

# Default values for packages in the workspace
[workspace.package]
version = "0.1.2"
authors = ["John CD"]
edition = "2024"
rust-version = "1.90"
description = "Experimental scratchpad and work-in-progress snippets for the Rust How-to project."
documentation = "https://docs.rs/rust_howto/"
homepage = "https://john-cd.com/rust_howto/"
repository = "https://github.com/john-cd/rust_howto/tools/"
keywords = ["rust-howto", "playground", "experimental", "snippets"]
categories = ["development-tools"]
publish = false
