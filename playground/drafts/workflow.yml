# Playground Workflow Template
# Cleaned up version of the draft workflow
# Reference: https://github.com/john-cd/rust_howto/issues/1268

name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'playground/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'playground/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./playground

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Cache Cargo registry and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            playground/target/
            target/
          key: ${{ runner.os }}-playground-cargo-${{ hashFiles('playground/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-playground-cargo-

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Build
        run: cargo build --workspace --all-targets --all-features --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --verbose

  # ---------------------------------------------------------------------
  # Resources & Alternatives
  # ---------------------------------------------------------------------
  # - toolchain setup: https://github.com/actions-rust-lang/setup-rust-toolchain
  # - rust-cache: https://github.com/marketplace/actions/rust-cache
  # - sccache-action: https://github.com/marketplace/actions/sccache-action
  # - build-push-action: https://github.com/marketplace/actions/build-and-push-docker-images
