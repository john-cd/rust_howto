[package]
name = "tool_lib"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Tools & templates for the rust_howto book"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["markdown generation"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
publish = false


[dependencies]
anyhow = "1.0.102"
cargo_toml = "0.22.3"
crates_io_api = "0.12.0"
itertools = "0.14.0"
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
similar = "3.1.0"
tinytemplate = "1.2.1"
toml = "1.1.2"
tracing = "0.1.44"
trim-in-place = "0.1.7"
walkdir = "2.5.0"

[dev-dependencies]
chrono = "0.4.44"
mockito = "1.7.2"
tempfile = "3.27.0"
serde_json = "1.0.149"
url = "2.5.8"
