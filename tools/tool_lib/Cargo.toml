[package]
name = "tool_lib"
version.workspace = true
description = "Tools & templates for the rust_howto book"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
keywords = ["markdown generation"]
categories = ["development-tools", "command-line-utilities", "text-processing"]

[[bench]]
name = "tool_lib_bench"
harness = false

[[bench]]
name = "templates"
harness = false

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = { workspace = true }
# `Cargo.toml` struct definitions for parsing with Serde
cargo_toml = { workspace = true }
# API client for crates.io
crates_io_api = { workspace = true }
# Extra iterator adaptors, iterator methods, free functions, and macros.
itertools_014 = { workspace = true }
# Single assignment cells and lazy values.
once_cell = { workspace = true }
# A lightweight regex engine that optimizes for binary size and compilation time.
regex = { workspace = true }
# higher level HTTP client library
reqwest = { workspace = true }
# A generic serialization/deserialization framework
serde = { workspace = true }
# A diff library for Rust
similar = { workspace = true }
# A library for managing temporary files and directories.
tempfile = { workspace = true }
# Simple, lightweight template engine
tinytemplate = { workspace = true }
# A native Rust encoder and decoder of TOML-formatted files and streams. Provides implementations of the standard Serialize/Deserialize traits for...
toml = { workspace = true }
# Application-level tracing for Rust.
tracing = { workspace = true }
# Trims whitespace from strings in place without allocating a new string.
trim-in-place = { workspace = true }
# Recursively walk a directory.
walkdir = { workspace = true }

[dev-dependencies]
# Date and time library for Rust
chrono = { workspace = true }
# Measures Rust benchmark performance with statistical analysis and comparison reports.
criterion = { workspace = true }
# HTTP mocking for Rust.
mockito = { workspace = true }
# A JSON serialization file format
serde_json = { workspace = true }
# URL library for Rust, based on the WHATWG URL Standard
url = { workspace = true }

[lints]
workspace = true
