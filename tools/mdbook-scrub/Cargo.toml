# TODO Reviewed ??-??-2026
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
license-file.workspace = true
name = "mdbook-scrub"
version = "0.2.0"
edition = "2024"

description = "A mdbook preprocessor"
readme = "README.md"
homepage = "https://github.com/john-cd/rust_howto/"
keywords = ["book", "mdbook", "rustbook", "documentation"]
categories = ["command-line-utilities", "text-processing", "parser-implementations"]

[dependencies]
anyhow = "1.0.104" # Adds chapter and directive context to preprocessing errors.
book_tool = { git = "https://github.com/john-cd/book_tooling", rev = "404e8fe0d4adc40517b0b40a2536cc6833b29059", default-features = false, features = ["directives"] } # Reuses directives without the CLI's HTTP stack.
clap = { version = "4.6.7", features = ["cargo"] }
mdbook-preprocessor = "0.5.4"
parse_lib = { git = "https://github.com/john-cd/book_tooling", rev = "404e8fe0d4adc40517b0b40a2536cc6833b29059" } # Protects code and comments during legacy cleanup.
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[dev-dependencies]
mdbook-driver = "0.5.4"
