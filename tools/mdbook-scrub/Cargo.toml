# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "mdbook-scrub"
version = "0.2.0"
edition = "2024"
license-file.workspace = true
publish.workspace = true

categories = ["command-line-utilities", "text-processing", "parser-implementations"]
homepage = "https://github.com/john-cd/rust_howto/"
keywords = ["book", "mdbook", "rustbook", "documentation"]
readme = "README.md"
description = "A mdbook preprocessor"

[dependencies]
anyhow = { workspace = true } # Adds chapter and directive context to preprocessing errors.
book_tool = { workspace = true } # Reuses directives without the CLI's HTTP stack.
clap = { workspace = true }
mdbook-preprocessor = { workspace = true }
parse_lib = { workspace = true } # Protects code and comments during legacy cleanup.
regex = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
mdbook-driver = { workspace = true }

[lints]
workspace = true
