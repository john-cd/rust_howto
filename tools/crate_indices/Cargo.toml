[package]
name = "crate_indices"
version.workspace = true
description = "Generates the crate index pages of the book and updates its crate reference definitions."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "README.md"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["markdown generation"]
categories = ["development-tools", "command-line-utilities", "text-processing"]

[[bin]]
name = "crate-indices"
path = "src/main.rs"

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = { workspace = true }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { workspace = true }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap_builder = { workspace = true }
# Extra iterator adaptors, iterator methods, free functions, and macros.
itertools = { workspace = true }
# Tools & templates for the rust_howto book
tool_lib = { workspace = true }
# Application-level tracing for Rust.
tracing = { workspace = true }
# Utilities for implementing and composing `tracing` subscribers.
tracing-subscriber = { workspace = true }

[dev-dependencies]
# A library for managing temporary files and directories.
tempfile = { workspace = true }

[lints]
workspace = true
