# Shared profiles are inherited from the repository root .cargo/config.toml.
# Reviewed 10-26-2026

# Shared build paths and sccache settings are inherited from the root .cargo/config.toml.

# Lean debug info: halves build time and target size; panics keep readable backtraces.

[env]
SCCACHE_BASEDIRS = { value = ".", relative = true }

[profile.dev.package]
memchr = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
smallvec = { opt-level = 3 }
syn = { opt-level = 3 }

[profile.debug.package]
memchr = { opt-level = 3, debug = 0 }
proc-macro2 = { opt-level = 3, debug = 0 }
quote = { opt-level = 3, debug = 0 }
regex = { opt-level = 3, debug = 0 }
regex-automata = { opt-level = 3, debug = 0 }
regex-syntax = { opt-level = 3, debug = 0 }
smallvec = { opt-level = 3, debug = 0 }
syn = { opt-level = 3, debug = 0 }


# Cargo defaults reference (Cargo 1.100.0). Comments only.
#
# [build]
# target = <host>
# target-dir = "target"
# build-dir = <unset; defaults to target-dir>
# rustc-wrapper = <unset>
# incremental = <profile default>
#
# [env]
# <variable> = <unset>
#
# [net]
# retry = 3
# git-fetch-with-cli = false
# offline = false
#
# [term]
# quiet = false
# verbose = false
# color = "auto"
# hyperlinks = true
# unicode = true
# progress.when = "auto"
# progress.width = 80
# progress.term-integration = true
#
# [alias]
# b = "build"
# c = "check"
# d = "doc"
# t = "test"
# r = "run"
# rm = "remove"
#
# [profile.dev]
# opt-level = 0
# debug = true
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = true
# overflow-checks = true
# lto = false
# panic = "unwind"
# incremental = true
# codegen-units = 256 when incremental is enabled; otherwise 16
# rpath = false
#
# [profile.dev.package."*"]
# opt-level = 0
#
# [profile.dev.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.debug]
# inherits = "dev"
#
# [profile.test]
# inherits = "dev"
#
# [profile.release]
# opt-level = 3
# debug = false
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = false
# overflow-checks = false
# lto = false
# panic = "unwind"
# incremental = false
# codegen-units = 16
# rpath = false
#
# [profile.release.package."*"]
# opt-level = 3
#
# [profile.release.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.bench]
# inherits = "release"
