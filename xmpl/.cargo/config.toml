# Shared profiles are inherited from the repository root .cargo/config.toml.
# Reviewed 10-26-2026

# Shared build paths and sccache settings are inherited from the root .cargo/config.toml.

# Lean debug info: halves build time and target size; panics keep readable backtraces.

[profile.dev.package]
memchr = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
smallvec = { opt-level = 3 }
syn = { opt-level = 3 }

[profile.debugging.package]
memchr = { opt-level = 0, debug = 2 }
proc-macro2 = { opt-level = 0, debug = 2 }
quote = { opt-level = 0, debug = 2 }
regex = { opt-level = 0, debug = 2 }
regex-automata = { opt-level = 0, debug = 2 }
regex-syntax = { opt-level = 0, debug = 2 }
smallvec = { opt-level = 0, debug = 2 }
syn = { opt-level = 0, debug = 2 }
