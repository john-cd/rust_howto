# Services for tests that require a database or external cache or search engines
# Don't try to run everything at once!
# Supply the required *_USER and *_PASSWORD variables through the environment or --env-file.
# URL-encode credentials used in AMQP_ADDR and MONGODB_URI.
#
# Sources:
# https://github.com/docker/awesome-compose
# https://awesome-docker-compose.com
#
services:
  book:
    environment:
      RUST_LOG: debug
      AMQP_ADDR: "amqp://${AMQP_USER:?Set AMQP_USER}:${AMQP_PASSWORD:?Set AMQP_PASSWORD}@rust_howto-amqp-1:5672"
      # GreenMail serves implicit-TLS SMTP/IMAP with this test-only root certificate.
      SMTP_SERVER: mail
      SMTP_PORT: "3465"
      SMTP_USERNAME: ${MAIL_USER:?Set MAIL_USER}
      SMTP_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      SMTP_FROM: ${MAIL_USER}@localhost
      SMTP_TO: ${MAIL_USER}@localhost
      IMAP_HOST: mail
      IMAP_PORT: "3993"
      IMAP_USER: ${MAIL_USER}
      IMAP_PASSWORD: ${MAIL_PASSWORD}
      IMAP_EXPECTED_SUBJECT: "Rust How-To local IMAP fixture"
      MAIL_TLS_ROOT_CERT: /tmp/mail-test.crt
      CASSANDRA_ADDR: cassandra:9042
      ELASTICSEARCH_ADDR: http://elasticsearch:9200
      MEILISEARCH_ADDR: http://meilisearch:7700
      MONGODB_URI: "mongodb://${MONGODB_USER:?Set MONGODB_USER}:${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}@mongodb:27017"
      MSSQL_ADDR: mssql:1433
      ORACLE_ADDR: oracle:1521
      ORACLE_CONNECT_STRING: oracle:1521/FREEPDB1
      ORACLE_USER: system
      ORACLE_USERNAME: system
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      ORACLE_DB_URL: oracle:1521/FREEPDB1
      ORACLE_DB_USERNAME: system
      ORACLE_DB_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      POSTGRES_ADDR: postgres:5432
      REDIS_HOSTNAME: redis:6379
    volumes:
      - ./mail-test.crt:/tmp/mail-test.crt:ro

  amqp:
    image: ${RABBITMQ_IMAGE:?RabbitMQ image must be defined}
    environment:
      RABBITMQ_DEFAULT_USER: ${AMQP_USER:?Set AMQP_USER}
      RABBITMQ_DEFAULT_PASS: ${AMQP_PASSWORD:?Set AMQP_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  cassandra:
    image: ${CASSANDRA_IMAGE:?Cassandra image must be defined}
    ports:
      - 9042:9042
    environment:
      - CASSANDRA_CLUSTER_NAME=cassandra_infra

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?Elasticsearch image must be defined}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 3

  meilisearch:
    image: ${MEILISEARCH_IMAGE:?Meilisearch image must be defined}
    ports:
      - 7700:7700
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped

  # https://hub.docker.com/_/mongo
  mongodb:
    image: ${MONGODB_IMAGE:?MongoDB image must be defined}
    ports:
      - "27017:27017"
    restart: always
    logging:
      options:
        max-size: 1g
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:?Set MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}

  mssql:
    image: ${MSSQL_IMAGE:?SQL Server image must be defined}
    ports:
      - 1433:1433
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      ACCEPT_EULA: "Y"

  oracle:
    image: ${ORACLE_IMAGE:?Oracle image must be defined}
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
    ports:
      - 1521:1521

  postgres:
    image: ${POSTGRES_IMAGE:?PostgreSQL image must be defined}
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=library
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - 5432

  # Local TLS mail server (SMTPS on 3465, IMAPS on 3993) with a preloaded unseen message.
  mail:
    image: ${MAIL_IMAGE:?Mail server image must be defined}
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtps -Dgreenmail.setup.test.imaps
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.startup.timeout=30000
        -Dgreenmail.users=${MAIL_USER:?Set MAIL_USER}:${MAIL_PASSWORD:?Set MAIL_PASSWORD}@localhost
        -Dgreenmail.preload.dir=/tmp/mail-preload
        -Dgreenmail.tls.keystore.file=/tmp/mail-test.p12
        -Dgreenmail.tls.keystore.password=mail-test-only
    volumes:
      - ./mail-test.p12:/tmp/mail-test.p12:ro
      - ./mail-preload:/tmp/mail-preload:ro
    ports:
      - "3465:3465"
      - "3993:3993"
    restart: unless-stopped

  # https://hub.docker.com/_/redis
  redis:
    image: ${REDIS_IMAGE:?Redis image must be defined}
    restart: always
    # command: redis-server --requirepass yourpassword # or edit redis.conf
    expose:
      - 6379

volumes:
  db_data: {}
