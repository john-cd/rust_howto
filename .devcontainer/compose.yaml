# Docker Compose reference guide: https://docs.docker.com/go/compose-spec-reference/
services:
  book:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile # path relative to context
      args:
        RUST_IMAGE_LABEL: ${RUST_IMAGE_LABEL:?rust image label must be defined}
        RUSTFMT_TOOLCHAIN: ${RUSTFMT_TOOLCHAIN:-}
        MDBOOK_VERSION: ${MDBOOK_VERSION:?mdbook version must be defined}
        MDBOOK_LINKCHECK_VERSION: ${MDBOOK_LINKCHECK_VERSION:?mdbook-linkcheck version must be defined}
        MDBOOK_INDEXING_VERSION: ${MDBOOK_INDEXING_VERSION:?mdbook-indexing version must be defined}
        MDBOOK_PANDOC_VERSION: ${MDBOOK_PANDOC_VERSION:?mdbook-pandoc version must be defined}
        MDBOOK_UTILS_REV: ${MDBOOK_UTILS_REV:?mdbook-utils revision must be defined}
        CARGO_NEXTEST_VERSION: ${CARGO_NEXTEST_VERSION:?cargo-nextest version must be defined}
        JUST_VERSION: ${JUST_VERSION:?just version must be defined}
        TECTONIC_VERSION: ${TECTONIC_VERSION:?tectonic version must be defined}
        TECTONIC_LINUX_SHA256: ${TECTONIC_LINUX_SHA256:?tectonic Linux checksum must be defined}
        CARGO_SORT_VERSION: ${CARGO_SORT_VERSION:?cargo-sort version must be defined}
        DPRINT_VERSION: ${DPRINT_VERSION:?dprint version must be defined}
        RUMDL_VERSION: ${RUMDL_VERSION:?rumdl version must be defined}
        PANDOC_VERSION: ${PANDOC_VERSION:?pandoc version must be defined}
      secrets:
        - source: github_token
          target: github_token

secrets:
  github_token:
    environment: GH_TOKEN
