# Docker Compose reference guide: https://docs.docker.com/go/compose-spec-reference/
services:
  book:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile # path relative to context
      args:
        RUST_IMAGE_LABEL: ${RUST_IMAGE_LABEL:?rust image label must be defined}
        RUSTFMT_TOOLCHAIN: ${RUSTFMT_TOOLCHAIN:-}
        MDBOOK_VERSION: ${MDBOOK_VERSION:?mdbook version must be defined}
        MDBOOK_LINKCHECK_VERSION: ${MDBOOK_LINKCHECK_VERSION:?mdbook-linkcheck version must be defined}
        MDBOOK_INDEXING_VERSION: ${MDBOOK_INDEXING_VERSION:?mdbook-indexing version must be defined}
        MDBOOK_PANDOC_VERSION: ${MDBOOK_PANDOC_VERSION:?mdbook-pandoc version must be defined}
        MDBOOK_UTILS_REV: ${MDBOOK_UTILS_REV:?mdbook-utils revision must be defined}
        CARGO_NEXTEST_VERSION: ${CARGO_NEXTEST_VERSION:?cargo-nextest version must be defined}
        JUST_VERSION: ${JUST_VERSION:?just version must be defined}
        TECTONIC_VERSION: ${TECTONIC_VERSION:?tectonic version must be defined}
        TECTONIC_LINUX_SHA256: ${TECTONIC_LINUX_SHA256:?tectonic Linux checksum must be defined}
        CARGO_FMT_TOML_VERSION: ${CARGO_FMT_TOML_VERSION:?cargo-fmt-toml version must be defined}
        DPRINT_VERSION: ${DPRINT_VERSION:?dprint version must be defined}
        RUMDL_VERSION: ${RUMDL_VERSION:?rumdl version must be defined}
        MATURIN_VERSION: ${MATURIN_VERSION:?maturin version must be defined}
        FLUTTER_VERSION: ${FLUTTER_VERSION:?Flutter version must be defined}
        FLUTTER_GIT_REVISION: ${FLUTTER_GIT_REVISION:?Flutter Git revision must be defined}
        FLUTTER_RUST_BRIDGE_CODEGEN_VERSION: ${FLUTTER_RUST_BRIDGE_CODEGEN_VERSION:?Flutter Rust Bridge codegen version must be defined}
        ORACLE_CLIENT_VERSION: ${ORACLE_CLIENT_VERSION:?Oracle Instant Client version must be defined}
        ORACLE_CLIENT_DOWNLOAD_ID: ${ORACLE_CLIENT_DOWNLOAD_ID:?Oracle download ID must be defined}
        ORACLE_CLIENT_LINUX_AMD64_BASICLITE_SHA256: ${ORACLE_CLIENT_LINUX_AMD64_BASICLITE_SHA256:?Linux x64 Oracle Basic Light checksum must be defined}
        ORACLE_CLIENT_LINUX_AMD64_SDK_SHA256: ${ORACLE_CLIENT_LINUX_AMD64_SDK_SHA256:?Linux x64 Oracle SDK checksum must be defined}
        ORACLE_CLIENT_LINUX_ARM64_BASICLITE_SHA256: ${ORACLE_CLIENT_LINUX_ARM64_BASICLITE_SHA256:?Linux ARM64 Oracle Basic Light checksum must be defined}
        ORACLE_CLIENT_LINUX_ARM64_SDK_SHA256: ${ORACLE_CLIENT_LINUX_ARM64_SDK_SHA256:?Linux ARM64 Oracle SDK checksum must be defined}
        PANDOC_VERSION: ${PANDOC_VERSION:?pandoc version must be defined}
      secrets:
        - source: github_token
          target: github_token

secrets:
  github_token:
    environment: GH_TOKEN
